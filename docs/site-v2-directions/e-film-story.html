<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction E: the film tells the call (storyboard, static mock)</title>
<style>
@font-face { font-family: "Hanken"; src: url(fonts/hanken-grotesk-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
:root { --ground:#0c0b0e; --midnight:#14224f; --glow:#2f5bff; --chalk:#ecebe6; --call:#62f07a; --dim:#a3a5ae;
  --blend: linear-gradient(90deg in oklab, var(--glow), var(--call)); }
* { box-sizing: border-box; margin: 0; }
body { background: var(--ground); color: var(--chalk); font: 400 17px/1.45 "Hanken", sans-serif; overflow-x: hidden; }
.stop { position: relative; height: 900px; overflow: hidden; background: var(--ground) center/cover no-repeat; border-bottom: 1px solid #000; }
.shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(12,11,14,.88) 0%, rgba(12,11,14,.45) 30%, transparent 44%, transparent 60%, rgba(12,11,14,.5) 100%); }
.light { position: absolute; inset: 0; mix-blend-mode: screen; pointer-events: none; }
.msg { position: absolute; left: 96px; top: 50%; transform: translateY(-50%); width: 560px; }
.msg h2 { font-size: 64px; font-weight: 650; line-height: 1; letter-spacing: -.045em; }
.msg h2 em { font-style: normal; background: var(--blend); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em; }
.msg p { margin-top: 22px; font-size: 21px; line-height: 1.38; color: #c5c7cf; max-width: 21em; letter-spacing: -.01em; }
.cta { display: inline-block; margin-top: 30px; padding: 14px 26px; border-radius: 999px; font-weight: 650; font-size: 17px; color: #06210c; background: var(--call); box-shadow: 0 0 40px -6px rgba(98,240,122,.7), inset 0 1px 0 rgba(255,255,255,.6); text-decoration: none; }
.glass { position: relative; isolation: isolate; border-radius: 30px;
  background: linear-gradient(170deg, rgba(236,235,230,.13) 0%, rgba(236,235,230,.04) 40%, rgba(47,91,255,.08) 100%);
  -webkit-backdrop-filter: blur(26px) saturate(190%) brightness(1.1); backdrop-filter: blur(26px) saturate(190%) brightness(1.1);
  box-shadow: inset 0 1.5px 0 rgba(255,255,255,.42), inset 1px 0 0 rgba(255,255,255,.1), inset 0 -1px 0 rgba(120,150,255,.28), inset 0 22px 34px -22px rgba(255,255,255,.2), inset 0 -26px 40px -26px rgba(47,91,255,.38), 0 34px 70px -24px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.35); }
.glass.won { box-shadow: inset 0 1.5px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(98,240,122,.5), inset 0 -26px 40px -26px rgba(98,240,122,.38), 0 34px 70px -24px rgba(0,0,0,.75), 0 0 50px -12px rgba(98,240,122,.5), 0 0 0 1px rgba(0,0,0,.35); }
.ledger { position: absolute; right: 96px; top: 50%; transform: translateY(-50%); width: 340px; padding: 24px 26px 26px; }
.ledger h3 { font-size: 14px; font-weight: 500; color: var(--dim); margin-bottom: 6px; }
.ledger h3:not(:first-child) { margin-top: 20px; }
.row { display: flex; align-items: center; gap: 12px; padding: 7px 0; font-size: 19px; font-weight: 600; letter-spacing: -.02em; }
.row i { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--glow); box-shadow: 0 0 12px 3px rgba(47,91,255,.85); }
.row.new { color: #fff; } .row.old { color: #b9bbc6; } .row.old i { box-shadow: none; opacity: .7; }
.feel { display: grid; grid-template-columns: 82px 1fr; align-items: center; gap: 10px; padding: 6px 0; font-size: 16px; font-weight: 600; }
.bar { height: 8px; border-radius: 5px; background: rgba(236,235,230,.1); box-shadow: inset 0 1px 2px rgba(0,0,0,.6); }
.bar b { display: block; height: 100%; border-radius: 5px; background: linear-gradient(180deg, #6f8dff, var(--glow)); box-shadow: 0 0 12px -1px rgba(47,91,255,.8); }
.cand { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; padding: 7px 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.cand .bar { grid-column: 1 / -1; } .cand span:nth-child(2) { color: var(--dim); font-variant-numeric: tabular-nums; }
.cand.out { opacity: .32; }
.cand.win .bar b { background: var(--blend); box-shadow: 0 0 16px -1px rgba(98,240,122,.7); } .cand.win span:nth-child(2) { color: var(--call); }
.note { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(236,235,230,.14); font-size: 16px; font-weight: 600; }
.landed { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 650; }
.landed i { width: 11px; height: 11px; border-radius: 50%; background: var(--call); box-shadow: 0 0 16px 4px rgba(98,240,122,.75); }
.rail { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); width: 420px; }
.rail .track { height: 4px; border-radius: 3px; background: rgba(236,235,230,.14); overflow: hidden; }
.rail .track b { display: block; height: 100%; width: 420px; background: var(--blend); }
.rail .clip { overflow: hidden; height: 4px; border-radius: 3px; }
.rail div.lab { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13.5px; font-weight: 500; color: var(--dim); }
.rail .lab span.on { color: var(--chalk); } .rail .lab span.on.g { color: var(--call); }
.nav { position: absolute; left: 50%; top: 22px; transform: translateX(-50%); display: flex; align-items: center; gap: 30px; padding: 11px 13px 11px 24px; border-radius: 999px; font-size: 14.5px; font-weight: 500; white-space: nowrap; z-index: 3; }
.nav b { font-weight: 750; letter-spacing: -.03em; font-size: 18px; margin-right: 6px; } .nav span { color: #c9cad3; }
.nav a { color: #06210c; background: var(--call); border-radius: 999px; padding: 9px 18px; font-weight: 650; text-decoration: none; }
.tag { position: absolute; left: 24px; top: 24px; font-size: 12.5px; color: #777a85; z-index: 3; }
.fine { position: absolute; right: 96px; bottom: 36px; width: 340px; font-size: 12px; line-height: 1.4; color: #8b8d97; }

@media (max-width: 700px) {
  .stop { height: 844px; }
  .shade { background: linear-gradient(180deg, rgba(12,11,14,.9) 0%, rgba(12,11,14,.55) 26%, transparent 40%, transparent 62%, rgba(12,11,14,.75) 100%); }
  .msg { left: 22px; right: 22px; top: 84px; transform: none; width: auto; }
  .msg h2 { font-size: 42px; } .msg p { font-size: 17px; margin-top: 12px; } .cta { margin-top: 16px; padding: 11px 20px; font-size: 15px; }
  .ledger { left: 14px; right: 14px; top: auto; bottom: 62px; transform: none; width: auto; padding: 14px 18px 16px; border-radius: 24px; }
  .ledger h3 { display: none; } .row { font-size: 16px; padding: 4px 0; } .row.old { display: none; }
  .feel { padding: 3px 0; font-size: 14.5px; } .cand { padding: 4px 0; font-size: 14.5px; } .cand.out { display: none; } .cand:nth-child(n+5) { display: none; }
  .note { margin-top: 8px; padding-top: 8px; font-size: 14.5px; }
  .rail { width: calc(100% - 44px); bottom: 20px; } .rail .lab { margin-top: 6px; font-size: 12px; }
  .nav { gap: 0; width: calc(100% - 28px); justify-content: space-between; top: 12px; padding: 7px 7px 7px 18px; } .nav span { display: none; }
  .tag, .fine { display: none; }
}
</style>
</head>
<body>
<script>
const S = "<i></i>";
const sit = (cls) => `<h3>The situation</h3><div class="row ${cls}">${S}2-2 count</div><div class="row ${cls}">${S}One out</div><div class="row ${cls}">${S}Runner on third</div><div class="row ${cls}">${S}3rd inning, tied</div>`;
const cand = (n, p, w, c = "") => `<div class="cand ${c}"><span>${n}</span><span>${p}%</span><div class="bar"><b style="width:${w}%"></b></div></div>`;
const mix = (o) => cand("Fastball, down and away", 26, 100, o ? "win" : "") + cand("Slider, get it over", 22, 85, o ? "out" : "") + cand("Changeup, get it over", 16, 62, o ? "out" : "") + cand("Fastball, up and away", 16, 62, o ? "out" : "") + cand("Slider, keep it down", 13, 50, o ? "out" : "");
const stops = [
  { f: "0001", at: "Film at 0%", p: 0, lab: 0, light: "radial-gradient(700px 500px at 50% 50%, rgba(20,34,79,.55), transparent 70%)",
    h: "Every pitch called.<br><em>Every call explained.</em>", s: "Watch one call get made, start to finish.", ledger: "" },
  { f: "0014", at: "Film at 15%", p: 18, lab: 1, light: "radial-gradient(700px 500px at 60% 60%, rgba(20,34,79,.7), transparent 70%)",
    h: "It starts with<br>the situation.", s: "As the parts come in, so does what the engine knows.", ledger: sit("new") },
  { f: "0027", at: "Film at 29%", p: 36, lab: 1, light: "radial-gradient(700px 520px at 55% 45%, rgba(47,91,255,.28), rgba(20,34,79,.5) 55%, transparent 76%)",
    h: "Then your pitcher.<br>Then the hitter.", s: "How each pitch feels today, and what this hitter just saw.",
    ledger: `<h3>The situation</h3><div class="row old">${S}2-2, one out, runner on third</div><h3>Your pitcher today</h3><div class="feel">Fastball<div class="bar"><b style="width:80%"></b></div></div><div class="feel">Slider<div class="bar"><b style="width:75%"></b></div></div><div class="feel">Changeup<div class="bar"><b style="width:60%"></b></div></div><h3>The hitter</h3><div class="row new">${S}Same side as your pitcher</div><div class="row new">${S}Last pitch: slider, away</div>` },
  { f: "0050", at: "Film at 54%", p: 58, lab: 2, light: "radial-gradient(520px 430px at 50% 50%, rgba(47,91,255,.42), rgba(20,34,79,.4) 55%, transparent 76%)",
    h: "Every pitch, every<br>spot, weighed.", s: "The watch closes up while the engine prices each call against all of it.",
    ledger: `<h3>What it could throw</h3>${mix(false)}<p class="note">He&rsquo;s sitting slider.</p>` },
  { f: "0065", at: "Film at 70%", p: 80, lab: 2, light: "radial-gradient(520px 430px at 50% 52%, rgba(44,176,205,.36), rgba(20,34,79,.4) 55%, transparent 76%)",
    h: "Down to <em>one.</em>", s: "He&rsquo;s looking soft. So the screen wakes up with something hard.",
    ledger: `<h3>What it could throw</h3>${mix(true)}<p class="note">He&rsquo;s sitting slider.</p>`, won: 1 },
  { f: "0072", at: "Film at 78%, then rests", p: 100, lab: 3, light: "radial-gradient(520px 430px at 50% 52%, rgba(98,240,122,.30), rgba(20,34,79,.42) 55%, transparent 76%)",
    h: "<em>Fastball, outside.</em>", s: "On the pitcher&rsquo;s wrist and the catcher&rsquo;s. Now change the situation and watch it call something else.",
    cta: "Set the situation", ledger: `<div class="landed"><i></i>Call landed</div><p class="note" style="border:0;padding-top:0;margin-top:10px;font-weight:500;color:#c5c7cf">Fastball, down and away. Top of the mix at 26%, because he&rsquo;s sitting slider.</p>`, won: 1,
    fine: "Real engine output (PitchIQ engine 1.2.3): sample right-handed starter, same-side hitter, college tables, 2-2, one out, runner on third, tied in the 3rd, after a slider away. The engine draws each call from the mix. The watch is an illustration and a prototype." },
];
const wide = !matchMedia("(max-width: 700px)").matches;
document.body.innerHTML += stops.map((s, i) => `
<section class="stop" style="background-image:url(frames/${wide ? "w" : "t"}${s.f}.webp)">
  <div class="shade"></div><div class="light" style="background:${s.light}"></div>
  <span class="tag">Storyboard ${i + 1} of ${stops.length}. ${s.at}. The frame is unchanged; only the overlay is new.</span>
  ${i === 0 ? `<nav class="nav glass"><b>PitchIQ</b><span>The call</span><span>Set the situation</span><span>The at-bat</span><span>Questions</span><a href="#">Talk to us</a></nav>` : ""}
  <div class="msg"><h2>${s.h}</h2><p>${s.s}</p>${s.cta ? `<a class="cta" href="#">${s.cta}</a>` : ""}</div>
  ${s.ledger ? `<aside class="ledger glass ${s.won ? "won" : ""}">${s.ledger}</aside>` : ""}
  <div class="rail"><div class="track"><div class="clip" style="width:${s.p}%"><b></b></div></div>
    <div class="lab"><span class="${s.lab >= 1 ? "on" : ""}">Inputs</span><span class="${s.lab >= 2 ? "on" : ""}">Decision</span><span class="${s.lab >= 3 ? "on g" : ""}">Call</span></div></div>
  ${s.fine ? `<p class="fine">${s.fine}</p>` : ""}
</section>`).join("");
</script>
</body>
</html>
