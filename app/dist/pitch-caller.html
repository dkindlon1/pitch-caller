<title>Pitch Caller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#04070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..800&display=swap">
<style>
/* Night game broadcast.
   - Ground: a stadium at night. Faint infield line art and two light towers sit behind frosted-glass panels.
   - Colour lives on data only, and it's the pitch-type colour every tracking system uses
     (fastball red, slider yellow, curveball cyan, changeup green). Chrome stays white-on-glass.
   - The one bold moment: the ambient light behind the call takes the colour of the called pitch,
     and the target in the zone locks on.
   - One family, Saira: condensed width for the call and the scoreboard, normal width for everything else.
   - Radius ladder (from Raycast's DESIGN.md): 6 keycaps, 10 controls, 16 inner tiles, 22 panels. Pills for toggles. */
:root {
  --ground: #04070c;
  --ink: #eef3f8; --muted: #a6b0bd; --faint: #808b99;
  --glass: rgba(16, 23, 33, 0.58); --glass-2: rgba(30, 41, 56, 0.55); --glass-hi: rgba(255, 255, 255, 0.055);
  --stroke: rgba(255, 255, 255, 0.09); --stroke-2: rgba(255, 255, 255, 0.17); --rule: rgba(255, 255, 255, 0.07);
  --well: rgba(0, 0, 0, 0.28);
  --primary: #f4f7fb; --primary-ink: #04070c;
  --fb: #ff5468; --sl: #f6cb4c; --cb: #45c9ff; --ch: #3ddc8c;
  --call: var(--cb);
  --warn: #ffb547; --warn-bg: rgba(255, 181, 71, 0.13);
  --neg: #ff7272;  --neg-bg: rgba(255, 114, 114, 0.13);
  --focus: #8fd8ff;
  --field-line: rgba(255, 255, 255, 0.07);
  --tower: rgba(170, 205, 255, 0.16);
  --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.75);
  --blur: blur(22px) saturate(150%);
  --font: "Saira", "Helvetica Neue", Arial, sans-serif;
  --r-key: 6px; --r-ctl: 10px; --r-tile: 16px; --r-panel: 22px;
  --gap: 16px; --pad: 22px;
  color-scheme: dark;
}
:root[data-theme="day"] {
  --ground: #d7e0ea;
  --ink: #0a1320; --muted: #475365; --faint: #586477;
  --glass: rgba(255, 255, 255, 0.62); --glass-2: rgba(255, 255, 255, 0.72); --glass-hi: rgba(255, 255, 255, 0.5);
  --stroke: rgba(20, 40, 70, 0.11); --stroke-2: rgba(20, 40, 70, 0.22); --rule: rgba(20, 40, 70, 0.08);
  --well: rgba(20, 40, 70, 0.06);
  --primary: #0a1320; --primary-ink: #ffffff;
  --fb: #d0245a; --sl: #a07c00; --cb: #1a74c8; --ch: #0f8a52;
  --warn: #9a5a00; --warn-bg: rgba(255, 170, 40, 0.18);
  --neg: #b4232f;  --neg-bg: rgba(220, 50, 60, 0.12);
  --focus: #0a6fb0;
  --field-line: rgba(20, 50, 90, 0.10);
  --tower: rgba(255, 255, 255, 0.8);
  --shadow: 0 20px 50px -30px rgba(30, 50, 80, 0.45);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--ground); }
body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
p { margin: 0; }

/* the stadium behind the glass */
.stage { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.stage svg { position: absolute; left: 50%; bottom: -14vh; width: max(1400px, 120vw); transform: translateX(-50%); height: auto; }
.stage .tower { position: absolute; top: -18vh; width: 46vw; height: 46vw; border-radius: 50%; background: radial-gradient(closest-side, var(--tower), transparent); }
.stage .tower.l { left: -14vw; } .stage .tower.r { right: -14vw; }
.stage .glow { position: absolute; left: 4vw; top: 12vh; width: 56vw; height: 56vh; border-radius: 50%; background: var(--call); opacity: .17; filter: blur(110px); }
:root[data-theme="day"] .stage .glow { opacity: .14; }

.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); padding-block: max(14px, env(safe-area-inset-top, 0px)) 48px; }

/* glass */
.glass { background: linear-gradient(180deg, var(--glass-hi), transparent 120px), var(--glass); border: 1px solid var(--stroke); border-radius: var(--r-panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); }

/* top bar */
.bar { display: flex; align-items: center; gap: 18px; height: 58px; padding: 0 10px 0 16px; border-radius: 999px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; font-stretch: 112%; letter-spacing: .01em; }
.brand svg { display: block; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--well); border: 1px solid var(--rule); }
.tabs button { height: 34px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 550; color: var(--muted); transition: background-color .15s, color .15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { background: var(--primary); color: var(--primary-ink); }
.bar .end { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); min-width: 0; }
.stamp { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn { height: 38px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background-color .15s, border-color .15s, opacity .15s; }
.btn:hover:not([disabled]) { border-color: var(--ink); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { color: var(--faint); cursor: default; opacity: .6; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover:not([disabled]) { opacity: .9; }
.btn.pill { border-radius: 999px; }
.btn.text { border-color: transparent; background: none; padding: 0 8px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-2); }
.btn.text:hover { text-decoration-color: var(--ink); }
.btn.tiny { display: block; margin: 4px 0 0 auto; padding: 0; min-height: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.btn.warn { background: var(--warn); color: #1a1000; border-color: var(--warn); }
:root[data-theme="day"] .btn.warn { color: #fff; }

/* title row */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 26px 4px 14px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 28px; font-weight: 700; font-stretch: 88%; letter-spacing: -0.005em; line-height: 1.1; text-wrap: balance; }
.head .sub { margin-top: 4px; font-size: 15px; color: var(--muted); max-width: 72ch; display: flex; align-items: center; gap: 8px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }

/* scoreboard */
.strip { display: grid; grid-template-columns: 1.25fr 0.8fr 1fr 1fr 1fr auto; padding: 6px; border-radius: var(--r-panel); }
.cell { padding: 10px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--rule); }
.cell .k { font-size: 13px; color: var(--muted); }
.cell .v { font-size: 30px; font-weight: 650; font-stretch: 75%; line-height: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell .v small { font-size: 14px; font-weight: 450; font-stretch: 100%; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.edit { justify-content: center; align-items: center; }
.lights { display: grid; grid-template-columns: auto auto; gap: 5px 8px; align-items: center; font-size: 11px; font-weight: 600; font-stretch: 100%; color: var(--faint); }
.lights span { display: flex; gap: 4px; }
.lights i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--stroke-2); }
.lights .b.on { background: var(--ch); border-color: var(--ch); box-shadow: 0 0 10px var(--ch); }
.lights .s.on { background: var(--fb); border-color: var(--fb); box-shadow: 0 0 10px var(--fb); }
.outs { display: flex; gap: 6px; }
.outs i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--stroke-2); }
.outs i.on { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px var(--warn); }
.diamond { width: 34px; height: 30px; position: relative; flex: none; }
.diamond i { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--stroke-2); border-radius: 2px; }
.diamond i.on { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 10px var(--ink); }
.diamond .b2 { left: 11.5px; top: 1px; } .diamond .b1 { right: 2px; top: 11px; } .diamond .b3 { left: 2px; top: 11px; }
:root[data-theme="day"] .lights .on, :root[data-theme="day"] .outs .on, :root[data-theme="day"] .diamond .on { box-shadow: none; }

.fix { margin-top: 10px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; border-radius: var(--r-tile); }
.stepper { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.stepper .lab { color: var(--muted); min-width: 52px; }
.stepper button { width: 38px; height: 38px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 18px; line-height: 1; }
.stepper button:hover { border-color: var(--ink); }
.stepper output { min-width: 18px; text-align: center; font-weight: 650; font-size: 17px; }
.toggles { display: flex; gap: 6px; }
.toggles button { height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--stroke-2); font-size: 14px; }
.toggles button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

/* main grid */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: var(--gap); align-items: start; }
.panel { padding: var(--pad); min-width: 0; }
.span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-12 { grid-column: 1 / -1; }
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 650; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }

/* pitch chips: sign number in the pitch's colour */
.chip { --c: var(--ink); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--c); color: var(--c); font-size: 14px; font-weight: 700; font-stretch: 75%; flex: none; line-height: 1; }
.k-FB { --c: var(--fb); } .k-SL { --c: var(--sl); } .k-CB { --c: var(--cb); } .k-CH { --c: var(--ch); }

/* the call */
.call-panel { position: relative; overflow: hidden; }
.call-panel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--call); opacity: .9; }
.hitter { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.hitter b { font-size: 17px; font-weight: 650; }
.hitter span { color: var(--muted); font-size: 14px; }
.call { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: center; padding-top: 18px; }
.call-main { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 20px; align-items: start; min-width: 0; }
.sign { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; font-weight: 750; font-stretch: 70%; margin-top: 8px; color: var(--call); border: 2px solid var(--call); background: color-mix(in srgb, var(--call) 14%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--call) 10%, transparent), 0 0 40px color-mix(in srgb, var(--call) 35%, transparent); }
.pitch { font-size: clamp(60px, 7.4vw, 104px); line-height: .9; font-weight: 750; font-stretch: 62%; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot { margin-top: 8px; font-size: clamp(24px, 2.6vw, 32px); font-weight: 600; font-stretch: 80%; color: var(--call); line-height: 1.1; }
.why { grid-column: 2; margin-top: 14px; color: var(--muted); font-size: 15px; max-width: 46ch; }
.why b { color: var(--ink); font-weight: 650; }
.readout { grid-column: 2; margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, max-content)); gap: 0; border-radius: var(--r-tile); background: var(--well); border: 1px solid var(--rule); width: max-content; max-width: 100%; }
.readout > div { padding: 10px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.readout > div + div { border-left: 1px solid var(--rule); }
.readout .k { font-size: 12px; color: var(--muted); white-space: nowrap; }
.readout .v { font-size: 24px; font-weight: 650; font-stretch: 75%; line-height: 1.05; }
.readout .v small { font-size: 13px; font-weight: 450; font-stretch: 100%; color: var(--muted); margin-left: 4px; }
.coachmark { display: inline-block; margin-left: 12px; font-size: 13px; font-weight: 650; color: var(--warn); background: var(--warn-bg); padding: 3px 10px; border-radius: 999px; vertical-align: 10px; font-stretch: 100%; letter-spacing: 0; }
.zone { padding: 10px; border-radius: var(--r-tile); background: var(--well); border: 1px solid var(--rule); }
.zone svg { display: block; width: 100%; height: auto; overflow: visible; }
.zone .lock { transform-box: fill-box; transform-origin: center; }
.call-acts { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 18px; }
.options { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
.options .t { font-size: 13px; color: var(--muted); margin-bottom: 6px; cursor: pointer; list-style: none; }
.options .t::-webkit-details-marker { display: none; }
.options[open] .t { pointer-events: none; }
@media (max-width: 700px) { .options .t { pointer-events: auto !important; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; display: flex; align-items: center; } }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(80px, 180px) 44px; gap: 12px; align-items: center; height: 36px; font-size: 14px; color: var(--muted); }
.opt .track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.opt .track i { display: block; height: 100%; background: var(--c); opacity: .55; border-radius: 3px; }
.opt.is-call { color: var(--ink); font-weight: 650; } .opt.is-call .track i { opacity: 1; box-shadow: 0 0 12px var(--c); }
.opt .p { text-align: right; color: var(--ink); }
.pick { margin-top: 18px; padding: 16px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); display: flex; flex-direction: column; gap: 12px; }
.pick .t { font-size: 14px; font-weight: 650; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s, border-color .15s; }
.seg button:hover { border-color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.seg button[aria-pressed="true"] .chip { --c: var(--primary-ink); }

/* entry keypad */
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.key { height: 66px; border-radius: var(--r-tile); border: 1px solid var(--stroke); background: linear-gradient(180deg, var(--glass-hi), transparent), var(--glass-2); display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; font-size: 17px; font-weight: 600; font-stretch: 90%; text-align: left; transition: background-color .12s, border-color .12s, transform .08s; }
.key:hover { border-color: var(--stroke-2); }
.key:active { transform: scale(.98); }
.key kbd { font: 600 12px var(--font); color: var(--muted); min-width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: var(--r-key); border: 1px solid var(--stroke-2); border-bottom-width: 2px; background: var(--well); }
.key[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.key[aria-pressed="true"] kbd { color: inherit; border-color: transparent; background: transparent; }
.detail { margin-top: 12px; padding: 14px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); display: flex; flex-direction: column; gap: 10px; }
.detail .t { font-size: 13px; color: var(--muted); }
.detail .go { display: flex; gap: 8px; margin-top: 4px; }
.fixbox { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); }
.fixbox .fixrow { display: flex; flex-direction: column; gap: 6px; }
.fixbox .t { font-size: 13px; color: var(--muted); }
.fixbox .btn { align-self: flex-start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.detail details.more { display: flex; flex-direction: column; gap: 8px; }
.detail details.more > summary { cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-2); }
.detail details.more[open] > summary { margin-bottom: 8px; }
.detail details.more .seg { margin: 6px 0 4px; }
.ab { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.ab .t { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ab ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ab li { display: grid; grid-template-columns: 32px 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; }
.ab li .c { color: var(--muted); }
.ab li .r { color: var(--muted); text-align: right; }
.ab .empty { font-size: 14px; color: var(--muted); }

/* pitcher */
.pstat { font-size: 15px; margin: 0 0 14px; padding: 10px 12px; border-radius: var(--r-ctl); }
.pstat.watch { background: var(--warn-bg); color: var(--warn); }
.pstat.change { background: var(--neg-bg); color: var(--neg); }
.pstat b { font-weight: 650; }
.trust { display: flex; flex-direction: column; gap: 14px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) 42px; gap: 6px 10px; align-items: center; font-size: 14px; }
.trow .chip { grid-row: span 2; }
.trow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .nm span { color: var(--muted); }
.trow .v { text-align: right; font-weight: 650; }
.bullet { grid-column: 2 / -1; position: relative; height: 8px; background: var(--rule); border-radius: 4px; }
.bullet i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 4px; box-shadow: 0 0 12px color-mix(in srgb, var(--c) 50%, transparent); }
.bullet.out i { opacity: .3; box-shadow: none; }
.bullet b { position: absolute; top: -5px; bottom: -5px; width: 2px; border-radius: 1px; background: var(--ink); }
.trust-note { font-size: 13px; color: var(--muted); margin-top: 14px; }

/* log table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 450; font-size: 13px; color: var(--muted); padding: 0 10px 8px; white-space: nowrap; }
td { padding: 10px; border-top: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.num, th.num { text-align: right; }
tr.pa-end td { border-bottom: 1px solid var(--stroke-2); }
.res-strong { font-weight: 650; }
.empty-row td { color: var(--muted); white-space: normal; }

/* inning over */
.done { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 34px var(--pad); }
.done h2 { font-size: 44px; font-weight: 750; font-stretch: 65%; line-height: 1; }
.done p { color: var(--muted); max-width: 52ch; }

/* setup */
.srow { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; padding-block: 22px; }
.srow.wide { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.srow.wide .desc { max-width: 72ch; }
.srow h2 { margin: 0; font-size: 18px; font-weight: 650; }
.srow .desc { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 44ch; }
.spanel { padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { text-align: left; border: 1px solid var(--stroke); border-radius: var(--r-tile); padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; background: var(--glass-2); transition: border-color .15s, background-color .15s; }
.choice:hover { border-color: var(--stroke-2); }
.choice b { font-size: 15px; font-weight: 650; }
.choice span { font-size: 13px; color: var(--muted); }
.choice[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

  const CONF_DELTA = { ball: -0.02, cstrike: 0.03, whiff: 0.05, hard: -0.08, shakeoff: -0.20 };
  const CONF_CAP_ABOVE = 0.10, CONF_REGRESS = 0.15, LOC_WINDOW = 0.010;
  const S0 = { heart: 0.72, edge: 0.50, off: 0.28, noncomp: 0.05 };
  const C0 = { heart: 0.98, edge: 0.55, off: 0.08, noncomp: 0.0 };
  const W0 = { heart: 0.12, edge: 0.20, off: 0.34, noncomp: 0.50 };
  const F0 = { heart: 0.40, edge: 0.50, off: 0.50, noncomp: 0.45 };
  const Q0 = { heart: [0.30, 0.38, 0.32], edge: [0.48, 0.34, 0.18], off: [0.60, 0.30, 0.10], noncomp: [0.75, 0.20, 0.05] };
  const ZONE_IN = { heart: 1.0, edge: 0.5, off: 0.0, noncomp: 0.0 };
  const KIND_W = { FB: -0.20, SL: 0.25, CB: 0.20, CH: 0.25 };
  const SHAPES = {
    "FB|ride": [18, 8], "FB|run": [13, 15], "FB|sink": [8, 16], "FB|cut": [12, -3], "FB|": [15, 10],
    "SL|tight": [3, -5], "SL|sweeper": [0, -15], "SL|": [2, -7],
    "CB|loopy": [-14, -5], "CB|sharp": [-8, -9], "CB|": [-10, -7],
    "CH|fade": [7, 15], "CH|drop": [3, 10], "CH|": [6, 13],
  };
  const SLOTS = { "over the top": [1.05, 1.0], "high three-quarter": [0.95, 1.6], "three-quarter": [0.88, 2.0],
    "low three-quarter": [0.78, 2.5], "sidearm": [0.62, 3.0], "submarine": [0.35, 3.2] };
  const FLIGHT_FT = 54.0, DECISION_S = 0.175, G_IN = 32.17 * 12;

  const VERSION = "0.7c";      // engine logic version; the tables carry their own fingerprint (data.version)
  function init(data) {
    D = data;
    // v0.7c travel ball (Drew): uses the high school numbers until there's travel-ball data of its own
    for (const t of [D.RE, D.CV, D.IN_PLAY, D.OUTCOME_ADJ, D.LW, D.LEVEL]) if (t && t.hs && !t.travel) t.travel = t.hs;
  }
  const dataVersion = () => (D && D.version) || null;

  // ---------------------------------------------------------------- objects
  function Pitch(o) {
    const p = Object.assign({ shape: "", velo: 0, base_conf: -1, ivb: null, hb: null, slot: "three-quarter",
      height_ft: 6.1, release_offset_in: [0, 0], strike_rate: null, traits: null }, o);
    if (p.base_conf < 0) p.base_conf = p.conf;
    return p;
  }
  function Situation(o) {
    return Object.assign({ inning: 1, margin: 0, pitch_count: 0, batters_faced: 0, level: "college_d3",
      same_side: true, last: null, hitter_seen: {}, usage_this_count: {}, timing: {}, hitter_damage: {},
      catcher_block: 3, landing_today: {}, wild_true: {} }, o);
  }
  const replace = (s, o) => Object.assign({}, s, o);
  const mph = (p) => p.velo || DEFAULT_VELO[p.kind];

  // ---------------------------------------------------------------- state values
  const basesKey = (b) => (b[0] ? "1" : "0") + (b[1] ? "2" : "0") + (b[2] ? "3" : "0");
  const re = (outs, bases, level) => (outs >= 3 ? 0.0 : D.RE[level][outs + "|" + basesKey(bases)]);
  const runScale = (level) => D.RE[level]["0|000"] / D.RE.mlb["0|000"];
  const cvKey = (b, k) => b + "-" + k;
  const V = (b, k, outs, bases, cv, level) => re(outs, bases, level) + (cv || D.CV[level])[cvKey(b, k)];

  // ---------------------------------------------------------------- confidence
  function updateConfidence(p, event) {
    let d = CONF_DELTA[event];
    if (event === "whiff" && p.kind === "FB") d += 0.02;
    if (p.strike_rate !== null && p.strike_rate !== undefined) {   // v0.7: news measured against his usual strike rate
      const c = LAND_CENTER[isOffspeed(p.kind) ? "OS" : "FB"], q = Math.min(0.95, Math.max(0.05, p.strike_rate));
      if (event === "ball") d *= (1 - c) / (1 - q);
      else if (event === "cstrike" || event === "whiff") d *= c / q;
    }
    p.conf = Math.max(0.0, Math.min(p.base_conf + CONF_CAP_ABOVE, 1.0, p.conf + d));
  }
  function regressConfidence(p) { p.conf += CONF_REGRESS * (p.base_conf - p.conf); }

  // ---------------------------------------------------------------- helpers
  function logit(p) { p = Math.min(Math.max(p, 1e-4), 1 - 1e-4); return Math.log(p / (1 - p)); }
  const sig = (x) => 1 / (1 + Math.exp(-x));
  const isOffspeed = (k) => k === "SL" || k === "CB" || k === "CH";
  const isBigSpot = (s) => s.inning >= 7 && Math.abs(s.margin) <= 2 && (s.bases[1] || s.bases[2]);
  const anyBase = (b) => b[0] || b[1] || b[2];

  // ---------------------------------------------------------------- landing today (v0.6d)
  const LAND_CENTER = { FB: 0.66, OS: 0.58 }, LAND_K = 5.0, LAND_GAIN = 4.0, LAND_MAX = 0.6;
  const DMG_SCALE = 3.0;   // v0.6e: a strong masher is worth ~+0.03 runs per pitch, like the best real fastball hitters
  function landingEstimate(p, s) {
    const ev = s.landing_today ? s.landing_today[p.name] : null;
    const center = p.strike_rate !== null && p.strike_rate !== undefined ? p.strike_rate : LAND_CENTER[isOffspeed(p.kind) ? "OS" : "FB"];
    if (!ev) return [center, center, 0];
    const [st, n] = ev;
    return [(center * LAND_K + st) / (LAND_K + n), center, n];
  }
  function wildToday(p, s) {
    if (s.wild_true && Object.keys(s.wild_true).length) return s.wild_true[p.name] || 0.0;
    const [est, center, n] = landingEstimate(p, s);
    return n ? Math.min(LAND_MAX, Math.max(0.0, LAND_GAIN * (center - est))) : 0.0;
  }

  // ---------------------------------------------------------------- landing
  // v0.7 personal traits (see engine.py TRAIT_KEYS); absent = the default engine
  const TRAIT_KEYS = ["side_cmd", "side_grade", "ahead_cmd", "behind_cmd", "stretch_cmd", "miss_heart"];
  function effective(p, s) {
    const t = p.traits;
    if (!t) return [p.command, p.grade];
    const side = s.same_side ? 0.5 : -0.5, g = (k) => t[k] || 0.0;
    let cmd = p.command + side * g("side_cmd") + g("stretch_cmd") * ((s.bases[0] || s.bases[1] || s.bases[2]) ? 1.0 : 0.0);
    if (s.strikes > s.balls) cmd += g("ahead_cmd");
    else if (s.balls > s.strikes) cmd += g("behind_cmd");
    return [cmd, p.grade + side * g("side_grade")];
  }

  function landing(p, q, s) {
    const A = D.OUTCOME_ADJ[s.level];
    const [command] = effective(p, s);
    const sc = D.LEVEL[s.level].cmd_scale ?? 1.0;   // v0.7 spread calibration (engine.py)
    const d = sc === 1.0 ? Math.min(5, Math.max(1, command + A.cmd + 2.0 * (p.conf - 0.6))) - 3   // the v0.6 formula exactly
      : Math.min(8.0, Math.max(-8.0, sc * (command - 3) + A.cmd + 2.0 * (p.conf - 0.6)));
    let z0, sl, z;
    if (q === "chase") { z0 = { heart: 0.05, edge: 0.24, off: 0.57, noncomp: 0.14 }; sl = { heart: -0.01, edge: 0.0, off: 0.04, noncomp: -0.03 }; }
    else if (q === "middle") { z0 = { heart: 0.50, edge: 0.30, off: 0.13, noncomp: 0.07 }; sl = { heart: 0.03, edge: 0.0, off: -0.02, noncomp: -0.01 }; }
    else { z0 = { heart: 0.26, edge: 0.42, off: 0.22, noncomp: 0.10 }; sl = { heart: -0.03, edge: 0.08, off: -0.03, noncomp: -0.02 }; }
    if (sc === 1.0) {   // the v0.6 straight-line shares, exactly
      z = {}; for (const k of ZONES) z[k] = z0[k] + sl[k] * d;
      if (isOffspeed(p.kind)) { z.edge -= 0.12; z.off += 0.07; z.noncomp += 0.05; }
    } else {            // v0.7: exponential shares, same first-order change around an average pitcher (engine.py)
      if (isOffspeed(p.kind)) z0 = { heart: z0.heart, edge: z0.edge - 0.12, off: z0.off + 0.07, noncomp: z0.noncomp + 0.05 };
      const w = {}; let t = 0; for (const k of ZONES) { w[k] = z0[k] * Math.exp(sl[k] / z0[k] * d); t += w[k]; }
      z = {}; for (const k of ZONES) z[k] = w[k] / t;
    }
    let mhT = p.traits ? p.traits.miss_heart || 0.0 : 0.0;
    if (mhT) {   // v0.7: where his misses go, beyond what command says
      mhT = Math.min(1.0, Math.max(-1.0, mhT));
      if (mhT > 0) { const m = 0.3 * mhT * z.off; z.off -= m; z.heart += m; }
      else { const m = 0.3 * -mhT * z.heart; z.heart -= m; z.off += m; }
    }
    const w = A.wild;
    if (w) {
      const mh = w * z.heart, me = w * z.edge;
      z.heart -= mh; z.edge -= me; z.off += 0.6 * (mh + me); z.noncomp += 0.4 * (mh + me);
    }
    const wt = wildToday(p, s);
    if (wt) {   // v0.6e: misses go both ways
      const me = wt * z.edge, mh = 0.6 * wt * z.heart;
      z.edge += 0.6 * mh - me; z.heart += 0.30 * me - mh; z.off += 0.45 * me + 0.4 * mh; z.noncomp += 0.25 * me;
    }
    const over = s.pitch_count - D.LEVEL[s.level].fatigue;
    if (over > 0) { const shift = Math.min(z.edge - 0.05, 0.02 * over / 10); z.edge -= shift; z.heart += shift; }
    for (const k of ZONES) z[k] = Math.max(z[k], 0.01);
    let t = 0; for (const k of ZONES) t += z[k];
    const out = {}; for (const k of ZONES) out[k] = z[k] / t;
    return out;
  }

  // ---------------------------------------------------------------- hitter expectation
  function expectation(p, arsenal, s, policy) {
    const m = arsenal.length;
    const hittersCount = s.balls > s.strikes && s.strikes < 2;
    const fb = arsenal.filter((x) => x.kind === "FB"), os = arsenal.filter((x) => x.kind !== "FB");
    let prior = {};
    if (fb.length && os.length) {
      const fbShare = hittersCount ? 0.65 : (s.strikes === 2 ? 0.35 : 0.5);
      for (const x of fb) prior[x.name] = fbShare / fb.length;
      for (const x of os) prior[x.name] = (1 - fbShare) / os.length;
    } else for (const x of arsenal) prior[x.name] = 1 / m;
    if (policy) {
      const lam = 0.6, np = {};
      for (const x of arsenal) np[x.name] = (1 - lam) * prior[x.name] + lam * (policy[x.name] || 0.0);
      prior = np;
    }
    let n = 0; for (const k in s.usage_this_count) n += s.usage_this_count[k];
    const k = 4.0;
    return [(k * prior[p.name] + (s.usage_this_count[p.name] || 0)) / (k + n), 1 / m];
  }

  // ---------------------------------------------------------------- tunneling
  function movement(p) {
    const base = SHAPES[p.kind + "|" + p.shape] || SHAPES[p.kind + "|"];
    return [p.ivb !== null && p.ivb !== undefined ? p.ivb : base[0], p.hb !== null && p.hb !== undefined ? p.hb : base[1]];
  }
  const flightTime = (p) => FLIGHT_FT / (mph(p) * 1.4667 * 0.92);
  function targetXY(q, sameSide, offspeed) {
    const inside = sameSide ? 1 : -1;
    switch (q) {
      case "up-in": return [7 * inside, 38];
      case "up-away": return [-7 * inside, 38];
      case "down-in": return [7 * inside, 22];
      case "down-away": return [-7 * inside, 22];
      case "middle": return [0, 30];
      default: return offspeed ? [-10 * inside, 14] : [0, 46];
    }
  }
  function pathAt(p, q, sameSide, secs) {
    const tf = flightTime(p);
    const u = Math.max(0.0, 1 - secs / tf);
    const sl = SLOTS[p.slot] || SLOTS["three-quarter"];
    const rx = sl[1] * 12 + p.release_offset_in[0];
    const rz = sl[0] * p.height_ft * 12 + p.release_offset_in[1];
    const [ivb, hb] = movement(p);
    const mx = hb, mz = ivb - 0.5 * G_IN * tf ** 2;
    const [tx, tz] = targetXY(q, sameSide, isOffspeed(p.kind));
    const ax = tx - mx, az = tz - mz;
    return [rx + (ax - rx) * u + mx * u * u, rz + (az - rz) * u + mz * u * u];
  }
  function remainingBreak(p, secs) {
    const tf = flightTime(p);
    const u = Math.max(0.0, 1 - secs / tf);
    const [ivb, hb] = movement(p);
    const mx = hb, mz = ivb - 0.5 * G_IN * tf ** 2;
    return [mx * (1 - u * u), mz * (1 - u * u)];
  }
  function tunnelScore(p1, q1, p2, q2, sameSide) {
    const a1 = pathAt(p1, q1, sameSide, DECISION_S), a2 = pathAt(p2, q2, sameSide, DECISION_S);
    const b1 = pathAt(p1, q1, sameSide, 0.0), b2 = pathAt(p2, q2, sameSide, 0.0);
    const r1 = remainingBreak(p1, DECISION_S), r2 = remainingBreak(p2, DECISION_S);
    const dT = ((a1[0] - a2[0]) ** 2 + (a1[1] - a2[1]) ** 2) ** 0.5;
    const dP = ((b1[0] - b2[0]) ** 2 + (b1[1] - b2[1]) ** 2) ** 0.5;
    const dB = ((r1[0] - r2[0]) ** 2 + (r1[1] - r2[1]) ** 2) ** 0.5;
    const dR = ((p1.release_offset_in[0] - p2.release_offset_in[0]) ** 2 + (p1.release_offset_in[1] - p2.release_offset_in[1]) ** 2) ** 0.5;
    const score = 0.6 * Math.min(dB, 18) / 18 + 0.4 * Math.min(dP, 24) / 24 - dT / 10 - dR / 8;
    return [Math.max(-1.0, Math.min(1.0, score)), dT, dB, dP];
  }
  const perceived = (p, q) => mph(p) + EV_ADJ[q];

  function pairing(p, q, s, arsenal) {
    if (!s.last) return 0.0;
    const lastName = s.last[0], lastQ = s.last[1];
    const lastResult = s.last.length > 2 ? s.last[2] : null;
    const last = arsenal.find((x) => x.name === lastName);
    if (!last) return 0.0;
    const upLast = lastQ.startsWith("up"), upNow = q.startsWith("up");
    if (last.name === p.name) {
      if (lastResult === "whiff") return lastQ === q ? 0.4 : 0.3;
      if (lastQ === q) return -0.8;
    }
    let base;
    if (last.kind === "FB") base = isOffspeed(p.kind) ? ((upLast && !upNow) ? 1.0 : 0.6) : (upLast !== upNow ? 0.3 : -0.2);
    else if (p.kind === "FB") base = upNow ? 0.6 : 0.3;
    else base = last.name === p.name ? -0.3 : 0.2;
    const gap = Math.abs(perceived(p, q) - perceived(last, lastQ));
    const speed = Math.min(gap / 16.0, 1.0) * 0.6 - 0.2;
    const tun = last.name !== p.name ? tunnelScore(last, lastQ, p, q, s.same_side)[0] : 0.0;
    return Math.max(-1.0, Math.min(1.0, 0.30 * base + speed + 0.50 * tun));
  }

  function shapeFit(p, q, s) {
    let f = 0.0;
    const up = q.startsWith("up");
    if (p.kind === "FB") {
      if (p.shape === "ride") f += up ? 0.5 : -0.2;
      if (p.shape === "sink") f += !up ? 0.5 : -0.3;
    } else {
      f += (!up || q === "chase") ? 0.4 : -1.0;
      if (p.kind === "SL" && s.same_side && (q.includes("away") || q === "chase")) f += 0.3;
    }
    if (p.kind === "CH" && s.same_side) f -= 0.3;
    return f;
  }

  function damage(p, q, s) {
    let total = 0.0;
    for (const key of [isOffspeed(p.kind) ? "OS" : "FB", q]) {
      if (key in s.hitter_damage) {
        const [score, n] = s.hitter_damage[key];
        let eff = score * n / (n + 10.0);
        if (eff < 0 && n < 20) eff *= 0.5;
        total += eff;
      }
    }
    return total;
  }

  // ---------------------------------------------------------------- outcome model
  function outcomeProbs(p, q, s, arsenal, policy, byZone) {   // byZone (optional): filled with each landing zone's own outcome mix
    const L = D.LEVEL[s.level], A = D.OUTCOME_ADJ[s.level];
    const big = isBigSpot(s);
    const cL = L.cL * (big ? 1.5 : 1.0);
    const bT = 0.4 * (big ? 0.5 : 1.0);
    const [E, neutral] = expectation(p, arsenal, s, policy);
    const T = pairing(p, q, s, arsenal);
    const f = shapeFit(p, q, s);
    const dmg = damage(p, q, s);
    const tau = (isOffspeed(p.kind) ? s.timing.OS : s.timing.FB) || 0.0;
    const tauEff = p.kind === "FB" ? tau : -tau;
    const hittersCount = s.balls > s.strikes && s.strikes < 2;
    const land = landing(p, q, s);
    const [command, grade] = effective(p, s);
    const gs = 0.25 * (L.stuff_scale ?? 1.0);
    const cw = (L.cmd_whiff ?? 0.0) * (command - 3);   // v0.7b: better command adds contact, not strikeouts (fit_spread.py)
    const out = { ball: 0, cstrike: 0, whiff: 0, foul: 0, weak: 0, solid: 0, hard: 0, wp_ball: 0, hbp: 0 };
    for (const z of ZONES) {
      const pz = land[z];
      let sl = logit(S0[z]);
      if (s.strikes === 2) sl += 0.9;
      if (s.balls === 0 && s.strikes === 0) sl -= 0.4;
      if (s.balls === 3 && s.strikes === 0) sl -= 2.0;
      else if (hittersCount) sl += (z === "heart" || z === "edge") ? 0.3 : -0.4;
      if (z === "off" && isOffspeed(p.kind)) sl += 0.2;
      const wz = ZONE_IN[z];
      sl += wz * A.zsw + (1 - wz) * A.osw;
      const S = S0[z] > 0 ? sig(sl) : 0;
      const C = (z === "edge" || z === "off") ? sig(logit(C0[z]) + A.cs) : C0[z];
      let wl = logit(W0[z]) + KIND_W[p.kind] + gs * (grade - 3) + cL * 1.5 * (p.conf - 0.6);
      wl += L.hL * (-1.5 * (E - neutral) + 0.6 * tauEff - 0.4 * DMG_SCALE * dmg);
      wl += bT * T + 0.25 * f;
      wl += wz * A.wz + (1 - wz) * A.wo;
      if (cw) wl -= cw;
      const W = sig(wl);
      const F = sig(logit(F0[z]) + (s.strikes === 2 ? 0.3 : 0));
      let hl = -gs * (grade - 3) - cL * 0.5 * (p.conf - 0.6) + L.hL * (1.0 * (E - neutral) + 0.8 * DMG_SCALE * dmg) - 0.3 * f;
      hl += 0.012 * s.batters_faced;
      hl -= L.hL * 0.5 * tauEff;   // v0.6e: off-time swings make weaker contact too
      if (p.kind === "CH" && s.same_side) hl += 0.2;
      if (z === "heart" && isOffspeed(p.kind)) hl += 0.5;
      if (isOffspeed(p.kind) && (q.startsWith("up") || q === "middle")) hl += 0.4;
      const [weak, solid, hard] = Q0[z];
      const hard2 = sig(logit(hard) + hl);
      const scale = (1 - hard2) / (weak + solid);
      const weak2 = weak * scale, solid2 = solid * scale;
      const take = 1 - S;
      let ballP = pz * take * (1 - C);
      if ((z === "noncomp" || z === "off") && A.hbp > 0) {
        const hb = Math.min(0.9, A.hbp * HBP_LOC[q] * (z === "noncomp" ? 1.0 : 0.1));
        out.hbp += ballP * hb;
        ballP *= (1 - hb);
      }
      if (z === "noncomp" && anyBase(s.bases)) {
        const wp = (isOffspeed(p.kind) ? 0.12 : 0.04) * (1 - 0.15 * (s.catcher_block - 3));
        out.wp_ball += ballP * wp;
        ballP *= (1 - wp);
      }
      out.ball += ballP;
      out.cstrike += pz * take * C;
      out.whiff += pz * S * W;
      out.foul += pz * S * (1 - W) * F;
      const contact = pz * S * (1 - W) * (1 - F);
      out.weak += contact * weak2; out.solid += contact * solid2; out.hard += contact * hard2;
      if (byZone) {   // v0.7: the outcome mix given the pitch landed in this zone (for learning from logged location)
        const take_ = 1 - S, bp = take_ * (1 - C);
        let hbpZ = 0, wpZ = 0, ballZ = bp;
        if ((z === "noncomp" || z === "off") && A.hbp > 0) { const hb = Math.min(0.9, A.hbp * HBP_LOC[q] * (z === "noncomp" ? 1.0 : 0.1)); hbpZ = ballZ * hb; ballZ *= (1 - hb); }
        if (z === "noncomp" && anyBase(s.bases)) { const wp = (isOffspeed(p.kind) ? 0.12 : 0.04) * (1 - 0.15 * (s.catcher_block - 3)); wpZ = ballZ * wp; ballZ *= (1 - wp); }
        const ct = S * (1 - W) * (1 - F);
        byZone[z] = { land: pz, ball: ballZ, wp_ball: wpZ, hbp: hbpZ, cstrike: take_ * C, whiff: S * W, foul: S * (1 - W) * F, weak: ct * weak2, solid: ct * solid2, hard: ct * hard2 };
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- situation terms
  function inPlayValue(contact, outs, bases, level) {
    const [b1, b2, b3] = bases;
    const [po, p1, p2, p3, phr, pe] = D.IN_PLAY[level][contact];
    const epv = (o, b, r) => r + re(o, b, level);
    let total = 0.0, vOut;
    if (outs + 1 >= 3) vOut = 0.0;
    else {
      const dp = (b1 && contact === "weak" && outs < 2) ? 0.20 : 0.0;
      const vDp = outs + 2 >= 3 ? 0.0 : epv(outs + 2, [false, b2, b3], 0);
      const vReg = b3 ? 0.4 * epv(outs + 1, [b1, b2, false], 1) + 0.6 * epv(outs + 1, bases, 0) : epv(outs + 1, bases, 0);
      vOut = dp * vDp + (1 - dp) * vReg;
    }
    total += po * vOut;
    let runs = b3 ? 1 : 0, v1;
    if (b2) v1 = 0.55 * epv(outs, [true, b1, false], runs + 1) + 0.45 * epv(outs, [true, b1, true], runs);
    else v1 = epv(outs, [true, b1, false], runs);
    total += (p1 + pe) * v1;
    runs = (b2 ? 1 : 0) + (b3 ? 1 : 0);
    let v2;
    if (b1) v2 = 0.4 * epv(outs, [false, true, false], runs + 1) + 0.6 * epv(outs, [false, true, true], runs);
    else v2 = epv(outs, [false, true, false], runs);
    total += p2 * v2;
    total += p3 * epv(outs, [false, false, true], +b1 + +b2 + +b3);
    total += phr * epv(outs, [false, false, false], +b1 + +b2 + +b3 + 1);
    return total;
  }
  function walkValue(outs, bases, level) {
    const [b1, b2, b3] = bases;
    const runs = (b1 && b2 && b3) ? 1 : 0;
    return runs + re(outs, [true, b1 || b2, b3 || (b1 && b2)], level);
  }
  function cost(p, q, s, arsenal, policy, cv) {
    const P = outcomeProbs(p, q, s, arsenal, policy);
    const b = s.balls, k = s.strikes, o = s.outs, B = s.bases, L = s.level;
    const afterBall = (bases, runs) => (b + 1 === 4 ? runs + walkValue(o, bases, L) : runs + V(b + 1, k, o, bases, cv, L));
    const afterStrike = () => (k + 1 === 3 ? re(o + 1, B, L) : V(b, k + 1, o, B, cv, L));
    let v = 0.0;
    v += P.ball * afterBall(B, 0);
    const nb = [false, B[0], B[1]], r = B[2] ? 1 : 0;
    v += P.wp_ball * afterBall(nb, r);
    v += P.hbp * walkValue(o, B, L);
    v += (P.cstrike + P.whiff) * afterStrike();
    v += P.foul * (k < 2 ? V(b, k + 1, o, B, cv, L) : V(b, k, o, B, cv, L));
    for (const c of ["weak", "solid", "hard"]) v += P[c] * inPlayValue(c, o, B, L);
    return [v, P];
  }

  // ---------------------------------------------------------------- decision rule
  function softmax(costs, temp, window, best) {   // costs: array of [key, cost] in insertion order
    if (best === undefined || best === null) best = Math.min(...costs.map((c) => c[1]));
    const keep = costs.filter((c) => c[1] - best <= window);
    if (!keep.length) return [];
    const mk = Math.min(...keep.map((c) => c[1]));
    const w = keep.map((c) => [c[0], Math.exp(-(c[1] - mk) / temp)]);
    let t = 0; for (const x of w) t += x[1];
    return w.map((x) => [x[0], x[1] / t]);
  }
  function candidates(arsenal, s, forced) {
    const cutoff = D.LEVEL[s.level].cutoff;
    let c = arsenal.filter((x) => x.conf >= cutoff || (forced && x.name === forced));
    if (!c.length) c = [arsenal.reduce((a, x) => (x.conf > a.conf ? x : a), arsenal[0])];
    return c;
  }
  function countStakes(b, k, level) {
    const cv = D.CV[level], [bb, kk] = D.LW[level];
    const strike = k === 2 ? kk : cv[cvKey(b, k + 1)];
    const ball = b === 3 ? bb : cv[cvKey(b + 1, k)];
    return ball - strike;
  }
  function stakesFactor(b, k, level) {
    if (!D.LW[level]) return 1.0;
    if (b === 3 && k === 0) return 0.5;   // v0.7c (Drew): 3-0 gets the tightest setting, like 3-2 (engine.py)
    let avg = 0; for (const [b_, k_] of COUNTS) avg += countStakes(b_, k_, level);
    avg /= COUNTS.length;
    return Math.min(1.5, Math.max(0.5, avg / countStakes(b, k, level)));
  }
  const ck = (name, q) => name + "|" + q;

  function mixedPolicy(arsenal, s, T = 0.010, window = 0.030, forced = null, iters = 8, cv = null) {
    const cands = candidates(arsenal, s, forced);
    const k = runScale(s.level);
    const f = stakesFactor(s.balls, s.strikes, s.level);
    T = T * k; window = window * k * Math.min(1.0, f);
    const temp = T * (isBigSpot(s) ? 0.5 : 1.0) * f;
    let policy = null, costs = null;
    for (let it = 0; it < iters; it++) {
      costs = new Map();
      for (const p of cands) for (const q of QUADS) costs.set(ck(p.name, q), cost(p, q, s, arsenal, policy, cv)[0]);
      const tq = targets(s.balls, s.strikes);
      const bestBy = cands.map((p) => [p.name, Math.min(...tq.map((q) => costs.get(ck(p.name, q))))]);
      const pp = new Map(softmax(bestBy, temp, window));
      const nw = {}; for (const x of arsenal) nw[x.name] = pp.get(x.name) || 0.0;
      if (policy === null) policy = nw;
      else { const m = {}; for (const kk in nw) m[kk] = 0.5 * policy[kk] + 0.5 * nw[kk]; policy = m; }
    }
    return [policy, costs, temp];
  }
  const minAllowed = (costs, tq) => { let m = Infinity; for (const [key, v] of costs) if (tq.includes(key.slice(key.lastIndexOf("|") + 1)) && v < m) m = v; return m; };

  function atBatValues(arsenal, s, T = 0.010, window = 0.030, sweeps = 10, iters = 4) {
    const cv = Object.assign({}, D.CV[s.level]);
    const base = re(s.outs, s.bases, s.level);
    const order = COUNTS.slice().sort((a, b) => -(a[0] + a[1]) + (b[0] + b[1]));   // stable: same as Python
    for (let sw = 0; sw < sweeps; sw++) {
      let delta = 0.0;
      for (const [b, k] of order) {
        const same = b === s.balls && k === s.strikes;
        const sc = replace(s, { balls: b, strikes: k, last: same ? s.last : null, usage_this_count: same ? s.usage_this_count : {} });
        const [policy, costs, temp] = mixedPolicy(arsenal, sc, T, window, null, iters, cv);
        let ev = 0.0;
        const tq = targets(b, k), bestOk = minAllowed(costs, tq);
        for (const name in policy) {
          const pp = policy[name];
          if (pp <= 0) continue;
          let loc = softmax(tq.map((q) => [q, costs.get(ck(name, q))]), temp,
            LOC_WINDOW * runScale(s.level) * Math.min(1.0, stakesFactor(b, k, s.level)), bestOk);
          if (!loc.length) {
            let bq = tq[0]; for (const q of tq) if (costs.get(ck(name, q)) < costs.get(ck(name, bq))) bq = q;
            loc = [[bq, 1.0]];
          }
          let sub = 0; for (const [q, pq] of loc) sub += pq * costs.get(ck(name, q));
          ev += pp * sub;
        }
        const nv = ev - base;
        delta = Math.max(delta, Math.abs(nv - cv[cvKey(b, k)]));
        cv[cvKey(b, k)] = nv;
      }
      if (delta < 0.001) break;
    }
    const zero = cv["0-0"], rel = {};
    for (const key in cv) rel[key] = cv[key] - zero;
    return [rel, cv];
  }

  const KINDS = ["FB", "SL", "CB", "CH"];
  function checkInputs(arsenal, s) {   // v0.7c: impossible input gets a clear error, not a crash or a silent empty call
    if (!arsenal || !arsenal.length) throw new Error("no pitches: the arsenal is empty");
    const names = arsenal.map((x) => x.name);
    if (new Set(names).size !== names.length) throw new Error(`two pitches share a name: ${names.join(", ")}`);
    for (const x of arsenal) if (!KINDS.includes(x.kind)) throw new Error(`unknown pitch kind "${x.kind}" for ${x.name}`);
    if (!D.LEVEL[s.level] || !D.RE[s.level]) throw new Error(`unknown level "${s.level}"`);
    if (!(s.balls >= 0 && s.balls <= 3 && s.strikes >= 0 && s.strikes <= 2)) throw new Error(`impossible count ${s.balls}-${s.strikes}`);
    if (!(s.outs >= 0 && s.outs <= 2)) throw new Error(`impossible number of outs ${s.outs}`);
    if (!s.bases || s.bases.length !== 3) throw new Error("bases must be three flags (1st, 2nd, 3rd)");
  }

  function callMixed(arsenal, s, opts = {}) {
    checkInputs(arsenal, s);
    const T = opts.T ?? 0.010, window = opts.window ?? 0.030, forced = opts.forced ?? null, iters = opts.iters ?? 8;
    const rng = opts.rng || Math.random, atBat = opts.atBat ?? true;
    const cv = atBat ? atBatValues(arsenal, s, T, window)[1] : null;
    const [policy, costs, temp] = mixedPolicy(arsenal, s, T, window, forced, iters, cv);
    let pPitch = Object.entries(policy).filter(([, v]) => v > 0.005);
    let t = 0; for (const [, v] of pPitch) t += v;
    pPitch = pPitch.map(([kk, v]) => [kk, v / t]);
    const dist = [];
    const tq = targets(s.balls, s.strikes), overall = minAllowed(costs, tq);
    for (const [name, pp] of pPitch) {
      let loc = softmax(tq.map((q) => [q, costs.get(ck(name, q))]), temp,
        LOC_WINDOW * runScale(s.level) * Math.min(1.0, stakesFactor(s.balls, s.strikes, s.level)), overall);
      if (!loc.length) {
        let bq = tq[0]; for (const q of tq) if (costs.get(ck(name, q)) < costs.get(ck(name, bq))) bq = q;
        loc = [[bq, 1.0]];
      }
      const p = arsenal.find((x) => x.name === name);
      for (const [q, pq] of loc) dist.push({ prob: pp * pq, cost: costs.get(ck(name, q)), pitch: p, quad: q });
    }
    if (opts.exclude && opts.exclude.length) {   // never re-call what he just shook off (unless nothing else is left)
      const kept = dist.filter((d) => !opts.exclude.some(([n, q]) => d.pitch.name === n && d.quad === q));
      if (kept.length) { const t_ = kept.reduce((a, d) => a + d.prob, 0); dist.length = 0; for (const d of kept) dist.push(Object.assign(d, { prob: d.prob / t_ })); }
    }
    dist.sort((a, b) => b.prob - a.prob);
    const r = rng();
    let acc = 0.0;
    for (const d of dist) { acc += d.prob; if (r <= acc) return { pick: d, dist, best: overall, policy }; }
    return { pick: dist[dist.length - 1], dist, best: overall, policy };
  }

  function gradeCall(arsenal, s, pitchName, quad, opts = {}) {
    const { dist } = callMixed(arsenal, s, opts);
    // v0.7c: scored the way the call is made: count values solved for this matchup, and only the targets allowed here
    const cv = (opts.atBat ?? true) ? atBatValues(arsenal, s)[1] : null;
    const [policy, costs] = mixedPolicy(arsenal, s, 0.010, 0.030, null, 8, cv);
    const p = arsenal.find((x) => x.name === pitchName);
    const cHuman = costs.has(ck(pitchName, quad)) ? costs.get(ck(pitchName, quad)) : cost(p, quad, s, arsenal, policy, cv)[0];
    const tq = targets(s.balls, s.strikes), best = minAllowed(costs, tq), allowed = tq.includes(quad);
    let prob = 0; for (const d of dist) if (d.pitch.name === pitchName && d.quad === quad) prob += d.prob;
    return { call: pitchName + " " + quad, engine_prob: prob, runs_vs_best: cHuman - best, allowed,
      verdict: !allowed ? "costly" : prob >= 0.02 ? "in the engine's mix" : (cHuman - best <= 0.03 * runScale(s.level) ? "close" : "costly"),
      engine_top: dist.slice(0, 3).map((d) => [d.pitch.name, d.quad, d.prob]) };
  }

  // ---------------------------------------------------------------- "time for a change" (flags.py)
  function pitcherStatus(arsenal, level, pitchCount, recent) {
    const L = D.LEVEL[level];
    const trusted = arsenal.filter((p) => p.conf >= L.cutoff);
    let slide = 0; for (const p of arsenal) slide += Math.max(0.0, p.base_conf - p.conf); slide /= arsenal.length;
    const over = pitchCount - L.fatigue;
    const last6 = (recent || []).slice(-6);
    const traffic = last6.filter((r) => r === "walk" || r === "hbp" || r === "hard").length;
    const reasons = []; let score = 0;
    if (!trusted.length) { reasons.push("he trusts none of his pitches right now"); score += 3; }
    else if (trusted.length === 1 && arsenal.length > 1) { reasons.push(`he's down to one pitch he trusts (${trusted[0].name})`); score += 1; }
    if (slide >= 0.15) { reasons.push(`confidence is down ${slide.toFixed(2)} from his bullpen on average`); score += 1; }
    if (over >= 20) { reasons.push(`${over} pitches past his usual fatigue point`); score += 2; }
    else if (over >= 0) { reasons.push(`at his fatigue point (${pitchCount} pitches)`); score += 1; }
    if (traffic >= 4) { reasons.push(`${traffic} of his last ${last6.length} batters walked, were hit, or hit it hard`); score += 2; }
    else if (traffic >= 3) { reasons.push(`${traffic} of his last ${last6.length} batters walked, were hit, or hit it hard`); score += 1; }
    return { status: score >= 3 ? "change" : (score >= 1 ? "watch" : "ok"), reasons, trusted: trusted.map((p) => p.name), score };
  }

  const api = { VERSION, dataVersion, init, Pitch, Situation, QUADS, targets, COUNTS, landing, expectation, movement, tunnelScore, pairing,
    outcomeProbs, cost, mixedPolicy, atBatValues, callMixed, gradeCall, candidates, stakesFactor, countStakes,
    runScale, re, updateConfidence, effective, TRAIT_KEYS, regressConfidence, pitcherStatus, isOffspeed, isBigSpot, landingEstimate, wildToday };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  else root.PitchEngine = api;
})(typeof window !== "undefined" ? window : this);

<script>
/*
 * Pitch Caller database: IndexedDB on the device, built to sync later.
 *
 * Every record has a string id (random, unique across devices), createdAt, updatedAt, and deletedAt for soft deletes,
 * so a future sync (Supabase or anything else) can upsert by id and resolve conflicts by updatedAt.
 *
 * Stores
 *   teams      our team and opponents                          index: isOurs
 *   pitchers   our pitchers, with their arsenal inline           index: teamId
 *   catchers   our catchers (blocking grade feeds the engine)    index: teamId
 *   hitters    opponent hitters with season stats                index: teamId
 *   checkins   a pitcher's pre-game check-in                     index: pitcherId, date
 *   sessions   TrackMan / Rapsodo bullpen sessions               index: pitcherId
 *   games      one per game charted                              index: date, opponentId
 *   events     one per pitch thrown, with what the engine predicted for it   index: gameId, pitcherId, hitterId
 *   learned    the learning models, one per pitcher and one per hitter       (id "p:<pitcherId>" / "h:<hitterId>")
 *   meta       schema version, settings
 *
 * Works in the browser (window.PCDB) and in Node with fake-indexeddb (module.exports) for tests.
 */
(function (root) {
  "use strict";
  const NAME = "pitchcaller", VERSION = 1;
  const STORES = {
    teams: ["isOurs"], pitchers: ["teamId"], catchers: ["teamId"], hitters: ["teamId"],
    checkins: ["pitcherId", "date"], sessions: ["pitcherId"], games: ["date", "opponentId"],
    events: ["gameId", "pitcherId", "hitterId"], learned: [], meta: [],
  };

  function uid(prefix) {
    const c = (typeof crypto !== "undefined" && crypto.getRandomValues) ? crypto : null;
    let s = "";
    if (c) { const a = new Uint8Array(10); c.getRandomValues(a); for (const x of a) s += x.toString(36).padStart(2, "0").slice(-2); }
    else for (let i = 0; i < 20; i++) s += Math.floor(Math.random() * 36).toString(36);
    return (prefix ? prefix + "_" : "") + Date.now().toString(36) + s;
  }
  const now = () => Date.now();
  const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

  const req = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const done = (tx) => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("transaction aborted")); });

  async function open(opts = {}) {
    const factory = opts.indexedDB || (typeof indexedDB !== "undefined" ? indexedDB : null);
    if (!factory) throw new Error("This browser has no IndexedDB");
    const name = opts.name || NAME;
    const r = factory.open(name, VERSION);
    r.onupgradeneeded = () => {
      const db = r.result;
      for (const [store, idx] of Object.entries(STORES)) {
        if (db.objectStoreNames.contains(store)) continue;
        const os = db.createObjectStore(store, { keyPath: "id" });
        for (const i of idx) os.createIndex(i, i, { unique: false });
      }
    };
    const db = await req(r);
    return api(db, factory, name);
  }

  function api(db, factory, name) {
    const os = (store, mode = "readonly") => db.transaction(store, mode).objectStore(store);
    const live = (x) => x && !x.deletedAt;

    async function get(store, id) { const x = await req(os(store).get(id)); return live(x) ? x : null; }
    async function all(store, withDeleted = false) { const xs = await req(os(store).getAll()); return withDeleted ? xs : xs.filter(live); }
    async function byIndex(store, index, value) { const xs = await req(os(store).index(index).getAll(value)); return xs.filter(live); }
    function stamp(store, o) {
      const t = now();
      const x = Object.assign({}, o);
      if (!x.id) x.id = uid(store.slice(0, 3));
      if (!x.createdAt) x.createdAt = t;
      x.updatedAt = t;
      return x;
    }
    async function put(store, o) { const x = stamp(store, o); const tx = db.transaction(store, "readwrite"); tx.objectStore(store).put(x); await done(tx); return x; }
    async function putMany(store, list) {
      const tx = db.transaction(store, "readwrite"), s = tx.objectStore(store), out = list.map((o) => stamp(store, o));
      for (const x of out) s.put(x);
      await done(tx); return out;
    }
    async function del(store, id) {   // soft delete, so a later sync can carry the delete to other devices
      const x = await req(os(store).get(id)); if (!x) return false;
      x.deletedAt = now(); x.updatedAt = x.deletedAt;
      const tx = db.transaction(store, "readwrite"); tx.objectStore(store).put(x); await done(tx); return true;
    }
    async function count(store) { return (await all(store)).length; }

    // ------------------------------------------------------------ backup
    async function exportAll() {
      const out = { app: "pitch-caller", schema: VERSION, exportedAt: new Date().toISOString(), stores: {} };
      for (const s of Object.keys(STORES)) out.stores[s] = await all(s, true);
      return out;
    }
    // Merge a backup into this device: newer updatedAt wins, so restoring an old backup never overwrites newer work.
    async function importAll(data, { replace = false } = {}) {
      if (!data || data.app !== "pitch-caller" || !data.stores) throw new Error("That file isn't a Pitch Caller backup");
      const stats = {};
      for (const s of Object.keys(STORES)) {
        const incoming = data.stores[s] || [];
        const tx = db.transaction(s, "readwrite"), st = tx.objectStore(s);
        if (replace) st.clear();
        const have = replace ? new Map() : new Map((await new Promise((res, rej) => { const r = st.getAll(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })).map((x) => [x.id, x]));
        let n = 0;
        for (const x of incoming) {
          const cur = have.get(x.id);
          if (!cur || (x.updatedAt || 0) > (cur.updatedAt || 0)) { st.put(x); n++; }
        }
        await done(tx); stats[s] = n;
      }
      return stats;
    }
    async function changedSince(t) {   // what a sync would push: everything touched after t, deletes included
      const out = {};
      for (const s of Object.keys(STORES)) out[s] = (await all(s, true)).filter((x) => (x.updatedAt || 0) > t);
      return out;
    }
    function close() { db.close(); }
    async function destroy() { db.close(); await req(factory.deleteDatabase(name)); }

    return { get, all, byIndex, put, putMany, del, count, exportAll, importAll, changedSince, close, destroy, raw: db };
  }

  // ------------------------------------------------------------ pitch types
  // Real pitch names, and how each maps onto the four families the engine models.
  const PITCH_TYPES = {
    "Four-seam": { kind: "FB", shape: "ride" }, "Two-seam": { kind: "FB", shape: "run" }, "Sinker": { kind: "FB", shape: "sink" },
    "Cutter": { kind: "FB", shape: "cut" }, "Slider": { kind: "SL", shape: "tight" }, "Sweeper": { kind: "SL", shape: "sweeper" },
    "Slurve": { kind: "SL", shape: "" }, "Curveball": { kind: "CB", shape: "loopy" }, "Knuckle curve": { kind: "CB", shape: "sharp" },
    "12-6 curve": { kind: "CB", shape: "sharp" }, "Changeup": { kind: "CH", shape: "fade" }, "Splitter": { kind: "CH", shape: "drop" },
    "Forkball": { kind: "CH", shape: "drop" },
  };
  const DEFAULT_TYPE = { FB: "Four-seam", SL: "Slider", CB: "Curveball", CH: "Changeup" };

  function newPitch(type, extra = {}) {
    const t = PITCH_TYPES[type] || PITCH_TYPES["Four-seam"];
    return Object.assign({ id: uid("pt"), type, name: type === "Four-seam" ? "Fastball" : type, kind: t.kind, shape: t.shape,
      grade: 3, command: 3, feel: 0.7, velo: "", ivb: "", hb: "", spin: "", active: true }, extra);
  }
  function newPitcher(teamId, extra = {}) {
    return Object.assign({ teamId, name: "", number: "", hand: "R", slot: "three-quarter", height_ft: 6.1, role: "SP", gradYear: "",
      pitchLimit: "", useLearned: true, notes: "", pitches: [newPitch("Four-seam", { feel: 0.75 }), newPitch("Changeup", { feel: 0.6 })] }, extra);
  }
  function newHitter(teamId, extra = {}) {
    return Object.assign({ teamId, name: "", number: "", bats: "R", pos: "", stats: {}, tags: [], notes: "" }, extra);
  }

  // ------------------------------------------------------------ the old localStorage state -> database
  // Moves the staff, any named lineup and the saved games from the prototype's single saved blob into real records.
  async function migrateLegacy(D, S) {
    if (await D.get("meta", "migrated")) return null;
    const ours = await D.put("teams", { name: "Our team", isOurs: true, level: (S && S.setup && S.setup.level) || "college_d3" });
    const staffIds = [];
    if (S && S.setup && Array.isArray(S.setup.staff)) {
      for (const pd of S.setup.staff) {
        const pitches = (pd.pitches || []).map((d) => Object.assign(newPitch(DEFAULT_TYPE[d.kind] || "Four-seam"), {
          name: d.name, kind: d.kind, shape: d.shape || "", grade: +d.grade || 3, command: +d.command || 3, feel: +d.feel || 0.7,
          velo: d.velo ?? "", ivb: d.ivb ?? "", hb: d.hb ?? "" }));
        const p = await D.put("pitchers", newPitcher(ours.id, { name: pd.name, hand: pd.hand || "R", slot: pd.slot || "three-quarter", height_ft: +pd.height_ft || 6.1, pitches }));
        staffIds.push(p.id);
      }
    }
    let opp = null;
    const lineup = (S && S.setup && S.setup.lineup) || [];
    if (lineup.some((b) => b.name)) {
      opp = await D.put("teams", { name: "Opponent", isOurs: false, level: ours.level });
      for (const b of lineup) if (b.name) b.hitterId = (await D.put("hitters", newHitter(opp.id, { name: b.name, bats: b.hand }))).id;
    }
    // saved games: their pitch logs become events (no engine predictions were stored back then, so learning skips them)
    let games = 0, events = 0;
