    return [rx + (ax - rx) * u + mx * u * u, rz + (az - rz) * u + mz * u * u];
  }
  function remainingBreak(p, secs) {
    const tf = flightTime(p);
    const u = Math.max(0.0, 1 - secs / tf);
    const [ivb, hb] = movement(p);
    const mx = hb, mz = ivb - 0.5 * G_IN * tf ** 2;
    return [mx * (1 - u * u), mz * (1 - u * u)];
  }
  function tunnelScore(p1, q1, p2, q2, sameSide) {
    const a1 = pathAt(p1, q1, sameSide, DECISION_S), a2 = pathAt(p2, q2, sameSide, DECISION_S);
    const b1 = pathAt(p1, q1, sameSide, 0.0), b2 = pathAt(p2, q2, sameSide, 0.0);
    const r1 = remainingBreak(p1, DECISION_S), r2 = remainingBreak(p2, DECISION_S);
    const dT = ((a1[0] - a2[0]) ** 2 + (a1[1] - a2[1]) ** 2) ** 0.5;
    const dP = ((b1[0] - b2[0]) ** 2 + (b1[1] - b2[1]) ** 2) ** 0.5;
    const dB = ((r1[0] - r2[0]) ** 2 + (r1[1] - r2[1]) ** 2) ** 0.5;
    const dR = ((p1.release_offset_in[0] - p2.release_offset_in[0]) ** 2 + (p1.release_offset_in[1] - p2.release_offset_in[1]) ** 2) ** 0.5;
    const score = 0.6 * Math.min(dB, 18) / 18 + 0.4 * Math.min(dP, 24) / 24 - dT / 10 - dR / 8;
    return [Math.max(-1.0, Math.min(1.0, score)), dT, dB, dP];
  }
  const perceived = (p, q) => mph(p) + EV_ADJ[q];

  function pairing(p, q, s, arsenal) {
    if (!s.last) return 0.0;
    const lastName = s.last[0], lastQ = s.last[1];
    const lastResult = s.last.length > 2 ? s.last[2] : null;
    const last = arsenal.find((x) => x.name === lastName);
    if (!last) return 0.0;
    const upLast = lastQ.startsWith("up"), upNow = q.startsWith("up");
    if (last.name === p.name) {
      if (lastResult === "whiff") return lastQ === q ? 0.4 : 0.3;
      if (lastQ === q) return -0.8;
    }
    let base;
    if (last.kind === "FB") base = isOffspeed(p.kind) ? ((upLast && !upNow) ? 1.0 : 0.6) : (upLast !== upNow ? 0.3 : -0.2);
    else if (p.kind === "FB") base = upNow ? 0.6 : 0.3;
    else base = last.name === p.name ? -0.3 : 0.2;
    const gap = Math.abs(perceived(p, q) - perceived(last, lastQ));
    const speed = Math.min(gap / 16.0, 1.0) * 0.6 - 0.2;
    const tun = last.name !== p.name ? tunnelScore(last, lastQ, p, q, s.same_side)[0] : 0.0;
    return Math.max(-1.0, Math.min(1.0, 0.30 * base + speed + 0.50 * tun));
  }

  function shapeFit(p, q, s) {
    let f = 0.0;
    const up = q.startsWith("up");
    if (p.kind === "FB") {
      if (p.shape === "ride") f += up ? 0.5 : -0.2;
      if (p.shape === "sink") f += !up ? 0.5 : -0.3;
    } else {
      f += (!up || q === "chase") ? 0.4 : -1.0;
      if (p.kind === "SL" && s.same_side && (q.includes("away") || q === "chase")) f += 0.3;
    }
    if (p.kind === "CH" && s.same_side) f -= 0.3;
    return f;
  }

  function damage(p, q, s) {
    let total = 0.0;
    for (const key of [isOffspeed(p.kind) ? "OS" : "FB", q]) {
      if (key in s.hitter_damage) {
        const [score, n] = s.hitter_damage[key];
        let eff = score * n / (n + 10.0);
        if (eff < 0 && n < 20) eff *= 0.5;
        total += eff;
      }
    }
    return total;
  }

  // ---------------------------------------------------------------- outcome model
  function outcomeProbs(p, q, s, arsenal, policy, byZone) {   // byZone (optional): filled with each landing zone's own outcome mix
    const L = D.LEVEL[s.level], A = D.OUTCOME_ADJ[s.level];
    const big = isBigSpot(s);
    const cL = L.cL * (big ? 1.5 : 1.0);
    const bT = 0.4 * (big ? 0.5 : 1.0);
    const [E, neutral] = expectation(p, arsenal, s, policy);
    const T = pairing(p, q, s, arsenal);
    const f = shapeFit(p, q, s);
    const dmg = damage(p, q, s);
    const tau = (isOffspeed(p.kind) ? s.timing.OS : s.timing.FB) || 0.0;
    const tauEff = p.kind === "FB" ? tau : -tau;
    const hittersCount = s.balls > s.strikes && s.strikes < 2;
    const land = landing(p, q, s);
    const [command, grade] = effective(p, s);
    const gs = 0.25 * (L.stuff_scale ?? 1.0);
    const cw = (L.cmd_whiff ?? 0.0) * (command - 3);   // v0.7b: better command adds contact, not strikeouts (fit_spread.py)
    const out = { ball: 0, cstrike: 0, whiff: 0, foul: 0, weak: 0, solid: 0, hard: 0, wp_ball: 0, hbp: 0 };
    for (const z of ZONES) {
      const pz = land[z];
      let sl = logit(S0[z]);
      if (s.strikes === 2) sl += 0.9;
      if (s.balls === 0 && s.strikes === 0) sl -= 0.4;
      if (s.balls === 3 && s.strikes === 0) sl -= 2.0;
      else if (hittersCount) sl += (z === "heart" || z === "edge") ? 0.3 : -0.4;
      if (z === "off" && isOffspeed(p.kind)) sl += 0.2;
      const wz = ZONE_IN[z];
      sl += wz * A.zsw + (1 - wz) * A.osw;
      const S = S0[z] > 0 ? sig(sl) : 0;
      const C = (z === "edge" || z === "off") ? sig(logit(C0[z]) + A.cs) : C0[z];
      let wl = logit(W0[z]) + KIND_W[p.kind] + gs * (grade - 3) + cL * 1.5 * (p.conf - 0.6);
      wl += L.hL * (-1.5 * (E - neutral) + 0.6 * tauEff - 0.4 * DMG_SCALE * dmg);
      wl += bT * T + 0.25 * f;
      wl += wz * A.wz + (1 - wz) * A.wo;
      if (cw) wl -= cw;
      const W = sig(wl);
      const F = sig(logit(F0[z]) + (s.strikes === 2 ? 0.3 : 0));
      let hl = -gs * (grade - 3) - cL * 0.5 * (p.conf - 0.6) + L.hL * (1.0 * (E - neutral) + 0.8 * DMG_SCALE * dmg) - 0.3 * f;
      hl += 0.012 * s.batters_faced;
      hl -= L.hL * 0.5 * tauEff;   // v0.6e: off-time swings make weaker contact too
      if (p.kind === "CH" && s.same_side) hl += 0.2;
      if (z === "heart" && isOffspeed(p.kind)) hl += 0.5;
      if (isOffspeed(p.kind) && (q.startsWith("up") || q === "middle")) hl += 0.4;
      const [weak, solid, hard] = Q0[z];
      const hard2 = sig(logit(hard) + hl);
      const scale = (1 - hard2) / (weak + solid);
      const weak2 = weak * scale, solid2 = solid * scale;
      const take = 1 - S;
      let ballP = pz * take * (1 - C);
      if ((z === "noncomp" || z === "off") && A.hbp > 0) {
        const hb = Math.min(0.9, A.hbp * HBP_LOC[q] * (z === "noncomp" ? 1.0 : 0.1));
        out.hbp += ballP * hb;
        ballP *= (1 - hb);
      }
      if (z === "noncomp" && anyBase(s.bases)) {
        const wp = (isOffspeed(p.kind) ? 0.12 : 0.04) * (1 - 0.15 * (s.catcher_block - 3));
        out.wp_ball += ballP * wp;
        ballP *= (1 - wp);
      }
      out.ball += ballP;
      out.cstrike += pz * take * C;
      out.whiff += pz * S * W;
      out.foul += pz * S * (1 - W) * F;
      const contact = pz * S * (1 - W) * (1 - F);
      out.weak += contact * weak2; out.solid += contact * solid2; out.hard += contact * hard2;
      if (byZone) {   // v0.7: the outcome mix given the pitch landed in this zone (for learning from logged location)
        const take_ = 1 - S, bp = take_ * (1 - C);
        let hbpZ = 0, wpZ = 0, ballZ = bp;
        if ((z === "noncomp" || z === "off") && A.hbp > 0) { const hb = Math.min(0.9, A.hbp * HBP_LOC[q] * (z === "noncomp" ? 1.0 : 0.1)); hbpZ = ballZ * hb; ballZ *= (1 - hb); }
        if (z === "noncomp" && anyBase(s.bases)) { const wp = (isOffspeed(p.kind) ? 0.12 : 0.04) * (1 - 0.15 * (s.catcher_block - 3)); wpZ = ballZ * wp; ballZ *= (1 - wp); }
        const ct = S * (1 - W) * (1 - F);
        byZone[z] = { land: pz, ball: ballZ, wp_ball: wpZ, hbp: hbpZ, cstrike: take_ * C, whiff: S * W, foul: S * (1 - W) * F, weak: ct * weak2, solid: ct * solid2, hard: ct * hard2 };
      }
    }
    return out;
  }

  // ---------------------------------------------------------------- situation terms
  function inPlayValue(contact, outs, bases, level) {
    const [b1, b2, b3] = bases;
    const [po, p1, p2, p3, phr, pe] = D.IN_PLAY[level][contact];
    const epv = (o, b, r) => r + re(o, b, level);
    let total = 0.0, vOut;
    if (outs + 1 >= 3) vOut = 0.0;
    else {
      const dp = (b1 && contact === "weak" && outs < 2) ? 0.20 : 0.0;
      const vDp = outs + 2 >= 3 ? 0.0 : epv(outs + 2, [false, b2, b3], 0);
      const vReg = b3 ? 0.4 * epv(outs + 1, [b1, b2, false], 1) + 0.6 * epv(outs + 1, bases, 0) : epv(outs + 1, bases, 0);
      vOut = dp * vDp + (1 - dp) * vReg;
    }
    total += po * vOut;
    let runs = b3 ? 1 : 0, v1;
    if (b2) v1 = 0.55 * epv(outs, [true, b1, false], runs + 1) + 0.45 * epv(outs, [true, b1, true], runs);
    else v1 = epv(outs, [true, b1, false], runs);
    total += (p1 + pe) * v1;
    runs = (b2 ? 1 : 0) + (b3 ? 1 : 0);
    let v2;
    if (b1) v2 = 0.4 * epv(outs, [false, true, false], runs + 1) + 0.6 * epv(outs, [false, true, true], runs);
    else v2 = epv(outs, [false, true, false], runs);
    total += p2 * v2;
    total += p3 * epv(outs, [false, false, true], +b1 + +b2 + +b3);
    total += phr * epv(outs, [false, false, false], +b1 + +b2 + +b3 + 1);
    return total;
  }
  function walkValue(outs, bases, level) {
    const [b1, b2, b3] = bases;
    const runs = (b1 && b2 && b3) ? 1 : 0;
    return runs + re(outs, [true, b1 || b2, b3 || (b1 && b2)], level);
  }
  function cost(p, q, s, arsenal, policy, cv) {
    const P = outcomeProbs(p, q, s, arsenal, policy);
    const b = s.balls, k = s.strikes, o = s.outs, B = s.bases, L = s.level;
    const afterBall = (bases, runs) => (b + 1 === 4 ? runs + walkValue(o, bases, L) : runs + V(b + 1, k, o, bases, cv, L));
    const afterStrike = () => (k + 1 === 3 ? re(o + 1, B, L) : V(b, k + 1, o, B, cv, L));
    let v = 0.0;
    v += P.ball * afterBall(B, 0);
    const nb = [false, B[0], B[1]], r = B[2] ? 1 : 0;
    v += P.wp_ball * afterBall(nb, r);
    v += P.hbp * walkValue(o, B, L);
    v += (P.cstrike + P.whiff) * afterStrike();
    v += P.foul * (k < 2 ? V(b, k + 1, o, B, cv, L) : V(b, k, o, B, cv, L));
    for (const c of ["weak", "solid", "hard"]) v += P[c] * inPlayValue(c, o, B, L);
    return [v, P];
  }

  // ---------------------------------------------------------------- decision rule
  function softmax(costs, temp, window, best) {   // costs: array of [key, cost] in insertion order
    if (best === undefined || best === null) best = Math.min(...costs.map((c) => c[1]));
    const keep = costs.filter((c) => c[1] - best <= window);
    if (!keep.length) return [];
    const mk = Math.min(...keep.map((c) => c[1]));
    const w = keep.map((c) => [c[0], Math.exp(-(c[1] - mk) / temp)]);
    let t = 0; for (const x of w) t += x[1];
    return w.map((x) => [x[0], x[1] / t]);
  }
  function candidates(arsenal, s, forced) {
    const cutoff = D.LEVEL[s.level].cutoff;
    let c = arsenal.filter((x) => x.conf >= cutoff || (forced && x.name === forced));
    if (!c.length) c = [arsenal.reduce((a, x) => (x.conf > a.conf ? x : a), arsenal[0])];
    return c;
  }
  function countStakes(b, k, level) {
    const cv = D.CV[level], [bb, kk] = D.LW[level];
    const strike = k === 2 ? kk : cv[cvKey(b, k + 1)];
    const ball = b === 3 ? bb : cv[cvKey(b + 1, k)];
    return ball - strike;
  }
  function stakesFactor(b, k, level) {
    if (!D.LW[level]) return 1.0;
    if (b === 3 && k === 0) return 0.5;   // v0.7c (Drew): 3-0 gets the tightest setting, like 3-2 (engine.py)
    let avg = 0; for (const [b_, k_] of COUNTS) avg += countStakes(b_, k_, level);
    avg /= COUNTS.length;
    return Math.min(1.5, Math.max(0.5, avg / countStakes(b, k, level)));
  }
  const ck = (name, q) => name + "|" + q;

  function mixedPolicy(arsenal, s, T = 0.010, window = 0.030, forced = null, iters = 8, cv = null) {
    const cands = candidates(arsenal, s, forced);
    const k = runScale(s.level);
    const f = stakesFactor(s.balls, s.strikes, s.level);
    T = T * k; window = window * k * Math.min(1.0, f);
    const temp = T * (isBigSpot(s) ? 0.5 : 1.0) * f;
    let policy = null, costs = null;
    for (let it = 0; it < iters; it++) {
      costs = new Map();
      for (const p of cands) for (const q of QUADS) costs.set(ck(p.name, q), cost(p, q, s, arsenal, policy, cv)[0]);
      const tq = targets(s.balls, s.strikes);
      const bestBy = cands.map((p) => [p.name, Math.min(...tq.map((q) => costs.get(ck(p.name, q))))]);
      const pp = new Map(softmax(bestBy, temp, window));
      const nw = {}; for (const x of arsenal) nw[x.name] = pp.get(x.name) || 0.0;
      if (policy === null) policy = nw;
      else { const m = {}; for (const kk in nw) m[kk] = 0.5 * policy[kk] + 0.5 * nw[kk]; policy = m; }
    }
    return [policy, costs, temp];
  }
  const minAllowed = (costs, tq) => { let m = Infinity; for (const [key, v] of costs) if (tq.includes(key.slice(key.lastIndexOf("|") + 1)) && v < m) m = v; return m; };

  function atBatValues(arsenal, s, T = 0.010, window = 0.030, sweeps = 10, iters = 4) {
    const cv = Object.assign({}, D.CV[s.level]);
    const base = re(s.outs, s.bases, s.level);
    const order = COUNTS.slice().sort((a, b) => -(a[0] + a[1]) + (b[0] + b[1]));   // stable: same as Python
    for (let sw = 0; sw < sweeps; sw++) {
      let delta = 0.0;
      for (const [b, k] of order) {
        const same = b === s.balls && k === s.strikes;
        const sc = replace(s, { balls: b, strikes: k, last: same ? s.last : null, usage_this_count: same ? s.usage_this_count : {} });
        const [policy, costs, temp] = mixedPolicy(arsenal, sc, T, window, null, iters, cv);
        let ev = 0.0;
        const tq = targets(b, k), bestOk = minAllowed(costs, tq);
        for (const name in policy) {
          const pp = policy[name];
          if (pp <= 0) continue;
          let loc = softmax(tq.map((q) => [q, costs.get(ck(name, q))]), temp,
            LOC_WINDOW * runScale(s.level) * Math.min(1.0, stakesFactor(b, k, s.level)), bestOk);
          if (!loc.length) {
            let bq = tq[0]; for (const q of tq) if (costs.get(ck(name, q)) < costs.get(ck(name, bq))) bq = q;
            loc = [[bq, 1.0]];
          }
          let sub = 0; for (const [q, pq] of loc) sub += pq * costs.get(ck(name, q));
          ev += pp * sub;
        }
        const nv = ev - base;
        delta = Math.max(delta, Math.abs(nv - cv[cvKey(b, k)]));
        cv[cvKey(b, k)] = nv;
      }
      if (delta < 0.001) break;
    }
    const zero = cv["0-0"], rel = {};
    for (const key in cv) rel[key] = cv[key] - zero;
    return [rel, cv];
  }

  const KINDS = ["FB", "SL", "CB", "CH"];
  function checkInputs(arsenal, s) {   // v0.7c: impossible input gets a clear error, not a crash or a silent empty call
    if (!arsenal || !arsenal.length) throw new Error("no pitches: the arsenal is empty");
    const names = arsenal.map((x) => x.name);
    if (new Set(names).size !== names.length) throw new Error(`two pitches share a name: ${names.join(", ")}`);
    for (const x of arsenal) if (!KINDS.includes(x.kind)) throw new Error(`unknown pitch kind "${x.kind}" for ${x.name}`);
    if (!D.LEVEL[s.level] || !D.RE[s.level]) throw new Error(`unknown level "${s.level}"`);
    if (!(s.balls >= 0 && s.balls <= 3 && s.strikes >= 0 && s.strikes <= 2)) throw new Error(`impossible count ${s.balls}-${s.strikes}`);
    if (!(s.outs >= 0 && s.outs <= 2)) throw new Error(`impossible number of outs ${s.outs}`);
    if (!s.bases || s.bases.length !== 3) throw new Error("bases must be three flags (1st, 2nd, 3rd)");
  }

  function callMixed(arsenal, s, opts = {}) {
    checkInputs(arsenal, s);
    const T = opts.T ?? 0.010, window = opts.window ?? 0.030, forced = opts.forced ?? null, iters = opts.iters ?? 8;
    const rng = opts.rng || Math.random, atBat = opts.atBat ?? true;
    const cv = atBat ? atBatValues(arsenal, s, T, window)[1] : null;
    const [policy, costs, temp] = mixedPolicy(arsenal, s, T, window, forced, iters, cv);
    let pPitch = Object.entries(policy).filter(([, v]) => v > 0.005);
    let t = 0; for (const [, v] of pPitch) t += v;
    pPitch = pPitch.map(([kk, v]) => [kk, v / t]);
    const dist = [];
    const tq = targets(s.balls, s.strikes), overall = minAllowed(costs, tq);
    for (const [name, pp] of pPitch) {
      let loc = softmax(tq.map((q) => [q, costs.get(ck(name, q))]), temp,
        LOC_WINDOW * runScale(s.level) * Math.min(1.0, stakesFactor(s.balls, s.strikes, s.level)), overall);
      if (!loc.length) {
        let bq = tq[0]; for (const q of tq) if (costs.get(ck(name, q)) < costs.get(ck(name, bq))) bq = q;
        loc = [[bq, 1.0]];
      }
      const p = arsenal.find((x) => x.name === name);
      for (const [q, pq] of loc) dist.push({ prob: pp * pq, cost: costs.get(ck(name, q)), pitch: p, quad: q });
    }
    if (opts.exclude && opts.exclude.length) {   // never re-call what he just shook off (unless nothing else is left)
      const kept = dist.filter((d) => !opts.exclude.some(([n, q]) => d.pitch.name === n && d.quad === q));
      if (kept.length) { const t_ = kept.reduce((a, d) => a + d.prob, 0); dist.length = 0; for (const d of kept) dist.push(Object.assign(d, { prob: d.prob / t_ })); }
    }
    dist.sort((a, b) => b.prob - a.prob);
    const r = rng();
    let acc = 0.0;
    for (const d of dist) { acc += d.prob; if (r <= acc) return { pick: d, dist, best: overall, policy }; }
    return { pick: dist[dist.length - 1], dist, best: overall, policy };
  }

  function gradeCall(arsenal, s, pitchName, quad, opts = {}) {
    const { dist } = callMixed(arsenal, s, opts);
    // v0.7c: scored the way the call is made: count values solved for this matchup, and only the targets allowed here
    const cv = (opts.atBat ?? true) ? atBatValues(arsenal, s)[1] : null;
    const [policy, costs] = mixedPolicy(arsenal, s, 0.010, 0.030, null, 8, cv);
    const p = arsenal.find((x) => x.name === pitchName);
    const cHuman = costs.has(ck(pitchName, quad)) ? costs.get(ck(pitchName, quad)) : cost(p, quad, s, arsenal, policy, cv)[0];
    const tq = targets(s.balls, s.strikes), best = minAllowed(costs, tq), allowed = tq.includes(quad);
    let prob = 0; for (const d of dist) if (d.pitch.name === pitchName && d.quad === quad) prob += d.prob;
    return { call: pitchName + " " + quad, engine_prob: prob, runs_vs_best: cHuman - best, allowed,
      verdict: !allowed ? "costly" : prob >= 0.02 ? "in the engine's mix" : (cHuman - best <= 0.03 * runScale(s.level) ? "close" : "costly"),
      engine_top: dist.slice(0, 3).map((d) => [d.pitch.name, d.quad, d.prob]) };
  }

  // ---------------------------------------------------------------- "time for a change" (flags.py)
  function pitcherStatus(arsenal, level, pitchCount, recent) {
    const L = D.LEVEL[level];
    const trusted = arsenal.filter((p) => p.conf >= L.cutoff);
    let slide = 0; for (const p of arsenal) slide += Math.max(0.0, p.base_conf - p.conf); slide /= arsenal.length;
    const over = pitchCount - L.fatigue;
    const last6 = (recent || []).slice(-6);
    const traffic = last6.filter((r) => r === "walk" || r === "hbp" || r === "hard").length;
    const reasons = []; let score = 0;
    if (!trusted.length) { reasons.push("he trusts none of his pitches right now"); score += 3; }
    else if (trusted.length === 1 && arsenal.length > 1) { reasons.push(`he's down to one pitch he trusts (${trusted[0].name})`); score += 1; }
    if (slide >= 0.15) { reasons.push(`confidence is down ${slide.toFixed(2)} from his bullpen on average`); score += 1; }
    if (over >= 20) { reasons.push(`${over} pitches past his usual fatigue point`); score += 2; }
    else if (over >= 0) { reasons.push(`at his fatigue point (${pitchCount} pitches)`); score += 1; }
    if (traffic >= 4) { reasons.push(`${traffic} of his last ${last6.length} batters walked, were hit, or hit it hard`); score += 2; }
    else if (traffic >= 3) { reasons.push(`${traffic} of his last ${last6.length} batters walked, were hit, or hit it hard`); score += 1; }
    return { status: score >= 3 ? "change" : (score >= 1 ? "watch" : "ok"), reasons, trusted: trusted.map((p) => p.name), score };
  }

  // ---------------------------------------------------------------- one pitch, all of it
  function learnPitch(E, pd, gamesAll, level, opts = {}) {

  };

  s += `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="var(--rule)"/>`;
  if (c.quad !== "chase") { const [cx, cy] = cell(c.quad); s += `<rect x="${X + cw * cx}" y="${Y + ch * cy}" width="${cw}" height="${ch}" fill="var(--call)" fill-opacity=".2"/>`; }
  for (let i = 1; i < 3; i++) {
    s += `<line x1="${X + cw * i}" y1="${Y}" x2="${X + cw * i}" y2="${Y + H}" stroke="var(--stroke)"/>`;
    s += `<line x1="${X}" y1="${Y + ch * i}" x2="${X + W}" y2="${Y + ch * i}" stroke="var(--stroke)"/>`;
  }
  s += `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="var(--ink)" stroke-opacity=".8" stroke-width="1.5"/>`;

  s += `<circle class="ring" cx="${tx}" cy="${ty}" r="24" fill="none" stroke="var(--call)" stroke-opacity=".55" stroke-width="1.5"/>`;
  s += `<g class="core"><circle cx="${tx}" cy="${ty}" r="17" fill="var(--call)"/>`;
  s += `<text x="${tx}" y="${ty + 7}" text-anchor="middle" ${F} font-stretch="70%" font-weight="750" font-size="21" fill="var(--ground)">${SIGN[kind]}</text></g>`;

// ------------------------------------------------------------------ database glue
// The database is the source of truth for the roster, opponents, games, every pitch and what's been learned.
// Reads during a game come from an in-memory copy (the engine needs answers instantly); writes go straight through.
const DB = { D: null, ready: false, failed: null, teams: new Map(), pitchers: new Map(), catchers: new Map(), hitters: new Map(),

let saveWarned = false;

function dbErr(e) { console.error(e); if (!saveWarned) { saveWarned = true; toast("Couldn't save to the database on this device"); } }
async function dbPut(store, obj) {

}
const ourTeam = () => [...DB.teams.values()].find((t) => t.isOurs);
const opponents = () => [...DB.teams.values()].filter((t) => !t.isOurs).sort((a, b) => a.name.localeCompare(b.name));

const rosterPitchers = () => [...DB.pitchers.values()].sort((a, b) => a.name.localeCompare(b.name));
const todayCheckin = (pid) => { const c = DB.checkins.get(pid); return c && c.date === PCDB.today() ? c : null; };
// what's been learned (learner v2): per pitcher { profile, served }, per hitter the hitter model
const pModel = (pid) => DB.models.get("v2:" + pid);
const hModel = (hid) => DB.models.get("h2:" + hid);

async function boot() {
  if (typeof PCDB === "undefined") return;
  try {
    const D = await PCDB.open();
    DB.D = D;
    const mig = await PCDB.migrateLegacy(D, S);
    for (const [store, map] of [["teams", DB.teams], ["pitchers", DB.pitchers], ["catchers", DB.catchers], ["hitters", DB.hitters]]) for (const x of await D.all(store)) map.set(x.id, x);
    for (const x of await D.all("learned")) DB.models.set(x.id, x);
    for (const x of await D.byIndex("checkins", "date", PCDB.today())) DB.checkins.set(x.pitcherId, x);
    if (!ourTeam()) { const t = await dbPut("teams", { name: "Our team", isOurs: true, level: S.setup.level }); DB.teams.set(t.id, t); }
    if (mig) { S.setup.staffIds = mig.staffIds; if (mig.opponentId) S.setup.opponentId = mig.opponentId; }
    if (!DB.pitchers.size) { const p = await dbPut("pitchers", PCDB.newPitcher(ourTeam().id, { name: "Pitcher 1" })); DB.pitchers.set(p.id, p); }
    S.setup.staffIds = (S.setup.staffIds || []).filter((id) => DB.pitchers.has(id));
    if (!S.setup.staffIds.length) S.setup.staffIds = rosterPitchers().slice(0, 2).map((p) => p.id);
    attachStaff();
    if (S.setup.catcherId && !DB.catchers.has(S.setup.catcherId)) S.setup.catcherId = null;
    // this device's id, logged with every pitch (several iPads may chart for one team once there's sync)
    let dev = await D.get("meta", "device");
    if (!dev) dev = await D.put("meta", { id: "device", uid: PCDB.uid("dev") });
    DB.deviceId = dev.uid;
    DB.ready = true;
    await flushQueued();
    save(); render();
    // pitch counts per pitcher for the roster cards, and hitter memory for tonight's lineup, without holding up the screen
    setTimeout(async () => {
      for (const p of DB.pitchers.values()) DB.counts.set(p.id, (await D.byIndex("events", "pitcherId", p.id)).filter((e) => !e.legacy).length);
      for (const p of S.setup.staff) if (!pModel(p.id) && DB.counts.get(p.id)) await relearnPitcher(p.id);
      await refreshLineupMemory();
      if (S.view === "roster") render();
    }, 50);
  } catch (e) {
    DB.failed = e; console.warn("Database unavailable, running without it:", e && e.message); render();
  }
}

// today's staff: the roster records themselves, so edits on the Roster screen show up in the game right away
function attachStaff() {
  const staff = S.setup.staffIds.map((id) => DB.pitchers.get(id)).filter(Boolean);
  if (staff.length) S.setup.staff = staff;
  if (G().pitcher >= S.setup.staff.length) G().pitcher = 0;
}

// what's been learned about tonight's hitters, loaded before they step in
async function refreshLineupMemory() {
  for (const b of S.setup.lineup) if (b.hitterId) await relearnHitter(b.hitterId);
  // hitters who haven't seen a pitch yet tonight pick up what was just loaded; if that's the man at the plate, call again
  const k = G().know; let redo = false;
  S.setup.lineup.forEach((b, i) => {
    const e = k[String(i)], m = b.hitterId && hModel(b.hitterId);
    if (e && m && !Object.keys(e.seen).length) { e.damage = PCLearner.seedDamage(m); if (i === slotIdx()) redo = true; }
  });
  if (redo && G().call && !G().call.coach && !G().inningOver) makeCall();
}

// ------------------------------------------------------------------ learning (learner v2, spec 5-12)
// Runs in a worker so learning after a game never freezes the screen. If a worker can't start, the same code runs here.
let learnWorker = null, learnSeq = 0;
const learnWaiting = new Map();
function learnLocal(msg) { return Promise.resolve(pcLearnMessage(E, PCLearner, msg)); }
function learnCall(msg) {
  if (learnWorker === null) {
    try {
      const src = document.getElementById("pc-worker").textContent;
      learnWorker = new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));
      learnWorker.onmessage = (e) => { const w = learnWaiting.get(e.data.id); if (!w) return; learnWaiting.delete(e.data.id); e.data.ok ? w.res(e.data) : w.rej(new Error(e.data.error)); };
      learnWorker.onerror = (e) => { console.warn("learning worker failed, learning on the main thread", e.message); learnWorker = false; for (const [, w] of learnWaiting) w.retry(); learnWaiting.clear(); };
      learnWorker.postMessage({ type: "init", data: PC_DATA });
    } catch (e) { learnWorker = false; }
  }
  if (!learnWorker) return learnLocal(msg);
  return new Promise((res, rej) => {
    const id = ++learnSeq;
    learnWaiting.set(id, { res, rej, retry: () => learnLocal(msg).then(res, rej) });
    learnWorker.postMessage(Object.assign({ id }, JSON.parse(JSON.stringify(msg))));
  });
}
const levelOf = () => S.setup.level;
// learn from every pitch he's thrown, then serve one step toward it (spec 11). Serving steps once per new game only.
async function relearnPitcher(pid) {
  const p = DB.pitchers.get(pid); if (!p || !DB.D) return null;
  const evs = (await DB.D.byIndex("events", "pitcherId", pid)).filter((e) => !e.legacy && !e.deletedAt);
  DB.counts.set(pid, evs.length);
  const was = pModel(pid);
  let r;
  try { r = await learnCall({ type: "pitcher", pitcher: p, events: evs, level: levelOf(), prev: was ? was.served : null }); }
  catch (e) { console.error(e); toast("Couldn't learn from his games just now; the calls keep using what they had"); return was || null; }
  const m = { id: "v2:" + pid, pitcherId: pid, profile: r.profile, served: r.served, at: Date.now() };
  DB.models.set(m.id, await dbPut("learned", m));
  return m;
}
// a re-grade, an accepted flag or the learning switch takes effect now, without waiting for a game (no step is taken)
function reserve(p) {
  const m = pModel(p.id); if (!m || !m.profile) return;
  m.served = PCLearner.finishServe(E, PCLearner.serve(m.profile, p, m.served), p, levelOf());
  dbPut("learned", m);
}
async function relearnHitter(hid) {
  const x = DB.hitters.get(hid); if (!x || !DB.D) return null;
  const evs = (await DB.D.byIndex("events", "hitterId", hid)).filter((e) => !e.deletedAt);
  const team = DB.teams.get(x.teamId);
  let r;
  try { r = await learnCall({ type: "hitter", hitter: x, events: evs, level: (team && team.level) || levelOf() }); } catch (e) { console.error(e); return hModel(hid) || null; }
  const m = Object.assign({ id: "h2:" + hid }, r.model);
  DB.models.set(m.id, await dbPut("learned", m));
  return m;
}

// one games record per game, made when the first pitch is logged. If the database isn't open yet (it opens a moment
// after the page, or failed), the record and its pitches wait in the saved state and are written once it opens:
// a pitch is never dropped, because the learner replays games in order and a hole would break the replay.
function ensureGameRecord() {
  const g = G();
  if (g.dbId) return g.dbId;
  g.dbId = PCDB.uid("gam");
  const rec = { id: g.dbId, date: PCDB.today(), level: S.setup.level, inputs: S.setup.inputs, logLoc: !!S.setup.logLoc, opponentId: S.setup.opponentId || null,
    catcherId: S.setup.catcherId || null, staffIds: (S.setup.staffIds || []).slice(), lineup: S.setup.lineup.map((b) => ({ hitterId: b.hitterId || null, name: b.name, hand: b.hand })),
    status: "live", startedAt: Date.now(), deviceId: DB.deviceId || null };
  if (DB.ready) dbPut("games", rec); else (S.queue = S.queue || { games: [], events: [] }).games.push(rec);
  return g.dbId;
}
function logEvent(ev) {
  ev.id = PCDB.uid("evt");
  if (!DB.ready) { (S.queue = S.queue || { games: [], events: [] }).events.push(ev); return ev.id; }
  DB.D.put("events", ev).catch(dbErr);
  DB.counts.set(ev.pitcherId, (DB.counts.get(ev.pitcherId) || 0) + 1);
  return ev.id;
}
async function flushQueued() {
  const q = S.queue; if (!q || (!q.games.length && !q.events.length)) return;
  for (const r of q.games) { r.deviceId = r.deviceId || DB.deviceId; await dbPut("games", r); }
  for (const ev of q.events) { ev.deviceId = ev.deviceId || DB.deviceId; await DB.D.put("events", ev).catch(dbErr); DB.counts.set(ev.pitcherId, (DB.counts.get(ev.pitcherId) || 0) + 1); }
  const n = q.events.length; S.queue = { games: [], events: [] }; save();
  if (n) toast(`Saved ${n} pitch${n === 1 ? "" : "es"} charted before the database opened`);
}
// an edit to a logged pitch after the fact (where it ended up, contact, a cross-up, a wild pitch). The original values
// are kept in the record's edit history; the game's flow (count, outs, runners) isn't changed, use Undo for that.
async function editEvent(evId, changes) {
  const q = S.queue && S.queue.events.find((e) => e.id === evId);
  const ev = q || (DB.ready ? await DB.D.get("events", evId) : null);
  if (!ev) return false;
  const before = {}; for (const k of Object.keys(changes)) before[k] = ev[k] === undefined ? null : ev[k];
  ev.edits = (ev.edits || []).concat({ at: Date.now(), before });
  Object.assign(ev, changes);
  if (!q) await DB.D.put("events", ev).catch(dbErr); else save();
  return true;
}
// after an undo: the pitches that are no longer in the game come out of the database too
function syncUndone(before, after) {
  if (!DB.ready) return;
  const keep = new Set(after.evIds || []);
  for (const id of before.evIds || []) if (!keep.has(id)) DB.D.del("events", id).catch(dbErr);
}
// how completely a game was charted: the learner only uses locations or contact quality from a game where they were
// logged on at least 90% of pitches (spec 5.5), so a game charted selectively can't bias it
function completeness(g) {
  const L = g.log, n = L.length, plays = L.filter((e) => e.res === "play");
  return { pitches: n, located: n ? L.filter((e) => e.loc).length / n : 0, contact: plays.length ? plays.filter((e) => e.contact).length / plays.length : null,
    engineCalls: n ? L.filter((e) => !e.coach && !e.recall).length / n : 0 };
}
async function finishGameRecord() {
  const g = G();
  if (!g.dbId) return null;
  const comp = completeness(g);
  if (!DB.ready) { const r = S.queue && S.queue.games.find((x) => x.id === g.dbId); if (r) Object.assign(r, { status: "final", endedAt: Date.now(), us: g.us, them: g.them, innings: g.inning, pitches: g.pitchNo, completeness: comp }); save(); return comp; }
  const rec = await DB.D.get("games", g.dbId);
  if (rec) await dbPut("games", Object.assign(rec, { status: "final", endedAt: Date.now(), us: g.us, them: g.them, innings: g.inning, pitches: g.pitchNo, completeness: comp }));
  // the flywheel: refit everyone who pitched and every hitter he faced
  const pids = new Set(), hids = new Set();
  for (const e of g.log) { const pid = e.pid || (S.setup.staff[e.p ?? 0] || {}).id; if (pid && DB.pitchers.has(pid)) pids.add(pid); const b = S.setup.lineup[e.slot]; if (b && b.hitterId) hids.add(b.hitterId); }
  for (const id of pids) await relearnPitcher(id);
  for (const id of hids) await relearnHitter(id);
  if (pids.size) toast(`Learned from the game: ${[...pids].map((id) => DB.pitchers.get(id).name).join(", ")}`);
  return comp;
}

async function backup() {
  if (!DB.D) return;
  const data = await DB.D.exportAll();
  data.appState = { setup: Object.assign({}, S.setup, { staff: undefined }) };
  const blob = new Blob([JSON.stringify(data)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `pitch-caller-backup-${PCDB.today()}.json`;
  document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(`Backup saved: ${data.stores.events.length} pitches, ${data.stores.pitchers.length} pitchers`);
}
async function restore(e) {
  const f = e.target.files[0]; if (!f || !DB.D) return;
  try {
    const st = await DB.D.importAll(JSON.parse(await f.text()));
    toast(`Restored: ${Object.entries(st).filter(([, n]) => n).map(([k, n]) => `${n} ${k}`).join(", ") || "nothing newer than what's here"}`);
    setTimeout(() => location.reload(), 900);
  } catch (err) { toast(err.message || "That file couldn't be read"); }
}

    DB.ready ? row("Their lineup", "Pick today's opponent and their hitters fill in by number. Type a new name and he's added to their roster. A hitter you've seen before starts with what you learned about him.", opponentPick(), lineup, h("datalist", { id: "hitter-names" }, (S.setup.opponentId ? teamHitters(S.setup.opponentId) : []).map((x) => h("option", { value: x.name }))))
      : row("Their lineup", "Only how each hitter bats is needed. With no scouting, every hitter starts as average and the engine learns him as the game goes.", lineup),
    DB.ready ? row("Catcher", "How well today's catcher blocks. It changes how often the engine calls a pitch in the dirt with runners on.", catcherPick()) : null,
    row("Game", "Your staff, lineup and the game in progress are saved on this device. Starting a new game files this one under Data.",
      h("div", { class: "fields" },
        h("button", { class: "btn primary", on: { click: () => endGame() } }, "Start a new game"),
        DB.ready ? null : h("button", { class: "btn", on: { click: () => { undo = []; const th = S.theme; S = { setup: sampleSetup(), game: newGame(), view: "setup", sample: true, theme: th }; save(); render(); toast("Sample staff and lineup loaded"); } } }, "Load the sample staff"))));
}
function staffPick() {
  const list = rosterPitchers();
  return [h("div", { class: "staffpick" }, list.map((p) => {
    const on = S.setup.staffIds.includes(p.id), ci = todayCheckin(p.id);
    return h("button", { class: "choice", "aria-pressed": String(on), on: { click: () => toggleStaff(p.id) } },
      h("b", {}, (p.number ? `#${p.number} ` : "") + (p.name || "Unnamed")),
      h("span", { class: "chips" }, (p.pitches || []).filter((d) => d.active !== false).map((d) => chip(d.kind))),
      h("span", {}, `${p.hand === "L" ? "Lefty" : "Righty"}${ci ? ", checked in" : ""}${pModel(p.id) ? ", learned" : ""}`));
  })), h("div", { class: "row-acts" }, h("button", { class: "btn", on: { click: () => { S.view = "roster"; rosterTab = "ours"; save(); render(); } } }, "Open the roster"))];
}
function opponentPick() {
  return h("div", { class: "fields" }, h("label", { class: "f", style: { flex: "1 1 240px" } }, "Opponent",
    h("select", { on: { change: async (e) => {
      if (e.target.value === "__new") { const nt = await dbPut("teams", { name: `Opponent ${opponents().length + 1}`, isOurs: false, level: S.setup.level, notes: "" }); DB.teams.set(nt.id, nt); useOpponent(nt.id); toast("New opponent added. Rename them on the Roster screen."); return; }
      useOpponent(e.target.value || null); } } },
      h("option", { value: "" }, "No opponent picked"), opponents().map((t) => h("option", { value: t.id, selected: S.setup.opponentId === t.id ? true : null }, t.name)), h("option", { value: "__new" }, "New opponent…"))),
    S.setup.opponentId ? h("button", { class: "btn", on: { click: () => { S.view = "roster"; rosterTab = "opp"; teamSel = S.setup.opponentId; save(); render(); } } }, "Their roster") : null);
}
function catcherPick() {
  const list = [...DB.catchers.values()];
  return h("div", { class: "fields" }, h("label", { class: "f", style: { flex: "1 1 240px" } }, "Today's catcher",
    h("select", { on: { change: (e) => { S.setup.catcherId = e.target.value || null; G().call = null; save(); render(); } } },
      h("option", { value: "" }, "Average blocker (3)"), list.map((c) => h("option", { value: c.id, selected: S.setup.catcherId === c.id ? true : null }, `${c.name}, blocking ${c.block}`)))),
    h("button", { class: "btn", on: { click: () => { S.view = "roster"; rosterTab = "ours"; save(); render(); } } }, list.length ? "Edit catchers" : "Add catchers"));
}
// a lineup name -> a hitter on today's opponent: an existing one if the name matches, otherwise a new one
async function linkHitter(b, i) {
  const tid = S.setup.opponentId;
  if (!b.name) { b.hitterId = null; }
  else if (tid) {
    let x = teamHitters(tid).find((y) => y.name.toLowerCase() === b.name.toLowerCase());
    if (!x) { x = await dbPut("hitters", PCDB.newHitter(tid, { name: b.name, bats: b.hand })); DB.hitters.set(x.id, x); toast(`${b.name} added to ${DB.teams.get(tid).name}'s roster`); }
    b.hitterId = x.id; b.name = x.name; b.hand = x.bats;
    await relearnHitter(x.id);
  } else b.hitterId = null;
  delete G().know[String(i)];
  G().call = null; save(); render();
}
function uniqueName(pd, base) { let n = base, i = 2; while (pd.pitches.some((p) => p.name === n)) n = `${base} ${i++}`; return n; }
function renamePitch(pi, oldName, newName) { const c = G().conf[String(pi)]; if (c && oldName in c) { c[newName] = c[oldName]; delete c[oldName]; } }

// keyboard: the result keys, undo and shake-off, when not typing in a field
document.addEventListener("keydown", (e) => {
  if (S.view !== "live" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  const k = e.key.toUpperCase();
  const hit = KEYS.find((x) => x[2] === k);
  if (hit) { e.preventDefault(); tapResult(hit[0]); }
  else if (k === "U") { e.preventDefault(); undoLast(); }
  else if (k === "K" && G().call) { e.preventDefault(); shakeOff(); }
  else if (k === "ENTER" && pending && (pending.result !== "play" || pending.out)) { e.preventDefault(); record(pending); }
  else if (k === "ESCAPE" && (pending || pickMode)) { pending = null; pickMode = false; render(); }
});

render();
boot();
</script>
