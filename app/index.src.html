<title>PitchIQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#04070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..800&display=swap">
<style>
/* Night game broadcast.
   - Ground: a stadium at night. Faint infield line art and two light towers sit behind frosted-glass panels.
   - Colour lives on data only, and it's the pitch-type colour every tracking system uses
     (fastball red, slider yellow, curveball cyan, changeup green). Chrome stays white-on-glass.
   - The one bold moment: the ambient light behind the call takes the colour of the called pitch,
     and the target in the zone locks on.
   - One family, Saira: condensed width for the call and the scoreboard, normal width for everything else.
   - Radius ladder (from Raycast's DESIGN.md): 6 keycaps, 10 controls, 16 inner tiles, 22 panels. Pills for toggles. */
:root {
  --ground: #04070c;
  --ink: #eef3f8; --muted: #a6b0bd; --faint: #808b99;
  --glass: rgba(16, 23, 33, 0.58); --glass-2: rgba(30, 41, 56, 0.55); --glass-hi: rgba(255, 255, 255, 0.055);
  --stroke: rgba(255, 255, 255, 0.09); --stroke-2: rgba(255, 255, 255, 0.17); --rule: rgba(255, 255, 255, 0.07);
  --well: rgba(0, 0, 0, 0.28);
  --primary: #f4f7fb; --primary-ink: #04070c;
  --fb: #ff5468; --sl: #f6cb4c; --cb: #45c9ff; --ch: #3ddc8c; --si: #ff9447; --fc: #c58bff;
  --call: var(--cb);
  --warn: #ffb547; --warn-bg: rgba(255, 181, 71, 0.13);
  --neg: #ff7272;  --neg-bg: rgba(255, 114, 114, 0.13);
  --focus: #8fd8ff;
  --field-line: rgba(255, 255, 255, 0.07);
  --tower: rgba(170, 205, 255, 0.16);
  --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.75);
  --blur: blur(22px) saturate(150%);
  --font: "Saira", "Helvetica Neue", Arial, sans-serif;
  --r-key: 6px; --r-ctl: 10px; --r-tile: 16px; --r-panel: 22px;
  --gap: 16px; --pad: 22px;
  color-scheme: dark;
}
:root[data-theme="day"] {
  --ground: #d7e0ea;
  --ink: #0a1320; --muted: #475365; --faint: #586477;
  --glass: rgba(255, 255, 255, 0.62); --glass-2: rgba(255, 255, 255, 0.72); --glass-hi: rgba(255, 255, 255, 0.5);
  --stroke: rgba(20, 40, 70, 0.11); --stroke-2: rgba(20, 40, 70, 0.22); --rule: rgba(20, 40, 70, 0.08);
  --well: rgba(20, 40, 70, 0.06);
  --primary: #0a1320; --primary-ink: #ffffff;
  --fb: #d0245a; --sl: #a07c00; --cb: #1a74c8; --ch: #0f8a52; --si: #b8520a; --fc: #7d3fc4;
  --warn: #9a5a00; --warn-bg: rgba(255, 170, 40, 0.18);
  --neg: #b4232f;  --neg-bg: rgba(220, 50, 60, 0.12);
  --focus: #0a6fb0;
  --field-line: rgba(20, 50, 90, 0.10);
  --tower: rgba(255, 255, 255, 0.8);
  --shadow: 0 20px 50px -30px rgba(30, 50, 80, 0.45);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--ground); }
body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
p { margin: 0; }

/* the stadium behind the glass */
.stage { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.stage svg { position: absolute; left: 50%; bottom: -14vh; width: max(1400px, 120vw); transform: translateX(-50%); height: auto; }
.stage .tower { position: absolute; top: -18vh; width: 46vw; height: 46vw; border-radius: 50%; background: radial-gradient(closest-side, var(--tower), transparent); }
.stage .tower.l { left: -14vw; } .stage .tower.r { right: -14vw; }
.stage .glow { position: absolute; left: 4vw; top: 12vh; width: 56vw; height: 56vh; border-radius: 50%; background: var(--call); opacity: .17; filter: blur(110px); }
:root[data-theme="day"] .stage .glow { opacity: .14; }

.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); padding-block: max(14px, env(safe-area-inset-top, 0px)) 48px; }

/* glass */
.glass { background: linear-gradient(180deg, var(--glass-hi), transparent 120px), var(--glass); border: 1px solid var(--stroke); border-radius: var(--r-panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); }

/* top bar */
.bar { display: flex; align-items: center; gap: 18px; height: 58px; padding: 0 10px 0 16px; border-radius: 999px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; font-stretch: 112%; letter-spacing: .01em; }
.brand svg { display: block; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--well); border: 1px solid var(--rule); }
.tabs button { height: 34px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 550; color: var(--muted); transition: background-color .15s, color .15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { background: var(--primary); color: var(--primary-ink); }
.bar .end { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); min-width: 0; }
.stamp { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn { height: 38px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background-color .15s, border-color .15s, opacity .15s; }
.btn:hover:not([disabled]) { border-color: var(--ink); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { color: var(--faint); cursor: default; opacity: .6; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover:not([disabled]) { opacity: .9; }
.btn.pill { border-radius: 999px; }
.btn.text { border-color: transparent; background: none; padding: 0 8px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-2); }
.btn.text:hover { text-decoration-color: var(--ink); }
.btn.tiny { display: block; margin: 4px 0 0 auto; padding: 0; min-height: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.btn.warn { background: var(--warn); color: #1a1000; border-color: var(--warn); }
:root[data-theme="day"] .btn.warn { color: #fff; }

/* title row */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 26px 4px 14px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 28px; font-weight: 700; font-stretch: 88%; letter-spacing: -0.005em; line-height: 1.1; text-wrap: balance; }
.head .sub { margin-top: 4px; font-size: 15px; color: var(--muted); max-width: 72ch; display: flex; align-items: center; gap: 8px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }

/* scoreboard */
.strip { display: grid; grid-template-columns: 1.25fr 0.8fr 1fr 1fr 1fr auto; padding: 6px; border-radius: var(--r-panel); }
.cell { padding: 10px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--rule); }
.cell .k { font-size: 13px; color: var(--muted); }
.cell .v { font-size: 30px; font-weight: 650; font-stretch: 75%; line-height: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell .v small { font-size: 14px; font-weight: 450; font-stretch: 100%; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.edit { justify-content: center; align-items: center; }
.lights { display: grid; grid-template-columns: auto auto; gap: 5px 8px; align-items: center; font-size: 11px; font-weight: 600; font-stretch: 100%; color: var(--faint); }
.lights span { display: flex; gap: 4px; }
.lights i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--stroke-2); }
.lights .b.on { background: var(--ch); border-color: var(--ch); box-shadow: 0 0 10px var(--ch); }
.lights .s.on { background: var(--fb); border-color: var(--fb); box-shadow: 0 0 10px var(--fb); }
.outs { display: flex; gap: 6px; }
.outs i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--stroke-2); }
.outs i.on { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px var(--warn); }
.diamond { width: 34px; height: 30px; position: relative; flex: none; }
.diamond i { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--stroke-2); border-radius: 2px; }
.diamond i.on { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 10px var(--ink); }
.diamond .b2 { left: 11.5px; top: 1px; } .diamond .b1 { right: 2px; top: 11px; } .diamond .b3 { left: 2px; top: 11px; }
:root[data-theme="day"] .lights .on, :root[data-theme="day"] .outs .on, :root[data-theme="day"] .diamond .on { box-shadow: none; }

.fix { margin-top: 10px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; border-radius: var(--r-tile); }
.stepper { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.stepper .lab { color: var(--muted); min-width: 52px; }
.stepper button { width: 38px; height: 38px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 18px; line-height: 1; }
.stepper button:hover { border-color: var(--ink); }
.stepper output { min-width: 18px; text-align: center; font-weight: 650; font-size: 17px; }
.toggles { display: flex; gap: 6px; }
.toggles button { height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--stroke-2); font-size: 14px; }
.toggles button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

/* main grid */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: var(--gap); align-items: start; }
.panel { padding: var(--pad); min-width: 0; }
.span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-12 { grid-column: 1 / -1; }
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 650; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }

/* pitch chips: sign number in the pitch's colour */
.chip { --c: var(--ink); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--c); color: var(--c); font-size: 14px; font-weight: 700; font-stretch: 75%; flex: none; line-height: 1; }
.k-FB { --c: var(--fb); } .k-SL { --c: var(--sl); } .k-CB { --c: var(--cb); } .k-CH { --c: var(--ch); } .k-SI { --c: var(--si); } .k-FC { --c: var(--fc); }

/* the call */
.call-panel { position: relative; overflow: hidden; }
.call-panel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--call); opacity: .9; }
.hitter { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.hitter b { font-size: 17px; font-weight: 650; }
.hitter span { color: var(--muted); font-size: 14px; }
.call { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: center; padding-top: 18px; }
.call-main { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 20px; align-items: start; min-width: 0; }
.sign { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; font-weight: 750; font-stretch: 70%; margin-top: 8px; color: var(--call); border: 2px solid var(--call); background: color-mix(in srgb, var(--call) 14%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--call) 10%, transparent), 0 0 40px color-mix(in srgb, var(--call) 35%, transparent); }
.pitch { font-size: clamp(60px, 7.4vw, 104px); line-height: .9; font-weight: 750; font-stretch: 62%; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot { margin-top: 8px; font-size: clamp(24px, 2.6vw, 32px); font-weight: 600; font-stretch: 80%; color: var(--call); line-height: 1.1; }
.why { grid-column: 2; margin-top: 14px; color: var(--muted); font-size: 15px; max-width: 46ch; }
.why b { color: var(--ink); font-weight: 650; }
.readout { grid-column: 2; margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, max-content)); gap: 0; border-radius: var(--r-tile); background: var(--well); border: 1px solid var(--rule); width: max-content; max-width: 100%; }
.readout > div { padding: 10px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.readout > div + div { border-left: 1px solid var(--rule); }
.readout .k { font-size: 12px; color: var(--muted); white-space: nowrap; }
.readout .v { font-size: 24px; font-weight: 650; font-stretch: 75%; line-height: 1.05; }
.readout .v small { font-size: 13px; font-weight: 450; font-stretch: 100%; color: var(--muted); margin-left: 4px; }
.coachmark { display: inline-block; margin-left: 12px; font-size: 13px; font-weight: 650; color: var(--warn); background: var(--warn-bg); padding: 3px 10px; border-radius: 999px; vertical-align: 10px; font-stretch: 100%; letter-spacing: 0; }
.zone { padding: 10px; border-radius: var(--r-tile); background: var(--well); border: 1px solid var(--rule); }
.zone svg { display: block; width: 100%; height: auto; overflow: visible; }
.zone .lock { transform-box: fill-box; transform-origin: center; }
.call-acts { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 18px; }
.options { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
.options .t { font-size: 13px; color: var(--muted); margin-bottom: 6px; cursor: pointer; list-style: none; }
.options .t::-webkit-details-marker { display: none; }
.options[open] .t { pointer-events: none; }
@media (max-width: 700px) { .options .t { pointer-events: auto !important; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; display: flex; align-items: center; } }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(80px, 180px) 44px; gap: 12px; align-items: center; height: 36px; font-size: 14px; color: var(--muted); }
.opt .track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.opt .track i { display: block; height: 100%; background: var(--c); opacity: .55; border-radius: 3px; }
.opt.is-call { color: var(--ink); font-weight: 650; } .opt.is-call .track i { opacity: 1; box-shadow: 0 0 12px var(--c); }
.opt .p { text-align: right; color: var(--ink); }
.pick { margin-top: 18px; padding: 16px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); display: flex; flex-direction: column; gap: 12px; }
.pick .t { font-size: 14px; font-weight: 650; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s, border-color .15s; }
.seg button:hover { border-color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.seg button[aria-pressed="true"] .chip { --c: var(--primary-ink); }

/* entry keypad */
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.key { height: 66px; border-radius: var(--r-tile); border: 1px solid var(--stroke); background: linear-gradient(180deg, var(--glass-hi), transparent), var(--glass-2); display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; font-size: 17px; font-weight: 600; font-stretch: 90%; text-align: left; transition: background-color .12s, border-color .12s, transform .08s; }
.key:hover { border-color: var(--stroke-2); }
.key:active { transform: scale(.98); }
.key kbd { font: 600 12px var(--font); color: var(--muted); min-width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: var(--r-key); border: 1px solid var(--stroke-2); border-bottom-width: 2px; background: var(--well); }
.key[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.key[aria-pressed="true"] kbd { color: inherit; border-color: transparent; background: transparent; }
.detail { margin-top: 12px; padding: 14px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); display: flex; flex-direction: column; gap: 10px; }
.detail .t { font-size: 13px; color: var(--muted); }
.detail .go { display: flex; gap: 8px; margin-top: 4px; }
.fixbox { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); }
.fixbox .fixrow { display: flex; flex-direction: column; gap: 6px; }
.fixbox .t { font-size: 13px; color: var(--muted); }
.fixbox .btn { align-self: flex-start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.detail details.more { display: flex; flex-direction: column; gap: 8px; }
.detail details.more > summary { cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-2); }
.detail details.more[open] > summary { margin-bottom: 8px; }
.detail details.more .seg { margin: 6px 0 4px; }
.ab { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.ab .t { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ab ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ab li { display: grid; grid-template-columns: 32px 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; }
.ab li .c { color: var(--muted); }
.ab li .r { color: var(--muted); text-align: right; }
.ab .empty { font-size: 14px; color: var(--muted); }

/* pitcher */
.pstat { font-size: 15px; margin: 0 0 14px; padding: 10px 12px; border-radius: var(--r-ctl); }
.pstat.watch { background: var(--warn-bg); color: var(--warn); }
.pstat.change { background: var(--neg-bg); color: var(--neg); }
.pstat b { font-weight: 650; }
.trust { display: flex; flex-direction: column; gap: 14px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) 42px; gap: 6px 10px; align-items: center; font-size: 14px; }
.trow .chip { grid-row: span 2; }
.trow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .nm span { color: var(--muted); }
.trow .v { text-align: right; font-weight: 650; }
.bullet { grid-column: 2 / -1; position: relative; height: 8px; background: var(--rule); border-radius: 4px; }
.bullet i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 4px; box-shadow: 0 0 12px color-mix(in srgb, var(--c) 50%, transparent); }
.bullet.out i { opacity: .3; box-shadow: none; }
.bullet b { position: absolute; top: -5px; bottom: -5px; width: 2px; border-radius: 1px; background: var(--ink); }
.trust-note { font-size: 13px; color: var(--muted); margin-top: 14px; }

/* log table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 450; font-size: 13px; color: var(--muted); padding: 0 10px 8px; white-space: nowrap; }
td { padding: 10px; border-top: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.num, th.num { text-align: right; }
tr.pa-end td { border-bottom: 1px solid var(--stroke-2); }
.res-strong { font-weight: 650; }
.empty-row td { color: var(--muted); white-space: normal; }

/* inning over */
.done { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 34px var(--pad); }
.done h2 { font-size: 44px; font-weight: 750; font-stretch: 65%; line-height: 1; }
.done p { color: var(--muted); max-width: 52ch; }

/* setup */
.srow { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; padding-block: 22px; }
.srow.wide { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.srow.wide .desc { max-width: 72ch; }
.srow h2 { margin: 0; font-size: 18px; font-weight: 650; }
.srow .desc { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 44ch; }
.spanel { padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { text-align: left; border: 1px solid var(--stroke); border-radius: var(--r-tile); padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; background: var(--glass-2); transition: border-color .15s, background-color .15s; }
.choice:hover { border-color: var(--stroke-2); }
.choice b { font-size: 15px; font-weight: 650; }

function hitterRead() {

  for (const [k, w] of [["FB", "fastballs"], ["OS", "off-speed"]]) {

function zoneSVG(c) {
  // Catcher's view. A right-handed hitter stands on the catcher's left, so his inside half is on the left.
  // "R" or "L" only: the hand is written into the SVG markup, and a hitter's bats can come from a synced record
  const hand = batterDef().hand === "S" ? (pitcherDef().hand === "L" ? "R" : "L") : batterDef().hand === "L" ? "L" : "R";
  const inLeft = hand === "R";
  const kind = kindOf(c.pitch);
  const VW = 260, X = 70, Y = 44, W = 120, H = 150, cw = W / 3, ch = H / 3;
  const F = `font-family="Saira, sans-serif"`;
  const cell = (q) => { const a = inLeft ? 0 : 2, b = inLeft ? 2 : 0; return { "up-in": [a, 0], "up-away": [b, 0], "down-in": [a, 2], "down-away": [b, 2], middle: [1, 1], "down-middle": [1, 2] }[q]; };
  const at = (q, k) => {
    if (q === "chase") return E.isOffspeed(k) ? [inLeft ? X + W + 26 : X - 26, Y + H + 22] : [X + W / 2, Y - 24];
    const [cx, cy] = cell(q); return [X + cw * cx + cw / 2, Y + ch * cy + ch / 2];
  };
  let s = `<svg viewBox="0 0 ${VW} 262" role="img" aria-label="Target ${SPOT[c.quad].toLowerCase()}, catcher's view, hitter ${hand === "R" ? "right" : "left"}-handed">`;
  // chase band around the zone
  s += `<rect x="${X - 20}" y="${Y - 20}" width="${W + 40}" height="${H + 40}" rx="10" fill="none" stroke="var(--stroke-2)" stroke-dasharray="3 5"/>`;
  s += `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="var(--rule)"/>`;
  if (c.quad !== "chase") { const [cx, cy] = cell(c.quad); s += `<rect x="${X + cw * cx}" y="${Y + ch * cy}" width="${cw}" height="${ch}" fill="var(--call)" fill-opacity=".2"/>`; }
  for (let i = 1; i < 3; i++) {
    s += `<line x1="${X + cw * i}" y1="${Y}" x2="${X + cw * i}" y2="${Y + H}" stroke="var(--stroke)"/>`;
    s += `<line x1="${X}" y1="${Y + ch * i}" x2="${X + W}" y2="${Y + ch * i}" stroke="var(--stroke)"/>`;
  }
  s += `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="var(--ink)" stroke-opacity=".8" stroke-width="1.5"/>`;
  // hitter
  const bx = inLeft ? 8 : VW - 8 - 24;
  s += `<rect x="${bx}" y="${Y + 10}" width="24" height="${H - 20}" rx="12" fill="var(--rule)" stroke="var(--stroke-2)"/>`;
  s += `<text x="${bx + 12}" y="${Y + H / 2 + 5}" text-anchor="middle" ${F} font-size="14" font-weight="650" fill="var(--muted)">${hand}</text>`;
  s += `<text x="${bx + 12}" y="${Y + H + 4}" text-anchor="middle" ${F} font-size="11" fill="var(--muted)">inside</text>`;
  // plate, in perspective
  s += `<path d="M${X + 18} ${Y + H + 40} h${W - 36} l10 8 l-${W / 2 - 8} 10 l-${W / 2 - 8} -10 z" fill="var(--rule)" stroke="var(--stroke-2)" stroke-width="1.2"/>`;
  for (const d of c.dist) {

    const k = kindOf(d.pitch), [x, y] = at(d.quad, k), r = 5 + 10 * d.prob;
    s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${PCOLOR(k)}" fill-opacity=".08" stroke="${PCOLOR(k)}" stroke-opacity=".75" stroke-width="1.5"/>`;
    if (r >= 8) s += `<text x="${x}" y="${y + 4}" text-anchor="middle" ${F} font-size="11" font-weight="700" fill="${PCOLOR(k)}" fill-opacity=".9">${signFor(k, d.pitch)}</text>`;
  }
  const [tx, ty] = at(c.quad, kind);
  s += `<circle class="ring r2" cx="${tx}" cy="${ty}" r="31" fill="none" stroke="var(--call)" stroke-opacity=".25" stroke-width="1.5"/>`;
  s += `<circle class="ring" cx="${tx}" cy="${ty}" r="24" fill="none" stroke="var(--call)" stroke-opacity=".55" stroke-width="1.5"/>`;
  s += `<g class="core"><circle cx="${tx}" cy="${ty}" r="17" fill="var(--call)"/>`;
  s += `<text x="${tx}" y="${ty + 7}" text-anchor="middle" ${F} font-stretch="70%" font-weight="750" font-size="21" fill="var(--ground)">${signFor(kind, c.pitch)}</text></g>`;
  return s + `</svg>`;
}

// D9: the game is closed in the database and on the iPad, and the next one is up, before any learning runs. Learning
// then happens in the background; if the page is closed mid-learning, it finishes on the next launch.
async function endGame() {
  const had = G().log.length;
  undo = [];
  const comp = had ? await finishGameRecord() : null;
  archiveGame(); S.game = newGame(); S.sample = false; S.view = "live"; pastFix.games = null; save(); render();
  if (!comp) { toast("New game started. First pitch is up."); return; }
  const pct = (x) => Math.round(100 * x) + "%";
  const used = comp.located >= 0.9 ? "locations will be used" : "under 90% located, so locations from it won't be used";
  toast(`Game saved: ${comp.pitches} pitches, ${pct(comp.located)} located (${used}). New game is up.`);
  // an update must not reload the page while the game's learning is being saved: the shell waits while PC_BUSY
  if (typeof window !== "undefined") window.PC_BUSY = true;
  try { if (comp.learn) await learnAfterGame(comp.learn); }
  finally {
    if (typeof window !== "undefined") {
      window.PC_BUSY = false;
      if (window.PC_UPDATE_WAITING && window.PC_APPLY_UPDATE) window.PC_APPLY_UPDATE();   // an update that waited for this game
    }
  }
}

// a lineup name -> a hitter on today's opponent: an existing one if the name matches, otherwise a new one
async function linkHitter(b, i) {
  const tid = S.setup.opponentId;
  if (!b.name) { b.hitterId = null; }
  else if (tid) {
    let x = teamHitters(tid).find((y) => y.name.toLowerCase() === b.name.toLowerCase());
    if (!x) { x = await dbPut("hitters", PCDB.newHitter(tid, { name: b.name, bats: b.hand })); DB.hitters.set(x.id, x); toast(`${b.name} added to ${DB.teams.get(tid).name}'s roster`); }

    await relearnHitter(x.id);
  } else b.hitterId = null;
  delete G().know[String(i)];
  if (G().dbId) { logPlay("sub_hitter", { slotChanged: i, inId: b.hitterId || null, name: b.name, hand: b.hand }); makePack("lineup"); }
  G().call = null; save(); render();
}
function uniqueName(pd, base) { let n = base, i = 2; while (pd.pitches.some((p) => p.name === n)) n = `${base} ${i++}`; return n; }
function renamePitch(pi, oldName, newName) { const c = G().conf[String(pi)]; if (c && oldName in c) { c[newName] = c[oldName]; delete c[oldName]; } }

// keyboard: the result keys, undo and shake-off, when not typing in a field
document.addEventListener("keydown", (e) => {
  if (S.view !== "live" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  const k = e.key.toUpperCase();
  const hit = KEYS.find((x) => x[2] === k);
  if (hit) { e.preventDefault(); tapResult(hit[0]); }
  else if (k === "U") { e.preventDefault(); undoLast(); }
  else if (k === "K" && G().call) { e.preventDefault(); shakeOff(); }
  else if (k === "ENTER" && pending && (pending.result !== "play" || pending.out)) { e.preventDefault(); record(pending); }
  else if (k === "ESCAPE" && (pending || pickMode)) { pending = null; pickMode = false; render(); }
});
