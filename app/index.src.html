<title>Pitch Caller</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#04070c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:wdth,wght@50..125,300..800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Night game broadcast.
   - Ground: a stadium at night. Faint infield line art and two light towers sit behind frosted-glass panels.
   - Colour lives on data only, and it's the pitch-type colour every tracking system uses
     (fastball red, slider yellow, curveball cyan, changeup green). Chrome stays white-on-glass.
   - The one bold moment: the ambient light behind the call takes the colour of the called pitch,
     and the target in the zone locks on.
   - One family, Saira: condensed width for the call and the scoreboard, normal width for everything else.
   - Radius ladder (from Raycast's DESIGN.md): 6 keycaps, 10 controls, 16 inner tiles, 22 panels. Pills for toggles. */
:root {
  --ground: #04070c;
  --ink: #eef3f8; --muted: #a6b0bd; --faint: #808b99;
  --glass: rgba(16, 23, 33, 0.58); --glass-2: rgba(30, 41, 56, 0.55); --glass-hi: rgba(255, 255, 255, 0.055);
  --stroke: rgba(255, 255, 255, 0.09); --stroke-2: rgba(255, 255, 255, 0.17); --rule: rgba(255, 255, 255, 0.07);
  --well: rgba(0, 0, 0, 0.28);
  --primary: #f4f7fb; --primary-ink: #04070c;
  --fb: #ff5468; --sl: #f6cb4c; --cb: #45c9ff; --ch: #3ddc8c;
  --call: var(--cb);
  --warn: #ffb547; --warn-bg: rgba(255, 181, 71, 0.13);
  --neg: #ff7272;  --neg-bg: rgba(255, 114, 114, 0.13);
  --focus: #8fd8ff;
  --field-line: rgba(255, 255, 255, 0.07);
  --tower: rgba(170, 205, 255, 0.16);
  --shadow: 0 24px 60px -28px rgba(0, 0, 0, 0.75);
  --blur: blur(22px) saturate(150%);
  --font: "Saira", "Helvetica Neue", Arial, sans-serif;
  --r-key: 6px; --r-ctl: 10px; --r-tile: 16px; --r-panel: 22px;
  --gap: 16px; --pad: 22px;
  color-scheme: dark;
}
:root[data-theme="day"] {
  --ground: #d7e0ea;
  --ink: #0a1320; --muted: #475365; --faint: #586477;
  --glass: rgba(255, 255, 255, 0.62); --glass-2: rgba(255, 255, 255, 0.72); --glass-hi: rgba(255, 255, 255, 0.5);
  --stroke: rgba(20, 40, 70, 0.11); --stroke-2: rgba(20, 40, 70, 0.22); --rule: rgba(20, 40, 70, 0.08);
  --well: rgba(20, 40, 70, 0.06);
  --primary: #0a1320; --primary-ink: #ffffff;
  --fb: #d0245a; --sl: #a07c00; --cb: #1a74c8; --ch: #0f8a52;
  --warn: #9a5a00; --warn-bg: rgba(255, 170, 40, 0.18);
  --neg: #b4232f;  --neg-bg: rgba(220, 50, 60, 0.12);
  --focus: #0a6fb0;
  --field-line: rgba(20, 50, 90, 0.10);
  --tower: rgba(255, 255, 255, 0.8);
  --shadow: 0 20px 50px -30px rgba(30, 50, 80, 0.45);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--ground); }
body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
p { margin: 0; }

/* the stadium behind the glass */
.stage { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.stage svg { position: absolute; left: 50%; bottom: -14vh; width: max(1400px, 120vw); transform: translateX(-50%); height: auto; }
.stage .tower { position: absolute; top: -18vh; width: 46vw; height: 46vw; border-radius: 50%; background: radial-gradient(closest-side, var(--tower), transparent); }
.stage .tower.l { left: -14vw; } .stage .tower.r { right: -14vw; }
.stage .glow { position: absolute; left: 4vw; top: 12vh; width: 56vw; height: 56vh; border-radius: 50%; background: var(--call); opacity: .17; filter: blur(110px); }
:root[data-theme="day"] .stage .glow { opacity: .14; }

.wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px)); padding-block: max(14px, env(safe-area-inset-top, 0px)) 48px; }

/* glass */
.glass { background: linear-gradient(180deg, var(--glass-hi), transparent 120px), var(--glass); border: 1px solid var(--stroke); border-radius: var(--r-panel); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: inset 0 1px 0 var(--glass-hi), var(--shadow); }

/* top bar */
.bar { display: flex; align-items: center; gap: 18px; height: 58px; padding: 0 10px 0 16px; border-radius: 999px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; font-stretch: 112%; letter-spacing: .01em; }
.brand svg { display: block; }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--well); border: 1px solid var(--rule); }
.tabs button { height: 34px; padding: 0 18px; border-radius: 999px; font-size: 14px; font-weight: 550; color: var(--muted); transition: background-color .15s, color .15s; }
.tabs button:hover { color: var(--ink); }
.tabs button[aria-current="page"] { background: var(--primary); color: var(--primary-ink); }
.bar .end { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); min-width: 0; }
.stamp { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.btn { height: 38px; padding: 0 16px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background-color .15s, border-color .15s, opacity .15s; }
.btn:hover:not([disabled]) { border-color: var(--ink); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn[disabled] { color: var(--faint); cursor: default; opacity: .6; }
.btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.btn.primary:hover:not([disabled]) { opacity: .9; }
.btn.pill { border-radius: 999px; }
.btn.text { border-color: transparent; background: none; padding: 0 8px; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-2); }
.btn.text:hover { text-decoration-color: var(--ink); }
.btn.tiny { display: block; margin: 4px 0 0 auto; padding: 0; min-height: 0; font-size: 12px; font-weight: 500; color: var(--muted); }
.btn.warn { background: var(--warn); color: #1a1000; border-color: var(--warn); }
:root[data-theme="day"] .btn.warn { color: #fff; }

/* title row */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding: 26px 4px 14px; flex-wrap: wrap; }
.head h1 { margin: 0; font-size: 28px; font-weight: 700; font-stretch: 88%; letter-spacing: -0.005em; line-height: 1.1; text-wrap: balance; }
.head .sub { margin-top: 4px; font-size: 15px; color: var(--muted); max-width: 72ch; display: flex; align-items: center; gap: 8px; }
.dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }

/* scoreboard */
.strip { display: grid; grid-template-columns: 1.25fr 0.8fr 1fr 1fr 1fr auto; padding: 6px; border-radius: var(--r-panel); }
.cell { padding: 10px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cell + .cell { border-left: 1px solid var(--rule); }
.cell .k { font-size: 13px; color: var(--muted); }
.cell .v { font-size: 30px; font-weight: 650; font-stretch: 75%; line-height: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.cell .v small { font-size: 14px; font-weight: 450; font-stretch: 100%; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cell.edit { justify-content: center; align-items: center; }
.lights { display: grid; grid-template-columns: auto auto; gap: 5px 8px; align-items: center; font-size: 11px; font-weight: 600; font-stretch: 100%; color: var(--faint); }
.lights span { display: flex; gap: 4px; }
.lights i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--stroke-2); }
.lights .b.on { background: var(--ch); border-color: var(--ch); box-shadow: 0 0 10px var(--ch); }
.lights .s.on { background: var(--fb); border-color: var(--fb); box-shadow: 0 0 10px var(--fb); }
.outs { display: flex; gap: 6px; }
.outs i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--stroke-2); }
.outs i.on { background: var(--warn); border-color: var(--warn); box-shadow: 0 0 10px var(--warn); }
.diamond { width: 34px; height: 30px; position: relative; flex: none; }
.diamond i { position: absolute; width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--stroke-2); border-radius: 2px; }
.diamond i.on { background: var(--ink); border-color: var(--ink); box-shadow: 0 0 10px var(--ink); }
.diamond .b2 { left: 11.5px; top: 1px; } .diamond .b1 { right: 2px; top: 11px; } .diamond .b3 { left: 2px; top: 11px; }
:root[data-theme="day"] .lights .on, :root[data-theme="day"] .outs .on, :root[data-theme="day"] .diamond .on { box-shadow: none; }

.fix { margin-top: 10px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; border-radius: var(--r-tile); }
.stepper { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.stepper .lab { color: var(--muted); min-width: 52px; }
.stepper button { width: 38px; height: 38px; border-radius: var(--r-ctl); border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 18px; line-height: 1; }
.stepper button:hover { border-color: var(--ink); }
.stepper output { min-width: 18px; text-align: center; font-weight: 650; font-size: 17px; }
.toggles { display: flex; gap: 6px; }
.toggles button { height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--stroke-2); font-size: 14px; }
.toggles button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }

/* main grid */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: var(--gap); align-items: start; }
.panel { padding: var(--pad); min-width: 0; }
.span-8 { grid-column: span 8; } .span-4 { grid-column: span 4; } .span-12 { grid-column: 1 / -1; }
.col { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
.panel h2 { margin: 0; font-size: 16px; font-weight: 650; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.panel-head .meta { font-size: 13px; color: var(--muted); }

/* pitch chips: sign number in the pitch's colour */
.chip { --c: var(--ink); display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--c); color: var(--c); font-size: 14px; font-weight: 700; font-stretch: 75%; flex: none; line-height: 1; }
.k-FB { --c: var(--fb); } .k-SL { --c: var(--sl); } .k-CB { --c: var(--cb); } .k-CH { --c: var(--ch); }

/* the call */
.call-panel { position: relative; overflow: hidden; }
.call-panel::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 2px; background: var(--call); opacity: .9; }
.hitter { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
.hitter b { font-size: 17px; font-weight: 650; }
.hitter span { color: var(--muted); font-size: 14px; }
.call { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: center; padding-top: 18px; }
.call-main { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 20px; align-items: start; min-width: 0; }
.sign { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 44px; font-weight: 750; font-stretch: 70%; margin-top: 8px; color: var(--call); border: 2px solid var(--call); background: color-mix(in srgb, var(--call) 14%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--call) 10%, transparent), 0 0 40px color-mix(in srgb, var(--call) 35%, transparent); }
.pitch { font-size: clamp(60px, 7.4vw, 104px); line-height: .9; font-weight: 750; font-stretch: 62%; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot { margin-top: 8px; font-size: clamp(24px, 2.6vw, 32px); font-weight: 600; font-stretch: 80%; color: var(--call); line-height: 1.1; }
.why { grid-column: 2; margin-top: 14px; color: var(--muted); font-size: 15px; max-width: 46ch; }
.why b { color: var(--ink); font-weight: 650; }
.readout { grid-column: 2; margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, max-content)); gap: 0; border-radius: var(--r-tile); background: var(--well); border: 1px solid var(--rule); width: max-content; max-width: 100%; }
.readout > div { padding: 10px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.readout > div + div { border-left: 1px solid var(--rule); }
.readout .k { font-size: 12px; color: var(--muted); white-space: nowrap; }
.readout .v { font-size: 24px; font-weight: 650; font-stretch: 75%; line-height: 1.05; }
.readout .v small { font-size: 13px; font-weight: 450; font-stretch: 100%; color: var(--muted); margin-left: 4px; }
.coachmark { display: inline-block; margin-left: 12px; font-size: 13px; font-weight: 650; color: var(--warn); background: var(--warn-bg); padding: 3px 10px; border-radius: 999px; vertical-align: 10px; font-stretch: 100%; letter-spacing: 0; }
.zone { padding: 10px; border-radius: var(--r-tile); background: var(--well); border: 1px solid var(--rule); }
.zone svg { display: block; width: 100%; height: auto; overflow: visible; }
.zone .lock { transform-box: fill-box; transform-origin: center; }
.call-acts { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 18px; }
.options { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--rule); }
.options .t { font-size: 13px; color: var(--muted); margin-bottom: 6px; cursor: pointer; list-style: none; }
.options .t::-webkit-details-marker { display: none; }
.options[open] .t { pointer-events: none; }
@media (max-width: 700px) { .options .t { pointer-events: auto !important; text-decoration: underline; text-underline-offset: 3px; min-height: 32px; display: flex; align-items: center; } }
.opt { display: grid; grid-template-columns: 28px minmax(0, 1fr) minmax(80px, 180px) 44px; gap: 12px; align-items: center; height: 36px; font-size: 14px; color: var(--muted); }
.opt .track { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.opt .track i { display: block; height: 100%; background: var(--c); opacity: .55; border-radius: 3px; }
.opt.is-call { color: var(--ink); font-weight: 650; } .opt.is-call .track i { opacity: 1; box-shadow: 0 0 12px var(--c); }
.opt .p { text-align: right; color: var(--ink); }
.pick { margin-top: 18px; padding: 16px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); display: flex; flex-direction: column; gap: 12px; }
.pick .t { font-size: 14px; font-weight: 650; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--stroke-2); background: var(--glass-2); font-size: 14px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; transition: background-color .15s, border-color .15s; }
.seg button:hover { border-color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.seg button[aria-pressed="true"] .chip { --c: var(--primary-ink); }

/* entry keypad */
.keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.key { height: 66px; border-radius: var(--r-tile); border: 1px solid var(--stroke); background: linear-gradient(180deg, var(--glass-hi), transparent), var(--glass-2); display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 16px; font-size: 17px; font-weight: 600; font-stretch: 90%; text-align: left; transition: background-color .12s, border-color .12s, transform .08s; }
.key:hover { border-color: var(--stroke-2); }
.key:active { transform: scale(.98); }
.key kbd { font: 600 12px var(--font); color: var(--muted); min-width: 24px; height: 24px; display: inline-grid; place-items: center; border-radius: var(--r-key); border: 1px solid var(--stroke-2); border-bottom-width: 2px; background: var(--well); }
.key[aria-pressed="true"] { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.key[aria-pressed="true"] kbd { color: inherit; border-color: transparent; background: transparent; }
.detail { margin-top: 12px; padding: 14px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); display: flex; flex-direction: column; gap: 10px; }
.detail .t { font-size: 13px; color: var(--muted); }
.detail .go { display: flex; gap: 8px; margin-top: 4px; }
.fixbox { display: flex; flex-direction: column; gap: 10px; padding: 12px; background: var(--well); border: 1px solid var(--rule); border-radius: var(--r-tile); }
.fixbox .fixrow { display: flex; flex-direction: column; gap: 6px; }
.fixbox .t { font-size: 13px; color: var(--muted); }
.fixbox .btn { align-self: flex-start; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.detail details.more { display: flex; flex-direction: column; gap: 8px; }
.detail details.more > summary { cursor: pointer; list-style: none; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--stroke-2); }
.detail details.more[open] > summary { margin-bottom: 8px; }
.detail details.more .seg { margin: 6px 0 4px; }
.ab { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--rule); }
.ab .t { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ab ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.ab li { display: grid; grid-template-columns: 32px 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 14px; padding: 4px 0; }
.ab li .c { color: var(--muted); }
.ab li .r { color: var(--muted); text-align: right; }
.ab .empty { font-size: 14px; color: var(--muted); }

/* pitcher */
.pstat { font-size: 15px; margin: 0 0 14px; padding: 10px 12px; border-radius: var(--r-ctl); }
.pstat.watch { background: var(--warn-bg); color: var(--warn); }
.pstat.change { background: var(--neg-bg); color: var(--neg); }
.pstat b { font-weight: 650; }
.trust { display: flex; flex-direction: column; gap: 14px; }
.trow { display: grid; grid-template-columns: 24px minmax(0, 1fr) 42px; gap: 6px 10px; align-items: center; font-size: 14px; }
.trow .chip { grid-row: span 2; }
.trow .nm { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow .nm span { color: var(--muted); }
.trow .v { text-align: right; font-weight: 650; }
.bullet { grid-column: 2 / -1; position: relative; height: 8px; background: var(--rule); border-radius: 4px; }
.bullet i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 4px; box-shadow: 0 0 12px color-mix(in srgb, var(--c) 50%, transparent); }
.bullet.out i { opacity: .3; box-shadow: none; }
.bullet b { position: absolute; top: -5px; bottom: -5px; width: 2px; border-radius: 1px; background: var(--ink); }
.trust-note { font-size: 13px; color: var(--muted); margin-top: 14px; }

/* log table */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 450; font-size: 13px; color: var(--muted); padding: 0 10px 8px; white-space: nowrap; }
td { padding: 10px; border-top: 1px solid var(--rule); white-space: nowrap; }
th:first-child, td:first-child { padding-left: 0; }
th:last-child, td:last-child { padding-right: 0; }
td.num, th.num { text-align: right; }
tr.pa-end td { border-bottom: 1px solid var(--stroke-2); }
.res-strong { font-weight: 650; }
.empty-row td { color: var(--muted); white-space: normal; }

/* inning over */
.done { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 34px var(--pad); }
.done h2 { font-size: 44px; font-weight: 750; font-stretch: 65%; line-height: 1; }
.done p { color: var(--muted); max-width: 52ch; }

/* setup */
.srow { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px; padding-block: 22px; }
.srow.wide { grid-template-columns: minmax(0, 1fr); gap: 14px; }
.srow.wide .desc { max-width: 72ch; }
.srow h2 { margin: 0; font-size: 18px; font-weight: 650; }
.srow .desc { margin-top: 6px; color: var(--muted); font-size: 14px; max-width: 44ch; }
.spanel { padding: 18px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.choice { text-align: left; border: 1px solid var(--stroke); border-radius: var(--r-tile); padding: 14px 16px; display: flex; flex-direction: column; gap: 3px; background: var(--glass-2); transition: border-color .15s, background-color .15s; }
.choice:hover { border-color: var(--stroke-2); }
.choice b { font-size: 15px; font-weight: 650; }
.choice span { font-size: 13px; color: var(--muted); }

  --fd: "Barlow Condensed", "Arial Narrow", sans-serif;

  --lv-bg: #D7DCE1; --lv-grid: rgba(8,11,14,.06); --lv-glass: rgba(255,255,255,.80); --lv-glass-line: rgba(8,11,14,.14);
  --lv-surface: #FFFFFF; --lv-surface2: #EEF1F4; --lv-surface3: #DCE2E8; --lv-line: #B9C3CD;
  --lv-text: #080B0E; --lv-text2: #323E4A; --lv-text3: #525E6A;
  --lv-btn: #FFFFFF; --lv-btn-line: #080B0E; --lv-btn-text: #080B0E; --lv-sel: #080B0E; --lv-sel-text: #FFFFFF;
  --lv-warn-text: #7A4700; --lv-warn-bg: #FFF1D6; --lv-warn-line: #E09A1A;
  --lv-chip-bg: rgba(8,11,14,.04); --lv-row-bg: rgba(255,255,255,.7); --lv-zone: #F3F5F7; --lv-chase: rgba(8,11,14,.035);
  --lv-shadow: 0 14px 36px rgba(20,30,40,.20); --lv-scrim: rgba(8,11,14,.42); --lv-toast-btn: rgba(255,255,255,.16);
  --pi-fb: #C41F17; --pi-sl: #7F6400; --pi-cb: #0A5BC0; --pi-ch: #0B7F43;
}

/* the page around the game screen: a fixed-height board, no page scroll on a landscape iPad */
body.is-live, html:has(body.is-live) { background: var(--lv-bg); }
body.is-live { background:
  radial-gradient(56vw 54vh at 47% 46%, color-mix(in srgb, var(--lv-call) 13%, transparent), transparent 70%),
  linear-gradient(var(--lv-grid) 1px, transparent 1px) 0 0 / 44px 44px,
  linear-gradient(90deg, var(--lv-grid) 1px, transparent 1px) 0 0 / 44px 44px, var(--lv-bg); color: var(--lv-text); font-family: var(--fb-text); }
:root[data-theme="day"] body.is-live { background:
  radial-gradient(56vw 54vh at 47% 46%, color-mix(in srgb, var(--lv-call) 22%, transparent), transparent 70%),
  linear-gradient(var(--lv-grid) 1px, transparent 1px) 0 0 / 44px 44px,
  linear-gradient(90deg, var(--lv-grid) 1px, transparent 1px) 0 0 / 44px 44px, var(--lv-bg); }
body.is-live .stage { display: none; }
#app.live-wrap { max-width: 1440px; height: 100vh; height: 100dvh; min-height: 790px; display: flex; flex-direction: column; gap: 10px;
  padding: max(10px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); }
#app.live-wrap > .bar { height: 46px; flex: none; background: var(--lv-glass); border-color: var(--lv-glass-line); font-family: var(--fb-text); }
#app.live-wrap > .bar .wordmark { font-family: var(--fd); font-size: 19px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; }
#app.live-wrap > .bar .tabs button { height: 34px; min-width: 44px; font-family: var(--fb-text); font-weight: 600; }
#app.live-wrap > .bar .tabs button[aria-current="page"] { background: var(--lv-sel); color: var(--lv-sel-text); }
#app.live-wrap > .bar .btn { font-family: var(--fb-text); }

.live { flex: 1; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 10px; font-family: var(--fb-text); color: var(--lv-text); font-variant-numeric: tabular-nums; }
.live button { font-family: inherit; color: inherit; }
.live .lab { font: 600 12px/1 var(--fb-text); letter-spacing: .12em; text-transform: uppercase; color: var(--lv-text3); }
.live .glassy { box-sizing: border-box; border-radius: 18px; background: var(--lv-glass); border: 1px solid var(--lv-glass-line); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); }
.live .solid { box-sizing: border-box; border-radius: 20px; background: var(--lv-surface); border: 1px solid var(--lv-line); box-shadow: var(--lv-shadow); }
.live .b2 { box-sizing: border-box; border-radius: 14px; border: 2px solid var(--lv-btn-line); background: var(--lv-btn); color: var(--lv-btn-text); cursor: pointer; min-height: 44px; }
.live .b2[aria-pressed="true"], .lv-ov .b2[aria-pressed="true"] { background: var(--lv-sel); color: var(--lv-sel-text); border-color: var(--lv-sel); }
.live .b2:disabled { opacity: .45; cursor: default; }
.live .bp { box-sizing: border-box; border-radius: 14px; border: 2px solid var(--lv-sel); background: var(--lv-sel); color: var(--lv-sel-text); cursor: pointer; min-height: 44px; font-weight: 700; }
.live .bp:disabled { opacity: .4; cursor: default; }
.live .ghost { box-sizing: border-box; border-radius: 12px; border: 1px solid var(--lv-glass-line); background: transparent; cursor: pointer; min-height: 44px; }
.live .ellip { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.live :focus-visible, .lv-ov :focus-visible { outline: 3px solid var(--lv-call-ink); outline-offset: 2px; }

/* pitch chips: the two-letter code on the pitch's colour */
.pc { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 30px; height: 22px; border-radius: 6px; font: 800 11px/1 var(--fm); color: #07090C; background: var(--pf); }
:root[data-theme="day"] .pc { box-shadow: inset 0 0 0 1px rgba(8,11,14,.3); }
.k-FB { --pf: var(--p-fb); --ci: var(--pi-fb); } .k-SL { --pf: var(--p-sl); --ci: var(--pi-sl); } .k-CB { --pf: var(--p-cb); --ci: var(--pi-cb); } .k-CH { --pf: var(--p-ch); --ci: var(--pi-ch); }

/* game state strip */
.lv-strip { display: flex; align-items: center; height: 64px; padding: 0 8px; min-width: 0; }
.lv-strip .sc { display: flex; flex-direction: column; gap: 6px; padding: 0 14px; border-left: 1px solid var(--lv-glass-line); min-width: 0; justify-content: center; }
.lv-strip .sc:first-child { border-left: 0; padding-left: 10px; }
.lv-strip .sc { flex: none; } .lv-strip .sc.who { flex: 0 1 auto; } .lv-strip .sc.who .v { min-width: 0; }
.lv-strip .sc .k { font: 600 12px/1 var(--fb-text); letter-spacing: .12em; text-transform: uppercase; color: var(--lv-text3); white-space: nowrap; }
.lv-strip .sc .v { font: 800 30px/1 var(--fm); letter-spacing: -.03em; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.lv-strip .inn .v { font: 700 24px/1 var(--fd); letter-spacing: .01em; text-transform: uppercase; }
.lv-strip .row { display: flex; align-items: center; gap: 14px; }
.lv-strip .dots { display: flex; flex-direction: column; gap: 6px; }
.lv-strip .dots span { display: flex; align-items: center; gap: 5px; font: 700 11px/1 var(--fm); color: var(--lv-text3); }
.lv-strip .dots span b { width: 13px; font-weight: 700; }
.lv-strip i.d { width: 12px; height: 12px; border-radius: 50%; box-sizing: border-box; border: 2px solid var(--lv-text3); display: inline-block; }
.lv-strip i.d.on { background: var(--lv-text); border-color: var(--lv-text); }
.lv-strip i.d.o { width: 16px; height: 16px; }
.lv-strip .score .v { font-size: 26px; gap: 14px; }
.lv-strip .score small { display: flex; flex-direction: column; align-items: center; gap: 5px; font: inherit; }
.lv-strip .score small .k { font-size: 12px; }
.lv-strip .score .them { color: var(--lv-text2); }
.lv-strip .who .v { font: 700 21px/1 var(--fd); letter-spacing: 0; gap: 8px; }
.lv-strip .who .v span { font: 700 15px/1 var(--fm); color: var(--lv-text2); }
.lv-strip .end { margin-left: auto; display: flex; gap: 8px; align-items: center; flex: none; padding-left: 10px; }
.lv-strip .stamp { height: 50px; padding: 0 12px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 5px; max-width: 170px; text-align: left; }
.lv-strip .stamp .k { font: 600 11px/1 var(--fb-text); letter-spacing: .12em; text-transform: uppercase; color: var(--lv-text3); max-width: 100%; }
.lv-strip .stamp .t { font: 700 14px/1 var(--fb-text); max-width: 100%; }
.lv-strip .icon { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; padding: 0; }
.lv-strip .correct { height: 50px; padding: 0 16px; display: flex; align-items: center; gap: 8px; font: 700 16px/1 var(--fb-text); border-radius: 12px; }

/* three columns */
.lv-mid { display: grid; grid-template-columns: 268px minmax(0, 1fr) 312px; gap: 10px; min-height: 0; }
.lv-col { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
.lv-col.left { overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }   /* a long arsenal scrolls inside the column, never over the results */

/* hitter */
.lv-hitter { flex: none; padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; }
.lv-hitter .top { display: flex; justify-content: space-between; gap: 8px; }
.lv-hitter .nm { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.lv-hitter .nm b { font: 700 32px/1 var(--fd); }
.lv-tag { height: 28px; display: inline-flex; align-items: center; padding: 0 10px; border-radius: 8px; background: var(--lv-chip-bg); border: 1px solid var(--lv-glass-line); font: 700 14px/1 var(--fb-text); flex: none; white-space: nowrap; }
.lv-hitter .read { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lv-hitter .read em { font: 800 10px/1 var(--fb-text); font-style: normal; letter-spacing: .12em; padding: 4px 6px; border-radius: 4px; background: var(--lv-text); color: var(--lv-bg); flex: none; }
.lv-hitter .read span { font: 700 16px/1.15 var(--fb-text); }
.lv-hitter .read span.none { color: var(--lv-text2); font-weight: 600; }

/* pitcher */
.lv-pitcher { flex: none; padding: 13px 14px; display: flex; flex-direction: column; gap: 9px; }
.lv-pitcher .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.lv-pitcher .top > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lv-pitcher .top > div:last-child { flex: none; }
.lv-pitcher .top b { font: 700 23px/1 var(--fd); }
.lv-pitcher .top .n { font: 800 25px/1 var(--fm); text-align: right; }
.lv-meter { position: relative; height: 8px; border-radius: 4px; background: var(--lv-surface3); }
.lv-meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--lv-text); }
.lv-meter > i.over { background: var(--lv-warn); }
.lv-meter > b { position: absolute; top: -5px; width: 3px; height: 18px; border-radius: 2px; background: var(--lv-text); transform: translateX(-1px); }
.lv-pitcher .fat { font: 500 13px/1.2 var(--fb-text); color: var(--lv-text2); }
.lv-pitcher .hdr { display: flex; justify-content: space-between; gap: 8px; }
.lv-trust { display: flex; flex-direction: column; gap: 7px; }
.lv-trust .tr { display: flex; flex-direction: column; gap: 4px; }
.lv-trust .line { display: flex; align-items: center; gap: 8px; height: 24px; }
.lv-trust .tbar { flex: 1; position: relative; height: 10px; border-radius: 5px; background: var(--lv-surface3); }
.lv-trust .tbar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; background: var(--ci); }
.lv-trust .tr.below .tbar > i { background: var(--lv-text3); }
.lv-trust .tbar > b, .lv-read .tbar > b { position: absolute; top: -4px; width: 2px; height: 18px; background: var(--lv-text); transform: translateX(-1px); }
.lv-trust .v { width: 38px; text-align: right; font: 800 15px/1 var(--fm); }
.lv-trust .tr.below .v { color: var(--lv-warn-text); }
.lv-trust .s { width: 36px; text-align: right; font: 600 12px/1 var(--fm); color: var(--lv-text3); }
.lv-trust .msg { padding-left: 38px; font: 700 12px/1.2 var(--fb-text); color: var(--lv-warn-text); }
.lv-trustnote { display: flex; align-items: center; gap: 8px; min-width: 0; font: 600 12px/1.2 var(--fb-text); color: var(--lv-text2); }
.lv-trustnote::before { content: ""; width: 2px; height: 14px; flex: none; background: var(--lv-text); }

/* pitch log */
.lv-log { container-type: inline-size; container-name: log; flex: 1; min-height: 100px; padding: 8px 8px 8px; display: flex; flex-direction: column; gap: 4px; }
.lv-log .hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0 4px 2px 6px; min-height: 44px; }
.lv-log .hd > div { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lv-log .hd small { font: 500 12px/1 var(--fb-text); color: var(--lv-text3); }
.lv-log .hd .b2 { height: 44px; padding: 0 12px; font: 700 14px/1 var(--fb-text); border-width: 1.5px; flex: none; }
.lv-log .rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; overscroll-behavior: contain; }
.lv-log .empty { padding: 10px 8px; font: 500 14px/1.35 var(--fb-text); color: var(--lv-text2); }
.log-row { flex: none; height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--lv-glass-line); background: var(--lv-row-bg); text-align: left; cursor: pointer; width: 100%; }
.log-row.pa-end { border-color: var(--lv-line); }
.log-row .n { width: 24px; flex: none; font: 700 12px/1 var(--fm); color: var(--lv-text3); }
.log-row .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.log-row .tx b { font: 700 14px/1 var(--fb-text); }
.log-row .tx small { font: 500 11px/1 var(--fb-text); color: var(--lv-text3); }
.log-row .ct { font: 800 13px/1 var(--fm); color: var(--lv-text2); flex: none; }
.log-row svg { flex: none; }
@container log (max-width: 250px) { .log-row > span:last-child { display: none; } .log-row { gap: 7px; padding: 0 8px; } }

/* the call */
.lv-call { border-radius: 22px; min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.lv-band { flex: none; display: flex; gap: 16px; align-items: center; padding: 16px 18px; background: var(--lv-call); color: #07090C; }
.lv-sign { width: 104px; height: 118px; flex: none; border-radius: 16px; background: #07090C; color: var(--lv-call); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.lv-sign small { font: 700 12px/1 var(--fb-text); letter-spacing: .18em; color: #C9D2DB; }
.lv-sign span { font: 800 84px/1 var(--fm); }
.lv-band .words { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.lv-band .badges { display: flex; align-items: center; gap: 8px; min-width: 0; }
.lv-badge { font: 800 12px/1 var(--fb-text); letter-spacing: .14em; text-transform: uppercase; padding: 6px 9px; border-radius: 6px; background: #07090C; color: var(--lv-call); white-space: nowrap; }
.lv-badge.own { background: #FFFFFF; color: #07090C; box-shadow: inset 0 0 0 2px #07090C; }
.lv-grade { font: 800 13px/1 var(--fm); padding: 4px 8px; border-radius: 6px; border: 2px solid #07090C; white-space: nowrap; }
.lv-band .pitch { margin: 0; font: 800 68px/.86 var(--fd); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-band .spot { margin: 0; font: 700 30px/1 var(--fd); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #07090C; }
.lv-body { flex: 1; min-height: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.lv-body .split { display: flex; gap: 16px; flex: 1; min-height: 0; overflow: hidden; }
@media (min-width: 1001px) { .lv-body .split { container-type: size; container-name: split; } }
@container split (max-height: 270px) { .lv-read .tile small { display: none; } .lv-read .tile { padding-block: 6px; } }
.lv-body .why { margin: 0; flex: none; font: 500 16px/1.35 var(--fb-text); color: var(--lv-text2); text-wrap: pretty; max-width: none; grid-column: auto; }
.lv-body .why b { color: var(--lv-text); font-weight: 700; }

/* where it ended up (with the target ringed) */
.live .locpick { flex: none; display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; background: none; border: 0; border-radius: 0; }
.locpick .grid5 { display: flex; gap: 8px; }
.lgrid { display: grid; grid-template-columns: repeat(5, 44px); grid-template-rows: repeat(5, 44px); gap: 4px; }
.lc { position: relative; padding: 0; border-radius: 8px; box-sizing: border-box; cursor: pointer; background: transparent; border: 2px dashed var(--lv-line); }
.lc.z-edge { background: var(--lv-surface2); border: 2px solid var(--lv-line); }
.lc.z-heart { background: var(--lv-surface3); border: 2px solid var(--lv-text3); }
.lc.tgt.z-edge, .lc.tgt.z-heart { background: var(--lv-call); border-color: var(--lv-call); }
.lc.tgt.z-off { background: color-mix(in srgb, var(--lv-call) 22%, transparent); border-color: var(--lv-call-ink); }
.lc.tgt.z-edge::after, .lc.tgt.z-heart::after { content: ""; position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; box-sizing: border-box; border: 3px solid #07090C; }
.lc.on { background: var(--lv-sel); border: 2px solid var(--lv-sel); }
.lc.on::before { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: var(--lv-sel-text); }
.lc.on.tgt::after { border-color: var(--lv-call); }
.lwild { width: 56px; flex: none; border-radius: 10px; box-sizing: border-box; cursor: pointer; padding: 0; font: 700 15px/1.15 var(--fb-text); background: transparent; color: var(--lv-text2); border: 2px dashed var(--lv-text3); }
.lwild.on { background: var(--lv-sel); color: var(--lv-sel-text); border: 2px solid var(--lv-sel); }
.locpick .legend { display: flex; gap: 12px; align-items: center; font: 500 12px/1 var(--fb-text); color: var(--lv-text3); margin: 0; }
.locpick .legend span { display: flex; align-items: center; gap: 5px; }
.locpick .legend i { width: 12px; height: 12px; border-radius: 3px; box-sizing: border-box; }
.locpick .legend .m { background: var(--lv-surface3); box-shadow: inset 0 0 0 2px var(--lv-text3); }
.locpick .legend .e { background: var(--lv-surface2); box-shadow: inset 0 0 0 1px var(--lv-line); }
.locpick .legend .o { border: 1.5px dashed var(--lv-text3); }

/* the target when location logging is off */
.lv-zone { flex: none; display: flex; flex-direction: column; gap: 8px; }
.lv-zone svg { display: block; width: 236px; height: auto; }
@container split (min-height: 1px) { .lv-zone svg { width: auto; height: min(calc(100cqh - 28px), 300px); max-width: 260px; } }

/* readout */
.lv-read { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; container-type: inline-size; container-name: read; }
@container read (max-width: 150px) { .lv-read .tile { padding: 6px 10px; } .lv-read .tile .v b { font-size: 21px; } .lv-read .tile .v span { font-size: 13px; } .lv-read .tile small { display: none; } }
.lv-read .tile .lab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lv-read .tile { flex: 1; min-height: 0; padding: 9px 14px; border-radius: 14px; background: var(--lv-surface2); display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.lv-read .tile .v { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
.lv-read .tile .v b { font: 800 28px/1 var(--fm); letter-spacing: -.03em; }
.lv-read .tile .v span { font: 600 15px/1 var(--fb-text); color: var(--lv-text2); }
.lv-read .tile small { font: 500 13px/1.2 var(--fb-text); color: var(--lv-text3); }
.lv-read .tbar { position: relative; height: 6px; border-radius: 3px; background: var(--lv-surface3); }
.lv-read .tbar > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--lv-call-ink); }
.lv-read .tbar > b { top: -3px; height: 12px; }

/* right column: status, the mix, actions */
.lv-status { flex: none; padding: 13px 15px; border-radius: 16px; display: flex; flex-direction: column; gap: 7px; }
.lv-status.watch { background: var(--lv-warn-bg); border: 1.5px solid var(--lv-warn-line); }
.lv-status.watch .h { color: var(--lv-warn-text); }
.lv-status.change { background: #FFB224; color: #140C00; }
.lv-status .h { display: flex; align-items: center; gap: 10px; font: 800 22px/1 var(--fd); }
.lv-status.change .h { font-size: 25px; }
.lv-status p { margin: 0; padding-left: 30px; font: 500 14px/1.3 var(--fb-text); color: var(--lv-text2); }
.lv-status.change p { font-weight: 600; color: #140C00; }
.lv-status .go { margin-top: 4px; height: 50px; border-radius: 12px; border: 0; background: #140C00; color: #FFFFFF !important; font: 700 18px/1 var(--fb-text); cursor: pointer; }
.lv-mix { flex: 1; min-height: 0; padding: 13px; display: flex; flex-direction: column; gap: 9px; }
.lv-mix .hd { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.lv-mix .hd b { font: 800 21px/1 var(--fd); letter-spacing: .04em; text-transform: uppercase; }
.lv-mix .hd small { font: 500 13px/1 var(--fb-text); color: var(--lv-text3); white-space: nowrap; }
.lv-mix .segs { display: flex; height: 10px; gap: 2px; border-radius: 5px; overflow: hidden; flex: none; }
.lv-mix .segs i { height: 100%; background: var(--pf); }
.lv-mix .rows { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; overscroll-behavior: contain; }
.opt { position: relative; height: 44px; flex: none; padding: 0 12px 0 9px; border-radius: 12px; display: flex; align-items: center; gap: 9px; overflow: hidden; background: var(--lv-row-bg); box-shadow: inset 0 0 0 1px var(--lv-glass-line); }
.opt.is-call { background: var(--lv-surface); box-shadow: inset 0 0 0 2px var(--ci); }
.opt.struck { opacity: .6; }
.opt .pc { width: 34px; height: 28px; border-radius: 7px; font-size: 12px; }

  t.replaceChildren(document.createTextNode(msg));
  if (opts.sub) { const s = document.createElement("span"); s.className = "sub"; s.textContent = opts.sub; t.append(s); }
  for (const a of acts) { const b = document.createElement("button"); b.textContent = a.label; b.addEventListener("click", () => { t.hidden = true; a.fn(); }); t.append(b); }
  t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), acts.length ? 4000 : 2400);
}

const G = () => S.game;
const APP_VERSION = "2026.11.03";   // logged with every pitch
const pitcherDef = () => S.setup.staff[G().pitcher] || S.setup.staff[0];
const slotIdx = () => G().batter % S.setup.lineup.length;
const batterDef = () => S.setup.lineup[slotIdx()];
// in-game state (pitch count, batters faced, confidence, "landing today") is kept per pitcher id, so reordering or

// position; that state moves to the id the first time it's read.
const PSTATE = ["pc", "bf", "recent", "conf", "land", "regs"];
const keyOf = (i) => {
  const g = G(), pd = S.setup.staff[i], idx = String(i);
  if (!pd || !pd.id) return idx;
  for (const k of PSTATE) if (g[k] && g[k][idx] !== undefined && g[k][pd.id] === undefined) { g[k][pd.id] = g[k][idx]; delete g[k][idx]; }
  return pd.id;
};
const pKey = () => keyOf(S.setup.staff[G().pitcher] ? G().pitcher : 0);   // the pitcher in the game
const kindOf = (name) => (pitcherDef().pitches.find((p) => p.name === name) || { kind: "FB" }).kind;

function arsenal() {
  const pd = pitcherDef(), g = G();
  g.conf[pKey()] = g.conf[pKey()] || {};

  // from the database: his check-in sets today's starting feel; what's been learned adjusts stuff and command for this spot
  const ci = DB.ready && pd.id ? todayCheckin(pd.id) : null;
  // what's been learned (learner v2), as served: one step a game toward it, never more than 1.0 from his grade
  const model = DB.ready && pd.id && pd.useLearned !== false ? pModel(pd.id) : null;
  const ctx = { same_side: sameSide(), balls: g.balls, strikes: g.strikes };
  return pd.pitches.filter((d) => d.active !== false).map((d) => {
    const c = g.conf[pKey()][d.name];
    const feel = (ci && PCLearn.checkinFeel(ci, d.id)) ?? +d.feel;
    const sv = model && model.served && model.served.pitches[d.id];
    // D4: the last word, here where the calls are built: within 1.0 of his current grade (or the value he accepted), his
    // own number after "Keep mine", and a blank grade is the level average (D8). A stored served value from before a
    // re-grade can't get past this.
    const fin = PCLearner.clampServed(d, pd, sv && sv.learned ? sv : null);
    const adj = sv && sv.learned ? { grade: fin.grade, command: fin.command, traits: sv.traits && Object.keys(sv.traits).length ? sv.traits : null,
      strike_rate: fin.grade === sv.grade && fin.command === sv.command ? sv.strike_rate ?? null

      : { grade: PCLearner.coachValue(d, "grade"), command: PCLearner.coachValue(d, "command"), traits: null, strike_rate: null };

      base_conf: feel, shape: d.shape || "", velo: +d.velo || 0, slot: pd.slot, height_ft: +pd.height_ft || 6.1,

}
// pitches to add to his count so the engine's fatigue point lands on his own: his set limit, then today's check-in

}

    const b = batterDef(), m = DB.ready && b && b.hitterId ? hModel(b.hitterId) : null;

function situation() {

    margin: g.us - g.them, pitch_count: (g.pc[pKey()] || 0) + fatigueShift(pitcherDef()), batters_faced: g.bf[pKey()] || 0, level: S.setup.level,

// ------------------------------------------------------------------ the call
let shakenNow = [];   // pitch-and-spot calls he shook off on this pitch
function makeCall() {
  const r = E.callMixed(arsenal(), situation(), { exclude: shakenNow });
  G().call = { pitch: r.pick.pitch.name, quad: r.pick.quad, prob: r.pick.prob, coach: false,
    dist: r.dist.slice(0, 8).map((d) => ({ pitch: d.pitch.name, quad: d.quad, prob: d.prob })) };
}
function recall() {

  setTimeout(() => { if (!G().inningOver) makeCall(); else G().call = null; document.body.classList.remove("thinking"); save(); render(); }, 15);

// ------------------------------------------------------------------ learning (same rules as the simulator)
function updTiming(cls, signal) { const t = know().timing; t[cls] = t[cls] + 0.35 * (signal - t[cls]); }
// hitter memory is kept as "what he did against what the engine expected from this pitch" (learner v2's scale, so a
// hitter's history from past games and tonight's swings average on one scale, and a hitter who only faced an ace isn't
// marked weak). exp: the engine's expected value of a swing at this pitch, before anything is known about the hitter.
const DMG_VAL = { hard: 1.0, solid: 0.3, weak: -0.3, whiff: -0.6, foul: 0.0, hit: 0.5, out: -0.2 };

  const sw = P.whiff + P.foul + P.weak + P.solid + P.hard;
  return sw > 0 ? (P.whiff * DMG_VAL.whiff + P.foul * DMG_VAL.foul + P.weak * DMG_VAL.weak + P.solid * DMG_VAL.solid + P.hard * DMG_VAL.hard) / sw : 0;
}
function updDamage(cls, outcome, exp = 0) {
  const val = DMG_VAL[outcome];

function confEvent(ars, name, ev) { const p = ars.find((x) => x.name === name); if (p) E.updateConfidence(p, ev); }

// ------------------------------------------------------------------ recording
function snapshot() { undo.push(JSON.stringify(S.game)); if (undo.length > 80) undo.shift(); }

    const c = G().call;

  }

    thrown: crossed ? crossed.name : undefined, thrownId: crossed ? (pd0.pitches.find((x) => x.name === crossed.name) || {}).id : undefined,
    catcherId: S.setup.catcherId || null, coach: !!call.coach, choice, prob: call.prob ?? null, shaken: shakenBefore.length ? shakenBefore : undefined,
    pcRaw: g.pc[pKey()] || 0, fatigueShift: fatigueShift(pd0), checkinId: ci ? ci.id : null, regs: (g.regs || {})[pKey()] || 0,
    v: { app: APP_VERSION, engine: E.VERSION, data: E.dataVersion(), learn: PCLearn.VERSION }, deviceId: DB.deviceId || null,

// between hitters his confidence drifts back toward his bullpen feel. Counted, and the count is logged with each
// pitch, so a replay applies exactly the same drifts (an inning can also end on a caught stealing, with no last pitch)

// ------------------------------------------------------------------ actions

function tapResult(result) {

  if (needsDetail(result)) { pending = { result }; render(); return; }
  record({ result });
}

  const g = G(), ars = arsenal(); snapshot();

function undoLast() {
  if (!undo.length) return;

  // running event order stay, so undoing the first pitch can't start a second game record, and no pack version repeats
  for (const k of ["dbId", "packId", "packV", "seq", "keepEvIds"]) if (before[k] !== undefined) S.game[k] = before[k];

  snapshot(); const out = pitcherDef().id || null; g.pitcher = next; g.last = null;

// ------------------------------------------------------------------ dom
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) el.addEventListener(ev, fn);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else if (k === "style" && typeof v === "object") Object.assign(el.style, v);
    else if (v !== false && v !== null && v !== undefined) el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(3)) if (kid !== null && kid !== undefined && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
};
const pct = (x) => Math.round(x * 100) + "%";
const ord = (n) => n + (["th", "st", "nd", "rd"][((n % 100) - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

function applyTheme() {

  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute("content", day ? "#d7e0ea" : "#04070c");
  const c = S.view === "live" && G().call ? PCOLOR(kindOf(G().call.pitch)) : "var(--cb)";

// The game board is laid out for a landscape iPad (740px tall or more). In a shorter window (a laptop, a phone on its
// side) it's scaled down as a whole instead of squeezed, so nothing overlaps and the result buttons stay on screen.
const BOARD_MIN_H = 790;
function fitBoard() {
  const app = document.getElementById("app");
  const live = app.classList.contains("live-wrap");
  const z = live && innerWidth > 1000 && innerHeight < BOARD_MIN_H ? Math.max(0.55, innerHeight / BOARD_MIN_H) : 1;
  app.style.zoom = z === 1 ? "" : String(z);
  app.style.height = z === 1 ? "" : `${BOARD_MIN_H}px`;
  const t = document.getElementById("toast"); if (t) t.style.zoom = z === 1 ? "" : String(z);   // the toast sits on the board's top bar
}
addEventListener("resize", () => fitBoard());

function render() {
  applyTheme();
  const app = document.getElementById("app");
  // the database didn't open (another tab holds an older version, or it failed): said on every screen, not just once

// what tonight has shown about him: damage from his swings, and his timing once hitter reads are logged (level 3+)
function hitterRead() {
  const kn = know(), bits = [];

// catcher's view: a right-handed hitter stands on the catcher's left, so his inside half is on the left.

// the target when location logging is off: the four quadrants, "over" the middle, and the chase band

  s += `<rect x="${mx(12, 228)}" y="6" width="228" height="304" rx="12" fill="${chase ? "color-mix(in srgb, var(--lv-call) 28%, transparent)" : "var(--lv-chase)"}" stroke="${chase ? "var(--lv-call)" : "var(--lv-line)"}" stroke-width="${chase ? 3 : 2}" ${chase ? "" : 'stroke-dasharray="6 5"'}/>`;

// a lineup name -> a hitter on today's opponent: an existing one if the name matches, otherwise a new one
async function linkHitter(b, i) {
  const tid = S.setup.opponentId;
  if (!b.name) { b.hitterId = null; }
  else if (tid) {
    let x = teamHitters(tid).find((y) => y.name.toLowerCase() === b.name.toLowerCase());
    if (!x) { x = await dbPut("hitters", PCDB.newHitter(tid, { name: b.name, bats: b.hand })); DB.hitters.set(x.id, x); toast(`${b.name} added to ${DB.teams.get(tid).name}'s roster`); }

    await relearnHitter(x.id);
  } else b.hitterId = null;

  if (G().dbId) { logPlay("sub_hitter", { slotChanged: i, inId: b.hitterId || null, name: b.name, hand: b.hand }); makePack("lineup"); }

// keyboard: the result keys, undo and shake-off, when not typing in a field
document.addEventListener("keydown", (e) => {
  if (S.view !== "live" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  const k = e.key.toUpperCase();
  if (k === "ESCAPE" && liveOverlay && !G().inningOver) { e.preventDefault(); liveOverlay = null; fixingPitch = null; render(); return; }
  if (liveOverlay) return;
  const hit = KEYS.find((x) => x[2] === k);
  if (hit) { e.preventDefault(); tapResult(hit[0]); }
  else if (k === "U") { e.preventDefault(); undoLast(); }
  else if (k === "K" && G().call) { e.preventDefault(); shakeOff(); }
