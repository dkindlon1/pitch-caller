/* Achromatic ledger (taste skill, app screen), with this product's face:
   - the chrome is ink on a dugout-concrete ground; the ONE hue (signal blue) goes only on the call, the data element

   - one family, Archivo: condensed width for the call (read at arm's length between pitches), normal width for the rest.
   - pitch types are told apart the way catchers do it: by the sign number, not by colour.
   Grid: canvas max 1240px, 12 columns, 20px gutter: 12 x 86.67 + 11 x 20 = 1260 - 20 = 1240. Call spans 8, entry spans 4. */
:root {

  --border: #e1e3dd;

  --positive: #247b50;
  --warn-bg: #fff6e0; --warn-ink: #8a4b00;
  --neg-bg: #ffedea;  --neg-ink: #9b1c1f;

  --radius: 8px; --radius-c: 6px; --gap: 20px; --pad: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0b0c0b; --surface: #141614; --raised: #1d201d; --active: #262a26; --border: #232623; --rule: #1b1e1b; --control: #3d423c;
    --text: #f4f5f2; --muted: #b3b8b0; --faint: #959a92; --primary: #f4f5f2; --primary-ink: #0b0c0b;
    --hue: #6e9df0; --hue-tint: rgba(110, 157, 240, 0.16); --positive: #4fbf85;
    --warn-bg: #2a2212; --warn-ink: #f0b44c; --neg-bg: #2c1a1c; --neg-ink: #ff8a8f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #0b0c0b; --surface: #141614; --raised: #1d201d; --active: #262a26; --border: #232623; --rule: #1b1e1b; --control: #3d423c;
  --text: #f4f5f2; --muted: #b3b8b0; --faint: #959a92; --primary: #f4f5f2; --primary-ink: #0b0c0b;
  --hue: #6e9df0; --hue-tint: rgba(110, 157, 240, 0.16); --positive: #4fbf85;

  return bits.length ? "Today he's " + bits.join(", ") : "No read on him yet";
}

function zoneSVG(c) {
  // Catcher's view. A right-handed hitter stands on the catcher's left, so his inside half is on the left.
  const hand = batterDef().hand === "S" ? (pitcherDef().hand === "R" ? "L" : "R") : batterDef().hand;
  const inLeft = hand === "R";
  const kind = kindOf(c.pitch);
  const X = 62, Y = 40, W = 120, H = 150, cw = W / 3, ch = H / 3;
  const cell = (q) => { const a = inLeft ? 0 : 2, b = inLeft ? 2 : 0; return { "up-in": [a, 0], "up-away": [b, 0], "down-in": [a, 2], "down-away": [b, 2], middle: [1, 1] }[q]; };
  const at = (q, k) => {
    if (q === "chase") return E.isOffspeed(k) ? [inLeft ? X + W + 24 : X - 24, Y + H + 22] : [X + W / 2, Y - 22];
    const [cx, cy] = cell(q); return [X + cw * cx + cw / 2, Y + ch * cy + ch / 2];
  };
  let s = `<svg viewBox="0 0 244 252" role="img" aria-label="Target ${SPOT[c.quad].toLowerCase()}, catcher's view, hitter ${hand === "R" ? "right" : "left"}-handed">`;
  if (c.quad !== "chase") { const [cx, cy] = cell(c.quad); s += `<rect x="${X + cw * cx}" y="${Y + ch * cy}" width="${cw}" height="${ch}" fill="var(--hue-tint)"/>`; }
  for (let i = 1; i < 3; i++) {
    s += `<line x1="${X + cw * i}" y1="${Y}" x2="${X + cw * i}" y2="${Y + H}" stroke="var(--border)"/>`;
    s += `<line x1="${X}" y1="${Y + ch * i}" x2="${X + W}" y2="${Y + ch * i}" stroke="var(--border)"/>`;
  }
  s += `<rect x="${X}" y="${Y}" width="${W}" height="${H}" fill="none" stroke="var(--text)" stroke-width="1.5"/>`;
  const bx = inLeft ? 6 : 244 - 6 - 22;
  s += `<rect x="${bx}" y="${Y + 14}" width="22" height="${H - 28}" rx="2" fill="none" stroke="var(--control)" stroke-width="1.5"/>`;
  s += `<text x="${bx + 11}" y="${Y + H / 2 + 5}" text-anchor="middle" font-family="Archivo, sans-serif" font-size="13" font-weight="600" fill="var(--muted)">${hand}</text>`;
  s += `<text x="${inLeft ? X : X + W}" y="${Y + H + 20}" text-anchor="${inLeft ? "start" : "end"}" font-family="Archivo, sans-serif" font-size="12" fill="var(--muted)">inside</text>`;
  s += `<path d="M${X + W / 2 - 28} ${Y + H + 38} h56 v7 l-28 11 l-28 -11 z" fill="var(--surface)" stroke="var(--control)" stroke-width="1.5"/>`;
  for (const d of c.dist) {
    if (d.pitch === c.pitch && d.quad === c.quad) continue;
    const [x, y] = at(d.quad, kindOf(d.pitch));
    s += `<circle cx="${x}" cy="${y}" r="${3 + 9 * d.prob}" fill="none" stroke="var(--faint)" stroke-width="1.5"/>`;
  }
  const [tx, ty] = at(c.quad, kind);
  s += `<circle cx="${tx}" cy="${ty}" r="18" fill="var(--hue)"/>`;
  s += `<text x="${tx}" y="${ty + 7}" text-anchor="middle" font-family="Archivo, sans-serif" font-stretch="75%" font-weight="700" font-size="20" fill="#fff">${SIGN[kind]}</text>`;
  return s + `</svg>`;
}

function pickBox() {
  const ars = arsenal();
  const go = () => {
    const gr = E.gradeCall(ars, situation(), pickSel.pitch, pickSel.quad), g = G();
    g.call = Object.assign({}, g.call, { pitch: pickSel.pitch, quad: pickSel.quad, coach: true, runs: gr.runs_vs_best,

    h("div", { class: "seg", role: "group", "aria-label": "Pitch" }, ars.map((p) => h("button", { "aria-pressed": String(pickSel.pitch === p.name), on: { click: () => { pickSel.pitch = p.name; render(); } } }, `${SIGN[p.kind]}  ${p.name}`))),
    h("div", { class: "seg", role: "group", "aria-label": "Spot" }, E.QUADS.map((q) => h("button", { "aria-pressed": String(pickSel.quad === q), on: { click: () => { pickSel.quad = q; render(); } } }, SPOT[q]))),

}

const KEYS = [["ball", "Ball", "B"], ["cstrike", "Called strike", "C"], ["whiff", "Swing and miss", "S"], ["foul", "Foul", "F"], ["play", "In play", "X"], ["hbp", "Hit by pitch", "H"]];

function atBatList() {

function pitcherPanel(ars, st) {
  const g = G(), cutoff = { hs: 0.5, college_d3: 0.45, college_d1: 0.4, mlb: 0.4 }[S.setup.level];
  const status = st.status === "ok" ? null

// ------------------------------------------------------------------ setup screen

  const levelChoices = h("div", { class: "choices" }, [
    ["hs", "High school", "MaxPreps 2026 national averages, 7-inning games"], ["college_d3", "College D3", "2026 Liberty League, Empire 8, NESCAC and UAA"],
    ["college_d1", "College D1", "2026 Big East, America East and Ivy"], ["mlb", "Pro", "MLB 2010-15 run values, for comparison"],
  ].map(([k, t, d]) => h("button", { class: "choice", "aria-pressed": String(st.level === k), on: { click: () => { st.level = k; changed(true); } } }, h("b", {}, t), h("span", {}, d))));
  const tierChoices = h("div", { class: "choices" }, TIERS.map((t) => h("button", { class: "choice", "aria-pressed": String(st.inputs === t.n), on: { click: () => { st.inputs = t.n; changed(true); } } }, h("b", {}, t.t), h("span", {}, t.d))));

  const staff = st.staff.map((pd, pi) => {
    const measured = st.inputs >= 4;
    const num = (d, key, i, step, min, max, ph, label) => h("input", { id: `p${pi}-${i}-${key}`, name: `p${pi}-${i}-${key}`, type: "number", inputmode: "decimal", autocomplete: "off", step, min, max, value: d[key] ?? "", placeholder: ph || "", "aria-label": label,
      style: { width: "64px" }, on: { change: (e) => { d[key] = e.target.value === "" ? "" : +e.target.value; changed(); } } });
    const rows = pd.pitches.map((d, i) => {
      const out = h("output", {}, (+d.feel).toFixed(2));
      return h("tr", {},
        h("td", {}, h("input", { id: `p${pi}-${i}-name`, name: `p${pi}-${i}-name`, autocomplete: "off", value: d.name, "aria-label": "Pitch name", style: { minWidth: "120px" },
          on: { change: (e) => { const nn = e.target.value.trim() || KINDS[d.kind]; renamePitch(pi, d.name, nn); d.name = nn; changed(true); } } })),
        h("td", {}, h("select", { id: `p${pi}-${i}-kind`, "aria-label": "Pitch type, sets the sign", style: { minWidth: "140px" }, on: { change: (e) => { d.kind = e.target.value; d.shape = SHAPE_OPTS[d.kind][0]; changed(true); } } },
          Object.entries(KINDS).map(([k, v]) => h("option", { value: k, selected: k === d.kind ? true : null }, `${SIGN[k]}  ${v}`)))),
        h("td", {}, num(d, "grade", i, 1, 1, 5, "", "Stuff, 1 to 5")), h("td", {}, num(d, "command", i, 1, 1, 5, "", "Command, 1 to 5")),
        h("td", {}, h("div", { class: "feel" }, h("input", { id: `p${pi}-${i}-feel`, type: "range", min: 0.3, max: 0.95, step: 0.05, value: d.feel, "aria-label": "Bullpen feel",
          on: { input: (e) => { d.feel = +e.target.value; out.textContent = (+d.feel).toFixed(2); }, change: () => changed() } }), out)),
        h("td", {}, h("select", { id: `p${pi}-${i}-shape`, "aria-label": "Shape", style: { minWidth: "110px" }, on: { change: (e) => { d.shape = e.target.value; changed(); } } },
          SHAPE_OPTS[d.kind].map((s) => h("option", { value: s, selected: s === (d.shape || "") ? true : null }, s || "typical")))),
        h("td", {}, num(d, "velo", i, 1, 50, 105, "mph", "Velocity in mph")),
        measured ? [h("td", {}, num(d, "ivb", i, 0.5, -25, 25, "in", "Induced vertical break, inches")), h("td", {}, num(d, "hb", i, 0.5, -25, 25, "in", "Horizontal break, inches"))] : null,
        h("td", {}, h("button", { class: "x", "aria-label": `Remove ${d.name}`, on: { click: () => { if (pd.pitches.length > 1) { pd.pitches.splice(i, 1); changed(true); } } } }, "×")));
    });
    return h("div", { style: { display: "flex", flexDirection: "column", gap: "12px" } },
      h("div", { class: "staff-head" }, h("h3", {}, pd.name),
        st.staff.length > 1 ? h("button", { class: "btn text", on: { click: () => { st.staff.splice(pi, 1); G().pitcher = 0; changed(true); } } }, `Remove ${pd.name}`) : null),
      h("div", { class: "fields" },
        h("label", { class: "f", style: { flex: "1 1 160px" } }, "Name", h("input", { id: `pn${pi}`, name: `pn${pi}`, autocomplete: "off", value: pd.name, on: { change: (e) => { pd.name = e.target.value || `Pitcher ${pi + 1}`; changed(true); } } })),
        h("div", { class: "f" }, "Throws", h("div", { class: "hands", role: "group", "aria-label": "Throws" }, ["R", "L"].map((x) => h("button", { "aria-pressed": String(pd.hand === x), on: { click: () => { pd.hand = x; changed(true); } } }, x)))),
        h("label", { class: "f", style: { flex: "1 1 180px" } }, "Arm slot", h("select", { id: `ps${pi}`, on: { change: (e) => { pd.slot = e.target.value; changed(); } } }, SLOT_OPTS.map((s) => h("option", { value: s, selected: s === pd.slot ? true : null }, s)))),
        h("label", { class: "f", style: { width: "100px" } }, "Height, ft", h("input", { id: `pht${pi}`, type: "number", inputmode: "decimal", step: 0.1, min: 4.5, max: 7.5, value: pd.height_ft, on: { change: (e) => { pd.height_ft = +e.target.value; changed(); } } }))),
      h("div", { class: "tbl-wrap" }, h("table", { class: "ptable" },
        h("thead", {}, h("tr", {}, ["Pitch", "Type and sign", "Stuff", "Command", "Bullpen feel", "Shape", "Velo"].map((t) => h("th", {}, t)),
          measured ? [h("th", {}, "V break"), h("th", {}, "H break")] : null, h("th", {}, ""))),
        h("tbody", {}, rows))),
      h("div", {}, h("button", { class: "btn", on: { click: () => { pd.pitches.push({ name: uniqueName(pd, "Changeup"), kind: "CH", grade: 3, command: 3, feel: 0.6, shape: "fade", velo: "" }); changed(true); } } }, "Add a pitch")));
  });

  const lineup = h("div", { class: "lineup" }, st.lineup.map((b, i) => h("div", { class: "slot" },
    h("span", { class: "i" }, String(i + 1)),
    h("input", { id: `ln${i}`, name: `ln${i}`, autocomplete: "off", placeholder: `${ord(i + 1)} hitter…`, value: b.name, "aria-label": `Hitter ${i + 1} name`, on: { change: (e) => { b.name = e.target.value; changed(); } } }),
    h("div", { class: "hands", role: "group", "aria-label": `Hitter ${i + 1} bats` }, ["R", "L", "S"].map((x) => h("button", { "aria-pressed": String(b.hand === x), "aria-label": { R: "Bats right", L: "Bats left", S: "Switch hitter" }[x], on: { click: () => { b.hand = x; changed(true); } } }, x))))));

  return h("main", {},
    h("div", { class: "head" }, h("div", {}, h("h1", {}, "Setup"), h("p", { class: "sub" }, "Your level, what you'll log, your staff and their lineup. Changes apply to the game right away."))),
    row("Level", "Sets what a walk, a strikeout and a runner on third are worth, and how wild the average pitcher is.", levelChoices),
    row("What you'll log", "Pick what your charter can keep up with. Every option calls the game; more detail mostly helps it learn each hitter.", tierChoices),
    row("Staff", "Bullpen feel is how much he trusts each pitch warming up. It moves with every result once the game starts.", staff,
      h("div", {}, h("button", { class: "btn", on: { click: () => { st.staff.push({ name: `Pitcher ${st.staff.length + 1}`, hand: "R", slot: "three-quarter", height_ft: 6.1,
        pitches: [{ name: "Fastball", kind: "FB", grade: 3, command: 3, feel: 0.75, shape: "", velo: "" }, { name: "Curveball", kind: "CB", grade: 3, command: 3, feel: 0.65, shape: "", velo: "" }] }); changed(true); } } }, "Add a pitcher")),
      st.inputs >= 4 ? h("p", { class: "note", style: { margin: 0 } }, "Break in inches as Trackman or Rapsodo reports it: vertical is induced break, horizontal is positive toward his arm side. Leave blank to use the shape.") : null),
    row("Their lineup", "Only how each hitter bats is needed. With no scouting, every hitter starts as average and the engine learns him as the game goes.", lineup),
    row("Game", "Your staff, lineup and the game in progress are saved on this device.",
      h("div", { class: "fields" },
        h("button", { class: "btn primary", on: { click: () => { undo = []; S.game = newGame(); S.sample = false; S.view = "live"; save(); render(); toast("New game started. First pitch is up."); } } }, "Start a new game"),
        h("button", { class: "btn", on: { click: () => { undo = []; S = { setup: sampleSetup(), game: newGame(), view: "setup", sample: true }; save(); render(); toast("Sample staff and lineup loaded"); } } }, "Load the sample staff"))));
}
function uniqueName(pd, base) { let n = base, i = 2; while (pd.pitches.some((p) => p.name === n)) n = `${base} ${i++}`; return n; }
function renamePitch(pi, oldName, newName) { const c = G().conf[String(pi)]; if (c && oldName in c) { c[newName] = c[oldName]; delete c[oldName]; } }

// keyboard: the result keys, undo and shake-off, when not typing in a field
document.addEventListener("keydown", (e) => {
  if (S.view !== "live" || e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" || t.tagName === "TEXTAREA")) return;
  const k = e.key.toUpperCase();
  const hit = KEYS.find((x) => x[2] === k);
  if (hit) { e.preventDefault(); tapResult(hit[0]); }
  else if (k === "U") { e.preventDefault(); undoLast(); }
  else if (k === "K" && G().call) { e.preventDefault(); shakeOff(); }
  else if (k === "ENTER" && pending && (pending.result !== "play" || pending.out)) { e.preventDefault(); record(pending); }
  else if (k === "ESCAPE" && (pending || pickMode)) { pending = null; pickMode = false; render(); }
});

render();
</script>
