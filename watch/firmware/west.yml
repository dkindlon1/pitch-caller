# PitchIQ watch firmware workspace: Zephyr RTOS (Apache-2.0) and only the modules this firmware needs.
# Usage: mkdir ws && cp west.yml ws/manifest/ && cd ws && west init -l manifest && west update --narrow -o=--depth=1
manifest:
  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos
  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.4.2
      import:
        name-allowlist:
          - cmsis
          - cmsis_6
          - hal_nordic
          - mbedtls
          - mcuboot
          - segger
          - zcbor
          - tf-psa-crypto
  self:
    path: manifest
