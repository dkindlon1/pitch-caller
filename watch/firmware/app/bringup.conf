# Rev E bring-up variant.  Used with: -DEXTRA_CONF_FILE=bringup.conf -DEXTRA_DTC_OVERLAY_FILE=bringup.overlay
# Adds the UART log on P0.05 (TX) / P0.08 (RX), keeps RTT, and turns on src/bringup.c.  Not part of the normal build.
CONFIG_PQ_BRINGUP=y
# The board defconfig turns SERIAL/CONSOLE off; the overlay enables uart0, this makes it the console and a log backend.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=y
# RTT stays on (CONFIG_LOG_BACKEND_RTT / CONFIG_USE_SEGGER_RTT from prj.conf).
# Longer logs: the 1 s and 5 s lines plus normal output.
CONFIG_LOG_BUFFER_SIZE=2048
