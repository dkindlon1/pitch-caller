# MCUboot options for the production build (extra conf file for the mcuboot image, not in the default build).
# Downgrade prevention in software: an upgrade must have a higher version than the running image (swap-using-move supported).
# Needs a rising image version: see CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION in app/prod.conf.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
# Keep the log small and the bootloader inside its 48 KB partition.
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
