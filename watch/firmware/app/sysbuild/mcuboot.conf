# MCUboot must fit the 48 KB boot partition and has no UART on the watch.
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_BOOT_SERIAL_UART=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
# No picolibc in the toolchain used here (see power.c): MCUboot needs only the minimal library.
CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=y
