# Production hardening, NOT part of the default build.  Use it as an extra conf file:
#   west build ... -- -DEXTRA_CONF_FILE=prod.conf -DSB_EXTRA_CONF_FILE=sysbuild_prod.conf -Dmcuboot_EXTRA_CONF_FILE=sysbuild/mcuboot_prod.conf
# See README "Production build".  The unlocked bring-up build stays the default.
# SPDX-License-Identifier: Apache-2.0

# Lock the debug port (APPROTECT firmware branch) at every boot.  Recovery is still possible with a full chip erase through the
# CTRL-AP (nrfjprog --recover) on the SWD programming pads (rev C: SWD only, no charge pad); an erase wipes the bonds and the game key by design.
# (CONFIG_NRF_APPROTECT_USER_HANDLING is not available on the nRF52 series, so there is nothing to turn off.)
CONFIG_NRF_APPROTECT_LOCK=y

# The image version is what MCUboot compares for downgrade prevention (the version must rise with every release).
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0+0"
