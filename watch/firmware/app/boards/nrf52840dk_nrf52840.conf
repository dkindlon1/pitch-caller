# nRF52840 DK build: no console UART (the DK's UART console would conflict with nothing, but the log is RTT as on the
# watch, so the same RTT viewer works for both).  The call text is logged by ui.c, so make sure those lines are visible.
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PQ_BOND_CLEAR_HOLD_MS=5000
