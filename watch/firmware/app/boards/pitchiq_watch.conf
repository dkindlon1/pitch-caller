# PitchIQ watch rev B.  The stock nPM13xx charger driver needs a full C library (logf); see CONFIG_PQ_NPM1300_STOCK_CHARGER in
# Kconfig.  Remove this line and turn that option on when building with the Zephyr SDK (picolibc).
CONFIG_NPM13XX_CHARGER=n

# Accelerometer interrupt handled on the system work queue (the DK has no accelerometer, so this lives here).
CONFIG_LIS2DH_TRIGGER_GLOBAL_THREAD=y

# Settings (bonds): the watch's storage partition is 16 KB = 4 erase sectors (pitchiq_watch.dts).
CONFIG_SETTINGS_NVS_SECTOR_COUNT=4
