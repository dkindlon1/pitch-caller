# PitchIQ watch firmware: configuration common to every board.  Board specifics are in boards/<board>.conf.
# SPDX-License-Identifier: Apache-2.0

# ---- logging over SEGGER RTT only (no UART, no console, no shell) ----
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SHELL=n
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3

# ---- the single thread that runs the core is the system work queue ----
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2560
CONFIG_MAIN_STACK_SIZE=1536
CONFIG_HW_STACK_PROTECTION=y

# ---- peripherals ----
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_REGULATOR=y
CONFIG_ASSERT=n
# The stock MAX30101 driver is not used (power-cycled rail, see sensors.c); the devicetree node is still used.
CONFIG_MAX30101=n

# ---- Bluetooth: open-source Zephyr controller and host, LE Secure Connections only ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SETTINGS=y
CONFIG_BT_PRIVACY=y
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_DEVICE_NAME="PitchIQ"
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_BAS=y
# Standard Heart Rate Service (published only while the heart-rate sensor runs; harmless on the DK).
CONFIG_BT_HRS=y
# A larger ATT MTU makes firmware update quick; the 20-byte PitchIQ messages do not need it.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# Ask the phone for a 20 ms interval, as the JS app did.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=16
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=16
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
# Supervision timeout 6 s (600 x 10 ms): rides through a body-block fade; also the largest value iOS accepts.  RF review 6.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
# RF review 7/8: 1M PHY only (2M costs about 3 dB and gains nothing for 20-byte messages), +8 dBm, connection RSSI logged.
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_CONN_RSSI=y
# HRS characteristics and their CCC need an encrypted AND authenticated (passkey, LESC) link.  Firmware review 4.
CONFIG_BT_HRS_DEFAULT_PERM_RW_AUTHEN=y

# ---- bonds survive reset: settings in NVS on the "storage" partition (both boards have one, outside the MCUboot slots) ----
# Firmware review 1: without a backend Zephyr silently picks CONFIG_SETTINGS_NONE and every reset forgets the bond.
# The sector count must fit the partition: 8 x 4 KB on the DK (32 KB), 4 x 4 KB on the watch (16 KB, see boards/pitchiq_watch.conf).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# ---- watchdog (fed from the 1 s tick in app_glue.c) and cold reboot on a fatal error (main.c) ----
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_HWINFO=y

# ---- firmware update: mcumgr SMP over Bluetooth, authenticated link only, MCUboot image confirm ----
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=1024
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=3072
CONFIG_THREAD_MONITOR=n
